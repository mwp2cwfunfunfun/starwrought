    <button class="tab" data-t="chars">Characters</button>

<script>
let TREES = __TREES_JSON__;
let R = __ROSTER_JSON__;
let SHEET = __SHEET_SPEC__;
let BG = __BACKGROUNDS_JSON__;
let LANGS = __LANGUAGES_JSON__;
async function hotload(){ // live data when served over http(s); silently falls back on file://
  try{ const t=await fetch("assets/trees.json",{cache:"no-store"}); if(t.ok) TREES=await t.json();
       const r2=await fetch("assets/roster.json",{cache:"no-store"}); if(r2.ok) R=await r2.json();
       const s2=await fetch("assets/sheet_spec.json",{cache:"no-store"}); if(s2.ok) SHEET=await s2.json();
       const b2=await fetch("assets/backgrounds.json",{cache:"no-store"}); if(b2.ok) BG=await b2.json();
       const l2=await fetch("assets/languages.json",{cache:"no-store"}); if(l2.ok) LANGS=await l2.json();
       document.getElementById("who").title="live data: assets/*.json"; }catch(e){}
}
const HUES = {"Awareness":"#E8CC5A","Evade":"#8FC978","Guard":"#8FB0DC","Endure":"#D6975A",
  "Acrobatics":"#7AC4DC","Athletics":"#E89A4E","Diplomacy":"#7ABCC9","Guile":"#AE8FDC","Intimidation":"#DC7A7A","Stealth":"#8FB4E8","Lore":"#C9B47A",
  "Ambusher":"#D68FA8","Berserker":"#F0685A","Bravo":"#D6A8D6","Hunter":"#93C97A","Weaponmaster":"#C98F78",
  "Human":"#DCCB9E","Serrovane":"#B49AE8","Kestrel Reach":"#C9A87A",
  "Weapons":"#C98F78","Two-Weapon Fighting":"#E87A62","Shield Fighting":"#86B4E8","Brawling":"#D68A62","Dueling":"#D6A8D6",
  "Great Weapon Fighting":"#B87A5A","Archery":"#5CC9BC","Crossbow Fighting":"#7FA8C0","Missile Skirmishing":"#93BCB4",
  "Spear & Polearm Fighting":"#A8C97A","Armored Fighting":"#9AA8B4"};
const UNIFLARE = "A Constellation Flares on a Critical Success or Critical Failure on a roll with consequences, directly related to a talent in that Constellation. Any roll at the table counts, yours or an enemy's against you, trained or not. No stakes, no Flare. Max one new Flare per Constellation per session, and it stays Flared until you spend into it. The Constellation needn't be open: deeds ignite stars you haven't bought yet, and the milestone point that follows can buy its root.";
const ATTRC={Might:"#F0685A",Agility:"#5CC9BC",Wits:"#E8CC5A",Presence:"#B49AE8"};
const TIERC = {T:"#4A7C59",E:"#0E5F6B",M:"#C05621",L:"#B8860B"}, TIERN={T:"Trained",E:"Expert",M:"Master",L:"Legendary"};

/*RULES-BEGIN*/
// v1.8 additive math: check = d20 + level + attribute + proficiency (if any) + bonuses/penalties.
// A Threshold is the same sum with a flat 10 in place of the die — including the four Defenses,
// which are what an attacker's roll is measured against. Armor never touches a Defense: it
// subtracts Protection from damage, zone by zone, and charges Load for the privilege.
const ORDER=["T","E","M","L"], RANKPTS={T:1,E:4,M:9,L:16}, RB={T:4,E:7,M:10,L:13};
const ZONES=["Head","Torso","Arms","Legs"];
const DEFS=["Awareness","Evade","Guard","Endure"];
const DEFF={Awareness:"Wits",Evade:"Agility",Guard:"Presence",Endure:"Might"};
// the converter speaks the book's vocabulary now; these only rescue trees.json files
// written before the Defense/Bloodline rename landed
const CATLABEL={Save:"Defense",Heritage:"Bloodline"};
const catOf=n=>{const c=treeOf(n).category; return CATLABEL[c]||c;};
const catLabel=c=>CATLABEL[c]||c;
const pieceOf=nm=>(R.armorPieces||[]).find(p=>p[0]===nm)||null;
const shieldOf=nm=>(R.shields||[]).find(s=>s[0]===nm)||null;
const callingOf=nm=>(R.callings||[]).find(c=>c[0]===nm)||null;
const STUBFX = "Placeholder talent: this constellation's full spread arrives in a later packet. The point still buys rank and feeds its attribute.";
function stubTree(name, category, feeds){
  const mk=(t,base,n)=>Array.from({length:n},(_,i)=>({name:base+" "+"I II III IV V VI VII VIII IX X".split(" ")[i], tier:t, cost:1, effect:STUBFX}));
  let nodes=[{name:name+" Training", tier:"T", cost:1, root:true, effect:"You are Trained here: the constellation's rank applies. Every talent in this constellation requires this."},...mk("T","Practiced",2),...mk("E","Adept",5),...mk("M","Masterful",7),...mk("L","Paragon",8)];
  if(name.startsWith("Lore")) nodes[0]={name:"Deep Knowledge", tier:"T", cost:1, root:true, effect:"Recall and research within this field; you know its people, texts, and secrets."};
  return {category, feeds, meta:catLabel(category)+" constellation • "+feeds+" (placeholder)", sparks:"critically succeed on a check with this constellation; a story moment the GM judges worthy", nodes, stub:true};
}
const _relabelled=new WeakMap(); // one rewritten copy per authored tree, not one per call
function treeOf(name){
  const raw=TREES[name];
  if(raw){
    if(!/^Save\b/.test(raw.meta||"")) return raw;
    let fixed=_relabelled.get(raw);
    if(!fixed){ fixed={...raw, meta:raw.meta.replace(/^Save\b/,"Defense")}; _relabelled.set(raw,fixed); }
    return fixed;
  }
  if(DEFF[name]) return stubTree(name,"Defense",DEFF[name]);
  if(name==="Origin"){ // virtual: the merged identity sky (ancestry + heritage + culture)
    const at=(typeof wiz!=="undefined"&&wiz)?ancTreeName():null, ct=(typeof wiz!=="undefined"&&wiz)?wiz.picks.culName:null;
    const nodes=[...(at?treeOf(at).nodes.map(n=>({...n,_t:at})):[]), ...(ct&&treeOf(ct).category==="Culture"?treeOf(ct).nodes.map(n=>({...n,_t:ct})):[])];
    return {category:"Origin", feeds:"", sparks:"", meta:"Origin constellation: who you are, merged into one sky", nodes};
  }
  if(name.startsWith("Lore")&&TREES["Lore"]) // every Lore (X) is an instance of the authored Lore template
    return {...TREES["Lore"], meta:"Skill constellation • Wits ("+name.replace(/^Lore \(?|\)$/g,"")+" field)"};
  if(name.startsWith("Lore")) return stubTree(name,"Skill","Wits");
  const sk=R.skillRoster.find(s=>s[0]===name); if(sk) return stubTree(name,"Skill",sk[1]);
  const ws=R.weaponStyles.find(s=>s[0]===name); if(ws) return stubTree(name,"Combat Style",ws[1]);
  return stubTree(name,"Skill","Wits");
}
function allTreeNames(){
  const s=new Set(Object.keys(TREES));
  R.skillRoster.forEach(x=>s.add(x[0])); R.weaponStyles.forEach(x=>s.add(x[0]));
  return [...s];
}
const gatesFor=c=>({T:1,E:5,M:13,L:19}); // v0.23: one gate schedule for every constellation
function pointsIn(ch,t){ return (ch.talents[t]||[]).length; }
const ORIGINCATS=["Ancestry","Culture"];
function originPts(ch,extra=0){ let s2=0; for(const t of Object.keys(ch.talents)) if(ORIGINCATS.includes(treeOf(t).category)) s2+=pointsIn(ch,t); return s2+extra; }
function rankOf(ch,t,extraPts=0){
  const tr=treeOf(t), g=gatesFor(tr.category);
  const p=(ORIGINCATS.includes(tr.category)?originPts(ch,extraPts):pointsIn(ch,t)+extraPts); // Origin: merged progression
  let r=null;
  for(const tier of ORDER) if(p>=RANKPTS[tier] && ch.level>=g[tier]) r=tier;
  return r; // null = untrained
}
function attrPoints(ch,attr){
  let s=0;
  for(const t of Object.keys(ch.talents)){
    const tr=treeOf(t);
    for(const nm of ch.talents[t]){
      const nd=tr.nodes.find(x=>x.name===nm);
      if(((nd&&nd.feeds)||tr.feeds)===attr) s++;
    }
  }
  return s;
}
function attrBonus(p){ return Math.min(5, Math.floor(p/3)); } // v3.0: ÷3, round down, cap +5 (0–2 pts = +0)
function armorOf(ch){ const a=ch.armor||{}; return ZONES.map(z=>pieceOf(a[z])).filter(Boolean); }
// PHB v3.0 ch.2: Tiny/Small are harder targets and worse walls; Large/Huge are the reverse.
const SIZEMOD={Tiny:{Evade:2,Guard:-2},Small:{Evade:1,Guard:-1},Medium:{},
               Large:{Evade:-1,Guard:1},Huge:{Evade:-2,Guard:2},Gargantuan:{Evade:-2,Guard:2}};
const NATREACH={Tiny:"Adjacent",Small:"1 ft",Medium:"2 ft",Large:"4 ft",Huge:"varies",Gargantuan:"varies"};
function derive(ch){
  const A={}; for(const a of ["Might","Agility","Wits","Presence"]) A[a]=attrBonus(attrPoints(ch,a));
  const anc=R.ancestries.find(a=>a.name===ch.ancestry)||{hp:8,speed:"25 ft",senses:"—",size:"Medium"};
  const cal=callingOf(ch.calling);
  const perLvl=(anc.hp||0)+(cal?cal[2]:0);
  const lvl=Math.max(1,ch.level);
  const hp=10+perLvl*lvl; // PHB ch.2: 10 + Ancestry HP + Calling HP, and again every level after

  // ---- armor: four zones, each its own Protection, Load, and material. Defenses are untouched.
  const worn=armorOf(ch), prot={};
  ZONES.forEach(z=>{ const p=pieceOf((ch.armor||{})[z]); prot[z]=p?p[2]:0; });
  const loadArmor=worn.reduce((a,p)=>a+p[3],0);
  // v3.0: a matched harness is same MATERIAL and same Protection, and it cuts Load Strain, not Load
  const matched=worn.length===4&&new Set(worn.map(p=>p[2])).size===1
                &&new Set(worn.map(p=>p[6]||"")).size===1;
  if(matched) prot.Torso+=1;
  const sh=shieldOf(ch.shield);
  const loadTotal=loadArmor+(sh?sh[3]:0);
  const endR=rankOf(ch,"Endure"), relief=({T:1,E:2,M:3,L:4})[endR]||0;
  // v3.0 ch.5: Load Strain is the Load itself. Might no longer offsets it; Endure does.
  const strain=Math.max(0, loadArmor-relief-(matched?1:0));
  const torso=worn.find(p=>p[1]==="Torso"), hardOn=p=>/mail|plate/i.test(p[6]||p[5]||"");
  const clatter=worn.filter(hardOn).length>=2 && !(torso&&hardOn(torso));
  const noisy=clatter||worn.some(p=>/noisy/i.test(p[5]||""));
  const quietOnly=worn.length>0&&worn.every(p=>/quiet/i.test(p[5]||""));
  const weakness={}; // the damage type each zone's material turns poorly (−1 Protection)
  ZONES.forEach(z=>{ const p=pieceOf((ch.armor||{})[z]);
    const m=p&&(R.materials||[]).find(x=>x[0]===(p[6]||""));
    weakness[z]=(m&&m[1]!=="nothing")?m[1]:null; });

  // ---- the four Defenses
  const size=anc.size||"Medium", sz=SIZEMOD[size]||{};
  const D={}, DT={}, DR={};
  for(const d of DEFS){
    const r=rankOf(ch,d); DR[d]=r;
    let v=lvl+(A[DEFF[d]]||0)+(r?RB[r]:0)+(sz[d]||0);
    if(d==="Evade") v-=strain;
    D[d]=v; DT[d]=10+v; // D = what you roll and add; DT = the Threshold an attacker is measured against
  }
  const wr=rankOf(ch,"Weapons");
  return {A, hpMax:hp, hpPerLvl:perLvl, calling:cal, D, DT, DR, prot, size, weakness,
    loadArmor, loadTotal, strain, endureRelief:relief, noisy, clatter, matched, quietOnly,
    shield:sh, shieldBonus:sh?sh[1]:0, natReach:NATREACH[size]||"2 ft",
    init:D.Awareness, speed:anc.speed, senses:anc.senses,
    restHP:Math.max(lvl, lvl*(A.Presence||0)),      // a night's rest: level × Presence, minimum level
    recoveryTh:10+lvl+(ch.dying||0),                 // Recovery check Threshold while Dying
    dice:lvl>=19?4:lvl>=12?3:lvl>=4?2:1,             // PHB ch.5: 2 dice at 4th, 3 at 12th, 4 at 19th
    spec:({T:0,E:2,M:3,L:4})[wr]||0,                 // weapon specialization rides the Weapons rank
    weaponProf:wr?RB[wr]:0, weaponRank:wr};
}
function ownsTalent(ch,t,n){ return (ch.talents[t]||[]).includes(n); }
function canBuy(ch,t,node,creation){
  if(ownsTalent(ch,t,node.name)) return {ok:false,why:"owned"};
  if(node.hroot) return {ok:false,why:"heritage root, granted by choosing this heritage"};
  if(node.root&&ORIGINCATS.includes(treeOf(t).category)) return {ok:false,why:"identity roots come from your chargen choices, never from points"};
  const root=treeOf(t).nodes.find(x=>x.root);
  if(root && !ownsTalent(ch,t,root.name) && node.name!==root.name) return {ok:false,why:"requires "+root.name};
  if(node.requires&&node.requires.length&&!node.requires.some(rq=>(ch.talents[t]||[]).some(o=>nrmG(o)===nrmG(rq))))
    return {ok:false,why:"requires "+node.requires.join(" or ")};
  const after=rankOf(ch,t,1);
  if(!after || ORDER.indexOf(node.tier)>ORDER.indexOf(after)) return {ok:false,why:TIERN[node.tier]+" locked (points/level gate)"};
  if(node.name.includes("★") && !(ch.talents[t]||[]).some(n=>{const nd=treeOf(t).nodes.find(x=>x.name===n); return nd&&nd.tier==="M";}))
    return {ok:false,why:"capstone needs a Master talent here first"};
  return {ok:true};
}
function buy(ch,t,name){ (ch.talents[t]=ch.talents[t]||[]).push(name); }
/*RULES-END*/

const NOARMOR=()=>({Head:null,Torso:null,Arms:null,Legs:null});
function migrate(c){ // older saves predate zone armor, Callings on the sheet, and two renames
  if(!c.armor) c.armor=NOARMOR();
  if(c.shield===undefined) c.shield=null;
  if(c.exposed===undefined) c.exposed={};
  if(c.dying===undefined) c.dying=0;
  if(c.wounded===undefined) c.wounded=0;
  if(c.pressed!==undefined) delete c.pressed; // v3.0 retired Pressed; a Graze Exposes a Zone instead
  if(c.wornArmor!==undefined) delete c.wornArmor; // the "+3 budget" armor model is retired
  if(c.heritage&&!c.bloodline){ c.bloodline=c.heritage; delete c.heritage; } // v3.0 rename
  const RENAME={"Fortitude":"Endure","Reflex":"Evade","Will":"Guard","Rage":"Berserker",
                "Keleshite":"Kestrel Reach","Chelaxian":"Serrovane"}, // style-ok: retired names, named here only to rename them away
        TALENT={"Fortitude Training":"Endure Training","Reflex Training":"Evade Training",
                "Will Training":"Guard Training","Simple Weapons Training":"Weapons Training",
                "SNEAK ATTACK (spine)":"Sneak Attack","RAGE ◆ (spine)":"Rage ◆","Rage":"Rage ◆",
                "Human":"Humanity","Keleshite":"Reacher","Chelaxian":"Serrovanian", // style-ok: same, talent-level
                "Skirmisher’s Step":"Skirmisher's Step"};
  for(const [was,now] of Object.entries(RENAME)){
    if(!c.talents[was]) continue;
    const moved=c.talents[was].map(n=>TALENT[n]||n);
    c.talents[now]=[...new Set([...(c.talents[now]||[]), ...moved])];
    delete c.talents[was];
    if(c.sparks&&c.sparks[was]){ c.sparks[now]=true; delete c.sparks[was]; }
  }
  for(const t of Object.keys(c.talents)) c.talents[t]=c.talents[t].map(n=>TALENT[n]||n);
  // Drop anything that no longer exists in the data: retired constellations (the four Armor
  // trees) and pruned tiers. A name that isn't authored and isn't a legal placeholder would
  // otherwise fall through to the generic stub and quietly feed Wits forever.
  const placeholder=t=>/^Lore \(/.test(t)
    ||(R.skillRoster||[]).some(s=>s[0]===t)||(R.weaponStyles||[]).some(s=>s[0]===t);
  for(const t of Object.keys(c.talents)){
    if(TREES[t]){ const have=new Set(TREES[t].nodes.map(n=>n.name));
      c.talents[t]=c.talents[t].filter(n=>have.has(n)); }
    else if(!placeholder(t)) c.talents[t]=[];
    if(!c.talents[t].length){ delete c.talents[t]; if(c.sparks) delete c.sparks[t]; }
  }
  // Infer the Calling only AFTER the renames: a v1.8 save calls the tree "Rage", and it is
  // "Berserker" that carries the Calling category now.
  if(c.calling===undefined||c.calling===null){
    const t=Object.keys(c.talents).find(t2=>TREES[t2]&&TREES[t2].category==="Calling");
    c.calling=t||null;
  }
  return c;
}

function attackRows(c){
  // v3.0: the attack roll is always Weapons proficiency; the style only decides which attribute
  // rides along. Damage is weapon dice + specialization + Might. A Graze is one die and nothing else.
  const d=derive(c), rows=[], lvl=Math.max(1,c.level);
  const mods=[d.spec?"+"+d.spec:"", d.A.Might?"+"+d.A.Might:""].filter(Boolean).join(" ");
  const dmg=die=>`${d.dice}${die}${mods?" "+mods:""}`;
  const styles=Object.keys(c.talents).filter(t=>treeOf(t).category==="Combat Style"&&pointsIn(c,t));
  for(const t of styles){
    const tr=treeOf(t);
    rows.push(["any "+t.toLowerCase()+" weapon", t+" (exploits open)",
      "+"+(lvl+(d.A[tr.feeds]||0)+d.weaponProf), dmg("d8"), tr.stub?"placeholder":"weapon's own die"]);
  }
  const fists=(c.talents["Brawling"]||[]).includes("Iron Fists");
  rows.push(["Unarmed strike","Brawling"+(styles.includes("Brawling")?"":" (style unlearned)"),
    "+"+(lvl+d.A.Might+d.weaponProf), dmg(fists?"d6":"d4"), fists?"lethal by choice":"agile, close, finesse, nonlethal"]);
  return rows;
}

// ---------- wizard ----------
let wiz=null;
// v3.0 chargen: 0 free roots · 1 Ancestry · 2 Bloodline · 3 Culture · 4 Background
//               5 Calling · 6 Defenses · 7 Comets · 8 Review
// The three Origin roots (Ancestry, Bloodline, Culture) are Origin Talent Points granted by the
// choices themselves, so those steps ask for no spending. A finished 1st-level character has 17
// Talent Points: 5 granted free, and 12 from creation. See PHB v3.0 ch.3.
const rootNamed=(tree,nm)=>!!tree&&treeOf(tree).nodes.some(n=>(n.root||n.hroot)&&n.name===nm);
function grantSourceStep(nm){
  const p=wiz.picks, has=(l,n2)=>(l||[]).some(id=>id.endsWith("||"+n2));
  const anc=wiz.ch.ancestry?ancTreeName():null;
  if(p.her===nm) return 2;                       // bloodline root: free with the bloodline choice
  if(anc&&rootNamed(anc,nm)&&nm!==p.her) return 1;
  if(p.culName&&rootNamed(p.culName,nm)) return 3;
  if(has(p.bgA,nm)||has(p.bgB,nm)||has(p.bgLore,nm)) return 4;
  if(has(p.calling,nm)||has(p.calSkill,nm)) return 5;
  if(has(p.def,nm)) return 6;
  return 7;
}
function grantPickersHTML(stepNo){
  const gch=wizCh(null); wiz.picks.tg=wiz.picks.tg||{}; let h="";
  for(const t2 of Object.keys(gch.talents)) for(const nm2 of gch.talents[t2]){
    const nd=treeOf(t2).nodes.find(x=>x.name===nm2); if(!nd||!nd.grant) continue;
    if(grantSourceStep(nm2)!==stepNo) continue;
    const gr=nd.grant; wiz.picks.tg[nm2]=wiz.picks.tg[nm2]||[];
    const scopeTrees=gr.mode==="open"
      ?allTreeNames().filter(n=>{const c2=treeOf(n).category; return (gr.scope!=="non-Skill"||c2!=="Skill")&&!ORIGINCATS.includes(c2)&&pointsIn(gch,n)===0;})
      :gr.scope==="opened"?allTreeNames().filter(n=>pointsIn(gch,n)>0):allTreeNames().filter(n=>treeOf(n).category===gr.scope);
    h+=`<div class="callout"><b>${nm2.replace(" ★","")}</b> grants <b>${gr.n} point${gr.n>1?"s":""}</b>: ${gr.mode==="open"?`to open any ${gr.scope==="non-Skill"?"non-Skill ":""}constellation you haven't started (the point buys its root)`:gr.scope==="opened"?"in any constellation you've opened":(gr.mode==="one"?`in one ${gr.scope} of your choice (all in the same one)`:gr.mode==="different"?`in ${gr.n} different ${gr.scope}s`:`in any ${gr.scope}`)}. Spend now. <span class="pill">${wiz.picks.tg[nm2].length}/${gr.n}</span></div>`;
    h+=talentPicker([...new Set([...scopeTrees, ...wiz.picks.tg[nm2].map(x=>x.split("||")[0])])], wiz.picks.tg[nm2], "tg:"+nm2, gr.n, ()=>wizCh(null));
  }
  return h;
}
function stepComplete(sn){
  if(stepGate(sn)) return false;
  return pools().filter(x=>x.step===sn&&x.ready).every(x=>x.spent>=x.need);
}
function stepGate(s){ // only IDENTITY choices gate movement — points can be spent whenever
  const p=wiz.picks;
  if(s===1&&!wiz.ch.ancestry) return "choose an ancestry";
  if(s===2&&!p.her) return "choose a bloodline";
  if(s===3&&!p.culName) return "choose a culture";
  if(s===4&&!p.bg) return "choose a background";
  if(s===5&&!p.calName) return "choose a calling";
  return "";
}
// the ONLY structural dependency: bloodlines live inside your ancestry's constellation.
// everything else — culture, background, free points, review — is visitable in any order.
function canJump(i){ if(i<=wiz.step) return true; for(let k=wiz.step;k<i;k++) if(!stepComplete(k)) return false; return true; }
function bgPair(){ const b=bgData()&&wiz.picks.bg?bgData().find(x=>x.name===wiz.picks.bg):null; return (b&&b.skills)||[]; }
function bgLoreName(){ const b=bgData()&&wiz.picks.bg?bgData().find(x=>x.name===wiz.picks.bg):null; return (b&&b.lore)||null; }
function calSkillName(){ const cn=wiz.picks.calName; if(!cn) return null;
  const s=(treeOf(cn).skills||[])[0]; if(s) return s;
  const row=callingOf(cn); return row?row[1]:null; }
function pools(){ // every talent point the wizard grants: where it may go, and whether it's placed
  const p=wiz.picks, out=[];
  // steps 1–3 buy nothing: the three Origin roots are granted by the choices themselves
  const pair=bgPair(), lore=bgLoreName();
  if(!p.bg) out.push({step:4,label:"Background points",need:3,spent:0,where:"choose a background first",ready:false});
  else{
    out.push({step:4,label:`Trained in ${pair[0]||"its first skill"}`,need:1,spent:(p.bgA||[]).length,
      where:`1 Skill Talent Point in ${pair[0]||"the background's first skill"}`,ready:!!pair.length});
    out.push({step:4,label:`Trained in ${pair[1]||"its second skill"}`,need:1,spent:(p.bgB||[]).length,
      where:`1 Skill Talent Point in ${pair[1]||"the background's second skill"}`,ready:pair.length>1});
    out.push({step:4,label:lore?`Trained in ${lore}`:"Lore Talent Point",need:1,spent:(p.bgLore||[]).length,
      where:lore?`1 Lore Talent Point in ${lore}`:"the background's Lore",ready:!!lore});
  }
  out.push({step:5,label:"Calling point",need:1,spent:(p.calling||[]).length,
    where:p.calName?`in ${p.calName} (it buys the signature talent at its root)`:"choose a calling first",ready:!!p.calName});
  const cs=calSkillName();
  out.push({step:5,label:cs?`Trained in ${cs}`:"Calling's skill Training",need:1,spent:(p.calSkill||[]).length,
    where:cs?`1 point in ${cs}, granted by your Calling`:"choose a calling first",ready:!!cs});
  out.push({step:6,label:"Defense point",need:1,spent:(p.def||[]).length,
    where:"1 point in Awareness, Evade, Guard, or Endure (all four are already Trained, free)",ready:true});
  out.push({step:7,label:"Comets",need:3,spent:p.free.length,where:"anywhere you like, even unopened skies",ready:true});
  // grants from owned talents render ON THE STEP where the talent was acquired
  const gch=wizCh(null); p.tg=p.tg||{};
  for(const t2 of Object.keys(gch.talents)) for(const nm2 of gch.talents[t2]){
    const nd=treeOf(t2).nodes.find(x=>x.name===nm2); if(!nd||!nd.grant) continue;
    const gr=nd.grant, cur=(p.tg[nm2]||[]);
    out.push({step:grantSourceStep(nm2),label:`${nm2.replace(" ★","")} grant`,need:gr.n,spent:cur.length,
      where:gr.mode==="open"?`opens a new ${gr.scope==="non-Skill"?"non-Skill":""} constellation (buys its root)`:gr.scope==="opened"?"any constellation you've opened":(gr.mode==="one"?`in one ${gr.scope} (all in the same one)`:gr.mode==="different"?`in ${gr.n} different ${gr.scope}s`:`in any ${gr.scope}`),ready:true});
  }
  return out;
}
function saveBlockers(){
  const p=wiz.picks, out=[];
  for(let s=1;s<6;s++){ const g=stepGate(s); if(g) out.push({step:s,msg:g}); }
  const pair=bgPair(), lore=bgLoreName();
  const badIn=(list,want)=>(list||[]).some(id=>id.split("||")[0]!==want);
  if(pair.length){
    if(badIn(p.bgA,pair[0])) out.push({step:4,msg:`your ${pair[0]} Training must be spent in ${pair[0]}`});
    if(pair[1]&&badIn(p.bgB,pair[1])) out.push({step:4,msg:`your ${pair[1]} Training must be spent in ${pair[1]}`});
  }
  if(lore&&badIn(p.bgLore,lore)) out.push({step:4,msg:`your Lore Talent Point must be spent in ${lore}`});
  const cs=calSkillName();
  if(cs&&(p.calSkill||[]).some(id=>id.split("||")[0]!==cs))
    out.push({step:5,msg:`your Calling's Training must be spent in ${cs}`});
  if(p.calName&&(p.calling||[]).some(id=>id.split("||")[0]!==p.calName))
    out.push({step:5,msg:`the Calling point goes in ${p.calName}`});
  const defT=(p.def||[]).map(id=>id.split("||")[0]);
  if(defT.some(t2=>!DEFS.includes(t2)))
    out.push({step:6,msg:"the Defense point goes in Awareness, Evade, Guard, or Endure"});
  // grant legality: scope + one/different modes
  for(const [nm2,list] of Object.entries(p.tg||{})){
    const nd=allTreeNames().flatMap(t2=>treeOf(t2).nodes).find(x=>x.name===nm2); if(!nd||!nd.grant||!list.length) continue;
    const gr=nd.grant, ts=list.map(id=>id.split("||")[0]);
    if(gr.mode==="open"){
      for(const id of list){ const [t2,n2]=id.split("||"); const tr2=treeOf(t2), rt2=tr2.nodes.find(x=>x.root);
        if(gr.scope==="non-Skill"&&tr2.category==="Skill") out.push({step:grantSourceStep(nm2),msg:`${nm2}'s point opens a non-Skill constellation`});
        else if(ORIGINCATS.includes(tr2.category)) out.push({step:grantSourceStep(nm2),msg:`${nm2}'s point opens a constellation outside your Origin`});
        else if(!rt2||nrmG(rt2.name)!==nrmG(n2)) out.push({step:grantSourceStep(nm2),msg:`${nm2}'s point must buy a constellation's root (it opens it)`}); }
    } else if(gr.scope!=="opened"&&gr.scope!=="anywhere"&&ts.some(t2=>treeOf(t2).category!==gr.scope))
      out.push({step:grantSourceStep(nm2),msg:`${nm2}'s grant goes in a ${gr.scope}`});
    if(gr.mode==="one"&&new Set(ts).size>1) out.push({step:grantSourceStep(nm2),msg:`${nm2}'s points must all land in the same ${gr.scope}`});
    if(gr.mode==="different"&&new Set(ts).size<list.length) out.push({step:grantSourceStep(nm2),msg:`${nm2}'s points must land in different ${gr.scope}s`});
  }
  const calT=(p.calling||[]).map(id=>id.split("||")[0]);
  if(calT.some(t2=>treeOf(t2).category!=="Calling")) out.push({step:5,msg:"the Calling point goes in a Calling constellation"});
  for(const pl of pools()){ if(pl.ready&&pl.spent<pl.need) out.push({step:pl.step,msg:`${pl.label}: ${pl.need-pl.spent} unspent (${pl.where})`}); }
  return out;
}
function poolsHTML(){
  const P=pools(), placed=P.reduce((a,x)=>a+Math.min(x.spent,x.need),0), total=P.reduce((a,x)=>a+x.need,0);

}

function skyNav(sv, key){ // mousewheel zooms at the cursor, drag pans, double-click resets
  if(!sv) return;

    if(sv._navKey!==key){ sv._navKey=key; const b=sv._navBase, v=key&&SKYVIEW[key];

  const base={w:vb[2]||1000, h:vb[3]||620};
  sv._nav=1; sv._navBase=base; sv._navKey=key;
  const cur=()=>{ const v=(sv.getAttribute("viewBox")||`0 0 ${base.w} ${base.h}`).split(/\s+/).map(Number);
    return {x:v[0],y:v[1],w:v[2],h:v[3]}; };
  const apply=v=>{ v.w=Math.max(base.w/6, Math.min(base.w, v.w)); v.h=v.w*base.h/base.w;
    v.x=Math.max(0, Math.min(base.w-v.w, v.x)); v.y=Math.max(0, Math.min(base.h-v.h, v.y));
    sv.setAttribute("viewBox", `${v.x.toFixed(1)} ${v.y.toFixed(1)} ${v.w.toFixed(1)} ${v.h.toFixed(1)}`);
    if(sv._navKey) SKYVIEW[sv._navKey]={x:v.x,y:v.y,w:v.w,h:v.h};

    const px=v.x+(e.clientX-r.left)/r.width*v.w, py=v.y+(e.clientY-r.top)/r.height*v.h;
    const f=out?1.18:1/1.18;

    if(drag.moved) apply({x:drag.v.x-(e.clientX-drag.sx)/r.width*drag.v.w, y:drag.v.y-(e.clientY-drag.sy)/r.height*drag.v.h, w:drag.v.w, h:drag.v.h}); });
  const end=e=>{ if(drag&&e.pointerId===drag.id){ drag=null; const v=cur(); sv.style.cursor=v.w<base.w-1?"grab":""; } };

          return `<div style="min-width:140px">${tn}${attrIcon(treeOf(tn).feeds||"")}${pts?` <span style="color:#D9A441">${pts}●</span>`:""}</div>`;}).join("")}</div>

    <p class="muted" style="font-size:12px;line-height:1.5;margin-top:6px">Every kind of sky that shapes a life. Click a cluster to descend to its constellations, or jump straight to one from the list on the left.</p>`
    +cats.map(c=>`<p style="font-size:12px;margin-top:6px"><b style="color:${mixW(catHue(c),.35)}">${catLabel(c)}</b>: ${groups[c].length} ${a?`(${groups[c].filter(n=>pointsIn(a,n)>0).length} open)`:""}</p>`).join("");

function drawCategory(){

  const cols=Math.min(constellations.length,Math.max(2,Math.ceil(Math.sqrt(constellations.length*1.7)))), rows=Math.ceil(constellations.length/cols);

    for(const[e1,e2]of lay.edges) s+=`<line x1="${e1.x}" y1="${e1.y}" x2="${e2.x}" y2="${e2.y}" stroke="${hue}" stroke-width="${(1.1/k).toFixed(1)}" opacity=".3" stroke-dasharray="${Math.round(5/k)} ${Math.round(6/k)}"/>`;

      s+=`<circle cx="${p.x}" cy="${p.y}" r="${nr*2}" fill="${hue}" opacity=".16"/><circle cx="${p.x}" cy="${p.y}" r="${nr}" fill="${mixW(hue,.5)}"/>`;

    s+=`</g><text x="${cx+cw/2}" y="${cy+chh-14}" text-anchor="middle" class="patlab" style="fill:${mixW(hue,.75)}">${tn}${pts?` · ${pts}●`:""}</text></g>`;
  });
  s+=`<text x="${EW/2}" y="${EH-10}" text-anchor="middle" font-size="10.5" fill="#A8BAC4" font-family="Segoe UI,sans-serif">click a constellation to study it · ⌃ zoom out returns to the Firmament</text>`;

  document.getElementById("esvg").innerHTML=s;

  P.innerHTML=`<h2 style="font-size:16px" >${catLabel(cat)}</h2><p class="muted" style="font-size:12px;margin-top:6px">${constellations.length} constellations in this sky.</p>`
    +constellations.map(tn=>{const fd=treeOf(tn).feeds, pts=a?pointsIn(a,tn):0;
      return `<p style="font-size:12px;margin-top:5px"><a class="tl" data-pat="${tn.replace(/"/g,"&quot;")}">${tn}</a>${fd?attrIcon(fd):""}${pts?` <span class="muted">${pts} pts</span>`:""}</p>`;}).join("");
  document.querySelectorAll("[data-pat]").forEach(g=>{
    g.addEventListener("click",()=>{
      etree=g.dataset.pat; localStorage.setItem("sparks-etree",etree); eview={mode:2,cat}; esel=null; ezoom="in"; render();});
    tipHover(g,()=>{ const tn=g.dataset.pat, tr=treeOf(tn), pts=a?pointsIn(a,tn):0;
      return `<div class="tt-h"><b>${tn}</b>${attrIcon(tr.feeds||"")}</div><div class="tt-d">${tr.meta||""}</div>
        <div class="tt-m">${tr.nodes.length} talents${pts?` · you have ${pts} points here`:""}</div><div class="tt-s">click to study this constellation</div>`; });
  });
}

    +R.ancestries.map(a=>{
      const tr=treeOf(a.tree), hs=(tr.nodes||[]).filter(n=>n.hroot);
      const rows=hs.length?hs.map(n=>[`✧ ${n.name}${n.feeds?` <span class="muted">(${n.feeds})</span>`:""}`, n.effect]):(a.bloodlines||a.heritages||[]);
      return `<h3>${a.name}: HP ${a.hp} • ${a.size||"Medium"} • ${a.speed}${a.senses&&a.senses!=="—"?" • "+a.senses:""}</h3>
      <p style="font-size:12px;font-style:italic;color:#4a5c66">${a.blurb}</p>
      ${rows.length?tbl(["Bloodline (choose one; root granted free)","Grants"],rows):""}
      <p class="muted">Ancestry Constellation: ${link(a.tree)}</p>`;}).join("");

  if(wikiSec==="Cultures") h+=`<div class="callout">Culture is deliberately separate from Ancestry: an orc raised among Serrovanians is simply both. Choosing a Culture grants its root free, and that root is always a language plus a scaled bonus to Diplomacy toward those who share it. You can embrace or reject your Culture, but you can't unlearn its language.</div>`
    +tbl(["Culture","Language(s)","Key attribute","About"],R.cultures.map(c=>[link(c[0]),c[1],c[2],c[3]||""]))
    +P("The Diplomacy bonus scales with your Origin Constellation: +1 while Trained, +2 at Expert, +3 at Master, +4 at Legendary.")
    +(typeof LANGS!=="undefined"&&LANGS&&LANGS.length?`<h3>Languages</h3>`+tbl(["Language","Rarity","About"],LANGS.map(l=>[l.name,l.rarity,l.desc||"—"])):"");

  if(wikiSec==="Backgrounds") h+=`<div class="callout">Your life before the road: each Background gives you Training in <b>two</b> Skills that its trade leans on, and in a relevant <b>Lore</b>. That is 2 Skill Talent Points and 1 Lore Talent Point, three of the twelve you get at creation.</div>`
    +tbl(["Background","Skills (1 point each)","Lore (1 point)","You were…"],
      (bgData()||[]).map(b=>[b.name,(b.skills||[]).map(link).join(" & "),b.lore?link(b.lore):"—",stripT(b.desc)]));

  if(wikiSec==="Callings") h+=`<div class="callout">Callings are what other games call classes, except the signature feature sits at the <b>root</b>, so your very first point buys the fantasy. 'Barbarian' was never a job. It was Rage plus Athletics plus a big axe. Now it's yours in any combination or permutation. Each Calling grants Training in 1 Skill or other Constellation, adds Hit Points per level, and gives you a special ability.</div>`
    +tbl(["Calling","Free Training","HP/lvl","Key attribute","Special ability"],
      (R.callings||[]).map(c=>[link(c[0]),link(c[1]),c[2],c[3],c[4]]))
    +P("Only your <b>first</b> Calling counts toward Hit Points, however many you open later.");

  if(wikiSec==="Defenses") h+=`<div class="callout">There are a multitude of ways you can attack your foes, and they have just as many for you. There are four ways to answer them. Your four Defenses are Constellations like any other, and your character begins play <b>Trained in all four</b>. Each works two ways: your check is what you roll, and your Threshold is what someone else has to beat.</div>`
    +tbl(["Defense","Key attribute","In a word","Physical checks","Mental checks"],
      (R.defenses||[]).map(dd=>[link(dd[0]),dd[1],dd[2],dd[3],dd[4]]))
    +P("When a physical Attack comes at you, <b>you choose</b> Evade or Guard. Awareness and Endure are almost never chosen; certain situations call for them specifically.")
    +`<div class="callout" style="border-color:#B8860B"><b>When a Defense is unavailable.</b> These limits apply to Attacks only. <b>Evade</b> is unavailable while you are Grabbed or Restrained: you cannot slip what is already holding you. <b>Guard</b> is unavailable while you are unaware of the attack, or while you have nothing in hand and no hand free: you cannot meet what you did not see or cannot reach. Against everything else, including blasts, traps, collapsing floors, poison, and fear, all four are available whenever the GM judges them relevant.</div>`
    +`<h3>Postures</h3>`
    +P("When your character receives a blow, they may spend a <b>reaction</b> to take a Posture: a way of throwing themselves into it that buys a better result, but costs something whether or not it works. Postures may only be used <i>before</i> you know whether the attack succeeded. Every character knows one Evade and one Guard posture from the start, because Training in those Constellations grants them.")
    +tbl(["Posture","Defense","Effect"],(R.postures||[]))
    +`<h3>Size</h3>`
    +P("Creatures gain an innate Evade and Guard difference against physical Attacks based on size. A small fighter is a harder target and a worse wall; a large one is the reverse, and hard to move at all.")
    +tbl(["Size","Space / token","Natural Reach","Effect on Evade & Guard"],(R.sizes||[]));

  if(wikiSec==="Skills & Styles") h+=`<div class="callout">Instead of skills, classes, and feats, everything a character can do grows on Talent Constellations. Enter any one by spending 1 point on its Root Talent; total investment sets your rank; rank unlocks deeper tiers.</div>
    <h3>Skill Constellations</h3>`
    +tbl(["Skill","Key attribute","Covers"],R.skillRoster.map(s=>[link(s[0]),s[1],s[2]]))
    +P("The <b>Lore</b> Constellation is a template: every Lore you take, Lore (Circus) or Lore (Warfare) or any other, is its own copy of it, so a character can grow several Lores side by side.")
    +`<h3>Weapons and Combat Styles</h3>`
    +`<div class="callout"><b>A Combat Style is a school of exploits, not your attack bonus.</b> Attacks always use your Weapons Proficiency, while the style you fight in sets the Attribute and opens that school's talents. Checks a Combat Style talent calls for may use Weapons Proficiency or the style's own.</div>`
    +tbl(["Style","Feeds","Fights with"],R.weaponStyles.map(w=>[link(w[0]),w[1],w[2]]))
    +P(`Everyone begins Trained via ${link("Weapons")}, which represents transferable fundamentals: measure, timing, reading an opponent, footwork, maintaining guard, committing to a strike. Attack roll = level + your style's attribute + Weapons Proficiency.`);

  if(wikiSec==="Equipment") h+=`<div class="callout"><b>What gear does, and what it doesn't.</b> Your sword does not make you accurate and your armor does not make you hard to hit. Skill does that, and skill lives in your talents. Gear decides what happens when steel finally meets you: a weapon sets the size of the wound, armor sets how much of that wound your body actually feels. This is why there are no magic plusses. Quality, craftsmanship, and enchantment give a weapon <b>Traits</b>, never numbers.</div>
    <h3>Armor</h3>`
    +P("Armor is worn in four places: Arms, Legs, Torso, Head. Each zone holds one piece, and each piece is bought, worn, and lost separately. There is no such thing as 'a suit of plate' on your sheet; there is a breastplate, a helm, a pair of vambraces, and greaves, and you own as many as you can afford. Each piece has <b>Protection</b> (subtracted from every instance of damage landing on that zone, a Graze included), <b>Load</b>, and Traits. Your torso is the number that matters most, because ordinary Hits land there.")
    +`<div class="callout" style="border-color:#B8860B"><b>Load Strain</b> = the total Load of all armor you are wearing. Subtract your Load Strain from your <b>Evade</b>, and from any Might- or Agility-related Skill check. Training in ${link("Endure")} reduces Load Strain as your rank in it rises: −1 Trained, −2 Expert, −3 Master, −4 Legendary.</div>`
    +tbl(["Piece","Zone","Protection","Load","Price","Traits","Material"],(R.armorPieces||[]))
    +`<h3>Armor of proof</h3>`
    +P("Every piece is made of something, and every material has a blow it turns badly. Against the damage type its material turns poorly, a piece's Protection is <b>reduced by 1</b>. A Zone with no armor has no material, and so has no such weakness.")
    +tbl(["Material","Turns poorly"],(R.materials||[]))
    +P("The sword rules the unarmored field, the spear point defeats mail, and the mace is the answer to plate. It is why a careful fighter carries more than one weapon, and why <i>versatile</i> is worth more than it looks: a longsword that can thrust is a longsword that can fight mail.")
    +`<h3>Two rules for mixed kit</h3>`
    +P("<b>Matched harness.</b> If all four of your pieces have the same Material <i>and</i> the same Protection value, add +1 Protection to your torso and reduce your Load Strain by 1, to a minimum of 0. A complete kit sits and moves better than a collection.")
    +P("<b>Clatter.</b> If two or more of your pieces are mail or plate while your torso piece is neither, your kit rattles: you are <i>Noisy</i> regardless of what the individual pieces say.")
    +P("Putting on or taking off a single piece takes 1 minute per point of Protection it has. You cannot sleep in armor without waking fatigued <i>unless your torso piece has Comfort</i>. A complete harness of plate with a closed helm is four pieces, Load 7, and about 45 gp.")
    +`<h3>Shields</h3>`
    +P("A shield is not armor. It grants no Protection, because it does not cover a zone; it is a tool you actively interpose, which is why it improves <b>Guard</b> and only while you Raise it. Hardness matters only if you have the Shield Block talent: it is how much damage the shield swallows before the rest reaches you. A tower shield gives you Cover when Raised, and Greater Cover if you Take Cover while it is Raised.")
    +tbl(["Shield","Item bonus to Guard when Raised","Hardness","Load","Price","Note"],
      (R.shields||[]).map(s=>[s[0],s[1]?"+"+s[1]:"—",s[2],s[3],s[4],s[5]]))
    +`<h3>Weapons</h3>`
    +P("A weapon gives you a damage die and a handful of Traits. It never touches your attack roll. <b>Damage on a Hit is your weapon's dice, plus your Might, plus your weapon specialization</b> (+2 at Expert, +3 at Master, +4 at Legendary). You roll more dice as you level: two at 4th, three at 12th, four at 19th. <b>Damage on a Graze is a single weapon die and nothing else.</b>")
    +`<h4>Handling</h4>`
    +P("All weapons are Intuitive, Practiced, or Technical. Familiarity comes from the Weapon Familiarity talent.")
    +tbl(["Handling","Meaning","If you lack Familiarity"],(R.handling||[]))
    +`<h4>Melee weapons</h4>`+tbl(["Weapon","Handling","Group","Damage","Reach","Traits","Price"],(R.weaponsMelee||[]))
    +`<h4>Ranged weapons</h4>`+tbl(["Weapon","Handling","Group","Damage","Range","Traits"],(R.weaponsRanged||[]))
    +P("Reach assumes a weapon built for a Medium wielder. <b>Total Reach = your natural Reach + the weapon's Reach</b>, measured from the edge of your space to the edge of your target's.");

  if(wikiSec==="Traits") h+=`<div class="callout">A trait is a word attached to an action, a talent, a weapon, or a piece of gear that plugs it into a rule somewhere else. Traits save the game from repeating itself: rather than writing "this counts toward your multiple attack penalty" on forty different things, each one simply has the Attack trait. <b>Traits are never flavor.</b> If a word appears in a trait line, some rule cares about it.</div>
    <h3>Action traits</h3>${tbl(["Trait","What it means"],(R.actionTraits||[]))}
    <h3>Weapon traits</h3>${tbl(["Trait","Effect"],(R.weaponTraits||[]))}
    <h3>Armor traits</h3>${tbl(["Trait","Effect"],(R.armorTraits||[]))}`;

  if(wikiSec==="Conditions") h+=tbl(["Condition","In one line"],R.conditions);

  if(wikiSec==="Actions") h+=`<div class="callout">An action takes one of the three you get each turn, marked &#9670;. An activity takes two or three, marked &#9670;&#9670; or &#9670;&#9670;&#9670;, and is a single indivisible thing: interrupt it and you lose all of it. A free action &#9671; costs nothing but can only be taken when its rule allows. A reaction &#8634; happens on someone else's turn, and you get one per round.</div>`
    +`<h3>Encounter Mode</h3>`
    +Object.entries(R.actions||{}).map(([grp,rows])=>`<h4>${grp}</h4>`+tbl(["Action / Activity","Traits","Effect"],rows)).join("")
    +`<h3>Exploration Mode</h3>`
    +P("Your Travel Speed is Speed × 10 feet per minute, Speed ÷ 10 miles per hour, or Speed miles per day. Exploration activities halve it, except Hustle, which doubles it. Difficult Terrain halves it; Greater Difficult Terrain cuts it to a third.")
    +tbl(["Activity","Speed","Effect"],(R.explorationActions||[]))
    +`<h3>Downtime Mode</h3>`
    +P("One activity per day. An activity that takes a week is the same choice made on seven consecutive days, and interrupting it loses the days already spent unless the GM says otherwise. Ordinary rest is not a Downtime Activity: a night's sleep already restores Hit Points and may clear Wounded.")
    +tbl(["Activity","Duration","Effect"],(R.downtimeActions||[]));

  if(wikiSec==="Combat") h+=`
    <h3>Striking with a weapon</h3>
    ${P("Choose your weapon and Strike. Roll Weapons against the target's chosen Defense. If it's the second time you have attacked this turn it is at −5; the third or beyond, −10.")}
    ${tbl(["Your attack roll vs. their Defense Threshold","Result"],[
      ["Beat it by 10+","<b>Critical Hit.</b> You choose the Zone. Double damage, plus critical effects."],
      ["Meet or beat it","<b>Hit.</b> Full damage, to the Torso unless a different Zone is Exposed."],
      ["Miss it by less than 10","<b>Graze.</b> They choose the Zone. Some damage, and that Zone becomes Exposed."],
      ["Miss it by 10+","<b>Miss.</b> Nothing."],
      ["Natural 20 / 1","Step the result one degree up / down"]])}
    <h3>Answering an attack</h3>
    ${P("Every attack a creature can make has a Threshold. When it comes at you, choose Evade or Guard and roll. You are rolling to get out of the way, and how well you roll decides how little of it reaches you.")}
    ${tbl(["Your Defense roll vs. their attack Threshold","Result"],[
      ["Beat it by 10+","<b>Miss.</b> Nothing touches you."],
      ["Meet or beat it","<b>Graze.</b> You choose the Zone. Some damage, and that Zone becomes Exposed."],
      ["Miss it by less than 10","<b>Hit.</b> Full damage, to your Torso unless a different Zone is Exposed."],
      ["Miss it by 10+","<b>Critical Hit.</b> The attacker chooses the Zone. Double damage, plus critical effects."],
      ["Natural 20 / 1","Step the result one degree up / down"]])}
    <h3>Damage</h3>
    <div class="callout"><b>Hit damage = [weapon dice + specialization + Might + bonuses] − Protection.</b><br><b>Graze damage = one weapon die − Protection</b>, and nothing else: no Might, no specialization, no extra dice from your level, no talent damage of any kind.</div>
    ${P("<b>Precision damage</b> comes from where you put the blow rather than how hard you swing it. It is added to a Hit and a Critical Hit, doubled along with everything else on a crit, and <i>never</i> added to a Graze. It is part of the same instance of damage, so the Zone's Protection comes off the total once, not off each part.")}
    ${P("<b>Persistent damage</b> is damage that is still happening. You take it at the end of each of your own turns, rolling fresh dice. Protection does not apply: armor turns a blow aside, and does nothing about one that already landed. Immediately after taking it, roll Endure against 10 + the level of the effect + the amount you just took to end it. An adjacent ally can spend &#9670; to give you +2. Two instances of the same type do not stack; keep the higher.")}
    <h4>Order of operations</h4>
    ${tbl(["Step","What you do"],(R.damageOrder||[]))}
    ${P("Weakness is added <i>before</i> Resistance is subtracted, so a creature with both weakness 5 (fire) and resistance 5 (fire) simply takes normal fire damage. <b>Protection alone can never reduce damage below 1.</b> Something always gets through; Resistance and Immunity can take it to 0, armor cannot.")}
    <h4>Finding a Zone's Protection</h4>
    ${tbl(["Step","What you do"],(R.protectionSteps||[]))}
    <h3>Zones, Exposed, and Recenter</h3>
    ${P("The body has four Zones: Arms, Legs, Torso, Head. Successful Strikes go to the Torso unless another Zone is Exposed. <b>A Graze always Exposes a Zone</b>, chosen by the defender; that is the cost of a defense that mostly worked.")}
    <div class="callout"><b>Exposed [Zone]</b> means that part of you is open. <b>That Zone's Protection counts as 0.</b> An ordinary Hit may be placed there instead of the Torso, and a Critical Hit there has enhanced effects. It stays Exposed until you <b>Recenter &#9670;</b>, which clears every Exposed Zone at once.</div>
    ${tbl(["Zone","Critical Hit","Critical Hit on an Exposed Zone"],(R.zones||[]))}
    <div class="callout"><b>There is no called shot.</b> You never take a penalty to aim at a body part. Precision is bought with time.</div>
    ${tbl(["Actions spent attacking","What it buys"],[["1 action","A quick attack."],["2 actions","A deliberate attack. On a critical hit, you may Expose a plausible zone."],["3 actions","A committed attack. On a hit or a critical hit, you may Expose a plausible zone."]])}
    ${P("Maneuvers create openings too: if the target's Legs are already Exposed, Trip increases its degree of success by one, and Disarm does the same against Exposed Arms.")}`;

  if(wikiSec==="Movement") h+=`
    <div class="callout"><b>Grid squares are 1 foot</b>, not the usual 5. That gives far more freedom for creatures of different sizes and weapons of different lengths. Diagonals are measured exactly: moving diagonally across a square costs about 1.4 feet, and a VTT measures it precisely.</div>
    ${P("<b>Speed</b> is how far you move with a single Stride &#9670;, in feet. A creature with Speed 25 covers 25 squares in a straight line. A <b>Step &#9670;</b> is 3 feet and never provokes reactions.")}
    <h3>Size, space, and reach</h3>
    ${tbl(["Size","Space / token","Natural Reach","Effect on Evade & Guard"],(R.sizes||[]))}
    ${P("<b>Adjacent</b> means your space and theirs are touching, with no gap at all. Touching at a corner counts. <b>Total Reach = your natural Reach + your weapon's Reach</b>, measured from the edge of your space to the edge of your target's. A weapon does not change Size when a differently-sized creature picks it up: a Large ogre wielding a Medium dagger is wielding a Medium dagger, though the ogre's greater natural Reach still increases its Total Reach.")}
    <h3>Terrain</h3>
    ${tbl(["Terrain","Cost"],[
      ["Difficult Terrain","Moving into a square costs 2 feet instead of 1."],
      ["Greater Difficult Terrain","Moving into a square costs 3 feet instead of 1."],
      ["Hazardous Terrain","Its effect applies for every five feet you move, minimum 1."]])}
    ${P("You normally cannot Step into Difficult or Greater Difficult Terrain. Narrow, slippery, uneven, or inclined surfaces may call for Acrobatics or other checks at the GM's discretion.")}`;

  if(wikiSec==="Awareness & Cover") h+=`
    <div class="callout"><b>Awareness works two ways, as every Defense does.</b> Your Awareness <i>check</i> is what you roll to find something. Your Awareness <i>Threshold</i> is the number someone else has to beat to Sneak, Hide, Feint, or Lie to you.</div>
    <h3>What your foe knows about you</h3>
    ${tbl(["Your state","What your foe knows","Effect","Examples"],(R.detection||[]))}
    ${P("<b>Staying hidden.</b> You remain Hidden or Undetected only while you have Concealment or at least Lesser Cover. While you are moving, only where you <i>finish</i> matters: crossing open ground mid-move does not reveal you, and that is the risk the Stealth check represents. But if you end your movement with neither, you are Observed however well you rolled.")}
    ${P("Sight is the only sense that finds anything precisely. Hearing, smell, and a hand on the floor can tell you roughly where something is, which is enough to make it Hidden and never enough to make it plainly seen. In darkness, Seek is a matter of listening, so it can bring a creature to Hidden and no further.")}
    <h3>Light</h3>
    ${tbl(["If a creature is in…","Effect on you"],(R.light||[]))}
    <h3>Cover</h3>
    ${P("Cover is something solid between you and your foe. Draw a line from the centre of your space to the centre of theirs; if nothing solid is in the way, they have no cover. Otherwise determine which Zones the obstacle is in front of from the attacker's side, and count them.")}
    ${tbl(["Zones covered","Grade","Effect"],(R.cover||[]))}
    ${P("<b>Apply the Zone rule.</b> An attacker cannot place a blow on a covered Zone. If a Hit would land on one, it lands on your Arms instead, or your Head if the Arms are covered too. A Critical Hit ignores this and chooses freely, because finding the gap is what a critical hit is.")}
    ${P("Cover is judged per attacker, every time. The same wall can give you Greater Cover against the archer in front of you and nothing at all against the one who walked around your flank. Nothing about cover is a property of you; it is a property of the line between you and your foe. <b>Total cover works both ways</b>: if nothing can reach you, you cannot see out either. And <b>a creature never gives more than Lesser Cover</b>, whatever it happens to be standing in front of. Bodies are not walls.")}
    <h3>Concealment</h3>
    ${P("Where cover is having something solid in the way, Concealment is not being clearly seen: +2 to your Defense while your enemy still knows exactly where you are. Dim light, fog, smoke, heavy rain, and thick snow all conceal. None of them hide you, which is why Hide &#9670; and Sneak &#9670; exist.")}`;

  if(wikiSec==="Going Down") h+=`
    <div class="callout"><b>Hit Points are not meat.</b> They are what you have left in you: wind, focus, the strength to keep your guard where it belongs, and the sort of luck that turns a killing blow into a shallow one. Losing them is not collecting wounds. It is running out of the things that keep wounds from happening. That is why a character at 3 Hit Points is not carved apart, why they come back with a night's sleep, and why a tenth-level character has more of them without having thicker skin.</div>
    <h3>Temporary Hit Points</h3>
    ${P("A buffer laid over your own. Damage comes out of them first. They are not healing, and nothing that restores Hit Points restores these. You can only have one pool at a time: keep the larger and discard the other, never add them. Losing your last Temporary Hit Point is <i>not</i> being reduced to 0, and does not make you Dying or Wounded. Protection applies before them, because Protection reduces the damage itself.")}
    <h3>Reaching 0 Hit Points</h3>
    ${P("You fall unconscious. Damage beyond what it took to drop you is simply lost. If the damage was nonlethal you are unconscious and nothing more, waking in ten minutes with 1 Hit Point. Otherwise you are <b>Dying</b>.")}
    <h3>Dying</h3>
    ${P("Dying is a value, and it counts up toward the end. Your initiative changes to go just before the effect that dropped you. You begin at <b>Dying 1</b>, or <b>Dying 2</b> if the blow was a Critical Hit, plus your Wounded value if you had one. While Dying you are unconscious and helpless: attacks against you succeed without a roll. Taking damage while Dying raises it by 1, or 2 from a Critical Hit. <b>At Dying 5, you die.</b>")}
    <h4>Recovery checks</h4>
    ${P("At the start of each of your turns while Dying, make an Endure check against a Threshold of <b>10 + your level + your Dying value</b>. It costs no action.")}
    ${tbl(["Result","Effect"],(R.recovery||[]))}
    ${P("<b>Helping.</b> An adjacent ally may spend &#9670; to give you a +2 circumstance bonus to your next Recovery check. <b>Healing.</b> Any effect that restores even 1 Hit Point to a Dying character ends their Dying at once: they are conscious, with those Hit Points, and Wounded.")}
    <h3>Wounded</h3>
    ${P("Whenever your Dying ends, for any reason, you become <b>Wounded 1</b>; if you were already Wounded, it rises by 1. Wounded clears when you rest for the night, or when an ally spends ten minutes treating you and you succeed at an Endure check against 10 + your level + your Wounded value.")}
    <h3>Refusing death</h3>
    <div class="callout" style="border-color:#B8860B">${P("When you would die, you may spend <b>all</b> of your Hero Points to refuse it. This is not a roll. It cannot fail, and nothing in the game can stop it. Your Dying drops to 0, you are unconscious and stable at 0 Hit Points, and your Wounded does not increase. You have no Hero Points until the GM awards more.")}${P("It is the only thing in Starwrought that simply happens. Spend it and describe how: the blow that should have finished you turned on a buckle, the arrow found the strap and not the throat, you got your chin down at the last possible instant. You have bought one more scene, and paid everything you had for it.")}</div>`;

  if(wikiSec==="Progression") h+=`
    <div class="callout"><b>The Flare loop:</b> ${UNIFLARE}</div>
    <h3>Milestones & levels</h3>
    ${P("Every level is four Milestones. Milestones 1–3 grant 1 Milestone Talent Point apiece, spent <b>immediately</b> in a Flared Constellation. The 4th is the level-up: HP rises, every level-based modifier and Threshold ticks up by 1, and you gain a <b>Comet</b>, a Talent Point that answers to no Constellation. Spend it immediately, anywhere, Flared or not, opened or not. <b>No Talent Point may ever be voluntarily banked.</b> If a Milestone point arrives with nothing Flared, it becomes a <b>Deferred Talent Point</b>, spent the instant something Flares.")}
    <h3>Level-up checklist</h3>
    ${P("+1 to every roll and Threshold that includes your level (that's most of them). +HP equal to Ancestry HP + Calling HP. Check tier gates (Expert at 5, Master at 13, Legendary at 19) and spend your Comet. Recompute attributes if points moved; new weapon dice at 4th, 12th, and 19th (2 / 3 / 4 dice).")}
    <h3>Also Flares</h3>
    ${P("<b>GM awards</b> for feats no die roll captured: carrying the survivor out of the fire Flares Athletics, no check required. <b>Downtime training</b>: a week with a teacher, rival, or manual Flares that constellation. This is the deliberate path to growth you haven't stumbled into at the table.")}
    <h3>Retraining</h3>
    ${P("A <b>month</b> of Downtime moves 1 already spent Talent Point anywhere legal. You cannot retrain away from a Talent in your Origin Constellation, a Root Talent, a Talent that another Talent you own requires, or one that would drop your Proficiency Rank. Characters are maps of what you've done, but maps get redrawn.")}`;

  if(wikiSec==="Thresholds") h+=`<div class="callout">A <b>Threshold</b> is what a roll is measured against: 10 + level + attribute + proficiency, the same sum as a check with a flat 10 in place of the die. The GM sets them; you roll against them.</div>`
    +tbl(["Task level","Threshold"],(R.thresholdTable||[]))
    +`<p class="muted">±2 easy/hard, ±5 very, ±10 extreme. Simple Thresholds: Untrained 10 / Trained 15 / Expert 20 / Master 30 / Legendary 40. pf2e monsters, hazards, and adventures run as printed.</p>`;
  return h;
}

// ---------- events ----------
function bind(m){
  m.querySelectorAll(".wizsky svg[data-skykey]").forEach(sv=>skyNav(sv, sv.dataset.skykey));
  m.querySelectorAll("[data-a]").forEach(b=>b.addEventListener("click",()=>act(b.dataset.a)));
  m.querySelectorAll("[data-open]").forEach(c=>c.addEventListener("click",()=>{activeId=c.dataset.open;localStorage.setItem("sparks-active",activeId);render();}));
  m.querySelectorAll("[data-anc]").forEach(c=>c.addEventListener("click",()=>{wiz.ch.ancestry=c.dataset.anc;wiz.picks.her=null;wiz.picks.tg={};wiz.err="";render();}));
  m.querySelectorAll("[data-her]").forEach(c=>c.addEventListener("click",()=>{wiz.picks.her=c.dataset.her;wiz.picks.tg={};wiz.err="";render();}));
  m.querySelectorAll("[data-cul]").forEach(c=>c.addEventListener("click",()=>{wiz.picks.culName=c.dataset.cul;wiz.err="";render();}));
  m.querySelectorAll("[data-bg]").forEach(c=>c.addEventListener("click",()=>{wiz.picks.bg=c.dataset.bg;wiz.picks.bgA=[];wiz.picks.bgB=[];wiz.picks.bgLore=[];wiz.err="";render();}));
  m.querySelectorAll("[data-cal]").forEach(c=>c.addEventListener("click",()=>{wiz.picks.calName=c.dataset.cal;wiz.picks.calling=[];wiz.picks.calSkill=[];wiz.err="";render();}));
  bindTips(m);
  m.querySelectorAll("[data-skyf]").forEach(b=>b.addEventListener("click",()=>{wiz.skyFocus=wiz.skyFocus||{};wiz.skyFocus[b.dataset.skyf]=b.dataset.skyt;render();}));
  m.querySelectorAll("[data-skytog]").forEach(b=>b.addEventListener("click",()=>{wiz.skyOpen=wiz.skyOpen||{};const k=b.dataset.skytog;wiz.skyOpen[k]=!(wiz.skyOpen[k]!==false);render();}));
  m.querySelectorAll("[data-pick]").forEach(el=>el.addEventListener("click",()=>{
    if(el.classList.contains("dis"))return;
    const key=el.dataset.pick; let id=el.dataset.id;
    if(id.startsWith("Lore||")){ const ty=prompt("What kind of Lore? (e.g., Circus, Warfare, Trade Roads)");
      if(!ty||!ty.trim()) return; id="Lore ("+ty.trim()+")||"+id.split("||")[1]; }
    if(key==="free") togg(wiz.picks.free,id,3);
    if(key==="def") togg(wiz.picks.def=wiz.picks.def||[],id,1);
    if(key==="calling") togg(wiz.picks.calling=wiz.picks.calling||[],id,1);
    if(key==="calSkill") togg(wiz.picks.calSkill=wiz.picks.calSkill||[],id,1);
    if(key==="bgA") togg(wiz.picks.bgA=wiz.picks.bgA||[],id,1);
    if(key==="bgB") togg(wiz.picks.bgB=wiz.picks.bgB||[],id,1);
    if(key==="bgLore") togg(wiz.picks.bgLore=wiz.picks.bgLore||[],id,1);
    if(key.startsWith("tg:")){ const nm2=key.slice(3); wiz.picks.tg=wiz.picks.tg||{}; wiz.picks.tg[nm2]=wiz.picks.tg[nm2]||[];
      const nd=allTreeNames().flatMap(t2=>treeOf(t2).nodes).find(x=>x.name===nm2);
      togg(wiz.picks.tg[nm2],id,(nd&&nd.grant&&nd.grant.n)||1); }
    wiz.err=""; render();
  }));
  const wn=m.querySelector("[data-wname]"); if(wn) wn.addEventListener("input",e=>wiz.ch.name=e.target.value);
  m.querySelectorAll("[data-wzone]").forEach(s=>s.addEventListener("change",e=>{
    wiz.ch.armor=Object.assign(NOARMOR(),wiz.ch.armor||{}); wiz.ch.armor[s.dataset.wzone]=e.target.value||null; render();}));
  const wsh=m.querySelector("[data-wshield]"); if(wsh) wsh.addEventListener("change",e=>{wiz.ch.shield=e.target.value||null;render();});
  m.querySelectorAll("[data-jumpc]").forEach(a2=>a2.addEventListener("click",()=>{(wiz.culShown=wiz.culShown||[]).includes(a2.dataset.jumpc)||wiz.culShown.push(a2.dataset.jumpc);render();}));
  m.querySelectorAll("[data-jump]").forEach(a2=>a2.addEventListener("click",()=>{(wiz.freeShown=wiz.freeShown||[]).includes(a2.dataset.jump)||wiz.freeShown.push(a2.dataset.jump);render();}));
  m.querySelectorAll("[data-tree]").forEach(a2=>a2.addEventListener("click",()=>{etree=a2.dataset.tree;localStorage.setItem("sparks-etree",etree);tab="explorer";eview={mode:2,cat:treeOf(etree).category};esel=null;ezoom="in";render();}));
  m.querySelectorAll("[data-et]").forEach(b=>b.addEventListener("click",()=>{etree=b.dataset.et;localStorage.setItem("sparks-etree",etree);eview={mode:2,cat:treeOf(etree).category};esel=null;ezoom="in";render();}));
  m.querySelectorAll("[data-ev]").forEach(b=>b.addEventListener("click",()=>{const mo=+b.dataset.ev; if(mo===eview.mode&&b.classList.contains("here"))return;
    ezoom="out"; eview = mo===0?{mode:0,cat:null}:{mode:1,cat:eview.cat||treeOf(etree).category}; esel=null; render();}));
  m.querySelectorAll("[data-wstep]").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.wstep; if(canJump(i)){wiz.step=i;wiz.err="";keepY=0;render();}}));
  m.querySelectorAll("[data-skyjump]").forEach(b=>b.addEventListener("click",()=>{ if(!wiz) return; wiz.skyFocus=wiz.skyFocus||{}; wiz.skyFocus.free=b.dataset.skyjump; if(canJump(7)) wiz.step=7; wiz.err=""; render(); }));
  m.querySelectorAll("[data-w]").forEach(b=>b.addEventListener("click",()=>{wikiSec=b.dataset.w;localStorage.setItem("sparks-wiki",wikiSec);render();}));
  m.querySelectorAll("[data-spark]").forEach(s=>s.addEventListener("click",()=>{const c=active();c.sparks[s.dataset.spark]=!c.sparks[s.dataset.spark];persist();}));
  m.querySelectorAll("[data-ms]").forEach(s=>s.addEventListener("click",()=>{const c=active(),n=+s.dataset.ms;
    if(n===4){ if(c.milestones>=3) act("levelup"); return; }
    if(c.milestones>=n){ c.milestones=n-1; persist(); return; }
    const flared=Object.keys(c.sparks).filter(t2=>c.sparks[t2]);
    if(!flared.length){ alert("No constellation is Flared. Flare one first (a consequential crit, a GM award, or a week's training); milestone points are spent the moment you receive them."); return; }
    c.milestones=n; c.bankedM=1; persist();
    spendModal(c,{src:"M",note:"Milestone point: spend it now (points are never banked).",onCancel:()=>{c.bankedM=0;c.milestones=n-1;c.log.push(`Milestone ${n} declined (point must be spent on receipt).`);persist();}});}));
  const dy=m.querySelector("[data-dying]"); if(dy) dy.addEventListener("change",e=>{const c2=active(); if(c2){c2.dying=Math.max(0,Math.min(5,+e.target.value||0));persist();}});
  const wd=m.querySelector("[data-wounded]"); if(wd) wd.addEventListener("change",e=>{const c2=active(); if(c2){c2.wounded=Math.max(0,+e.target.value||0);persist();}});
  m.querySelectorAll("[data-expose]").forEach(s=>s.addEventListener("click",()=>{
    const c2=active(); if(!c2) return; c2.exposed=c2.exposed||{};
    const z=s.dataset.expose; if(c2.exposed[z]) delete c2.exposed[z]; else c2.exposed[z]=true; persist();}));
  const hp=m.querySelector("[data-hp]"); if(hp) hp.addEventListener("change",e=>{active().hpCur=+e.target.value||0;persist();});
  const tp=m.querySelector("[data-tmp]"); if(tp) tp.addEventListener("change",e=>{active().hpTmp=+e.target.value||0;persist();});
  const gr=m.querySelector("[data-gear]"); if(gr) gr.addEventListener("change",e=>{active().gear=e.target.value;saveAll(chars);});
  const nt=m.querySelector("[data-notes]"); if(nt) nt.addEventListener("change",e=>{active().notesTxt=e.target.value;saveAll(chars);});
  m.querySelectorAll("[data-zone]").forEach(s=>s.addEventListener("change",e=>{
    const c2=active(); if(!c2) return; c2.armor=Object.assign(NOARMOR(),c2.armor||{});
    c2.armor[s.dataset.zone]=e.target.value||null; persist();}));
  const shs=m.querySelector("[data-shield]"); if(shs) shs.addEventListener("change",e=>{const c2=active(); if(c2){c2.shield=e.target.value||null;persist();}});
  const im=m.querySelector("#impfile"); if(im) im.addEventListener("change",e=>{
    const f=e.target.files[0]; if(!f)return; const rd=new FileReader();
    rd.onload=()=>{try{const c=JSON.parse(rd.result); if(!c.talents) throw 0; c.id="c"+Date.now(); chars.push(c); activeId=c.id; persist();}catch(_){alert("Not a STARWROUGHT character JSON.");}};
    rd.readAsText(f);});
}
function togg(list,id,max){ const i=list.indexOf(id); if(i>=0)list.splice(i,1); else if(list.length<max)list.push(id); }
function act(a){
  const c=active();
  if(a==="new"){ tab="wizard"; wiz=null; render(); }
  if(a==="torva"){ if(!chars.find(x=>x.id==="sample-mira")) chars.push(JSON.parse(JSON.stringify(TORVA))); activeId="sample-mira"; localStorage.setItem("sparks-active",activeId); persist(); }
  if(a==="import"){ document.getElementById("impfile").click(); }
  if(a==="export"&&c){ const bl=new Blob([JSON.stringify(c,null,2)],{type:"application/json"});
    const u=URL.createObjectURL(bl), el=document.createElement("a"); el.href=u; el.download=(c.name||"character").replace(/\s+/g,"_")+".sparks.json"; el.click(); URL.revokeObjectURL(u); }
  if(a==="del"&&c&&confirm(`Delete ${c.name||"this character"}?`)){ chars=chars.filter(x=>x.id!==c.id); activeId=null; persist(); }
  if(a==="explore"&&c){ const t=Object.keys(c.talents)[0]; if(t){etree=t;} eview={mode:2,cat:treeOf(etree).category}; esel=null; ezoom="in"; tab="explorer"; render(); }
  if(a==="levelup"&&c&&c.milestones>=3){ c.level++; c.milestones=0; c.bankedF=1; c.hpCur=null; c.log.push(`LEVEL UP → ${c.level}. Comet received. Recompute HP.`); persist();
    spendModal(c,{src:"F",note:"Level-up Comet: spend it now, anywhere (points are never banked).",onCancel:()=>{c.bankedF=0;c.log.push("Comet forfeited (points are never banked).");persist();}}); }
  if(a==="spend"&&c){ spendModal(c); }
  if(a==="wback"){ wiz.step--; wiz.err=""; keepY=0; render(); }
  if(a==="wnext"){
    if(!stepComplete(wiz.step)){ const g=stepGate(wiz.step);
      const pl=pools().find(x=>x.step===wiz.step&&x.ready&&x.spent<x.need);
      wiz.err=g||(pl?`spend before moving on: ${pl.label} (${pl.spent}/${pl.need}, ${pl.where})`:"finish this step first");
    } else {wiz.step++; wiz.err=""; keepY=0;} render(); }
  if(a==="wreset"){ wiz=null; keepY=0; render(); }
  if(a==="wsave"){ const bl=saveBlockers();
    if(bl.length){wiz.err="unfinished business: "+bl.map(b=>b.msg).join("; ")+". The tracker above jumps to each.";render();return;}
    const fc=buildFinal();
    if(!fc){wiz.err="complete every step first";render();return;}
    if(!fc.name){wiz.err="give them a name";render();return;}
    fc.hpCur=derive(fc).hpMax; chars.push(fc); activeId=fc.id; localStorage.setItem("sparks-active",activeId); wiz=null; tab="chars"; persist(); }
}
function spendModal(c,forced){
  const useM=forced?forced.src==="M":(c.bankedM||0)>0, useF=forced?forced.src==="F":(c.bankedF||0)>0;
  const sparked=Object.keys(c.sparks).filter(t=>c.sparks[t]);
  const bg=document.createElement("div"); bg.className="modal-bg";
  const treeOpts=(names)=>names.map(t=>`<option>${t}</option>`).join("");
  bg.innerHTML=`<div class="modal"><h2>Spend a talent point</h2>
    <p class="muted">${(forced&&forced.note)?forced.note+" ":""}Milestone points need a Flared constellation (consumes the Flare). Comets go anywhere, opened or not.</p>
    <p style="margin:8px 0">Source:
      <label><input type="radio" name="src" value="M" ${useM?"":"disabled"} ${useM?"checked":""}> Milestone (${c.bankedM||0})</label>
      <label style="margin-left:12px"><input type="radio" name="src" value="F" ${useF?"":"disabled"} ${!useM&&useF?"checked":""}> Comet (${c.bankedF||0})</label></p>
    <p>Tree: <select id="sptree"></select></p>
    <div id="spnodes" style="max-height:44vh;overflow-y:auto"></div>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="b" id="spok" disabled>Buy</button><button class="b ghost" id="spx">Cancel</button></div></div>`;
  document.body.appendChild(bg);
  const sel=bg.querySelector("#sptree"), nodesDiv=bg.querySelector("#spnodes"), ok=bg.querySelector("#spok");
  let chosen=null;
  function refreshTrees(){
    const src=bg.querySelector("input[name=src]:checked")?.value||"F";
    const names=src==="M"?sparked:allTreeNames();
    sel.innerHTML=treeOpts(names.length?names:["(no Flared constellations)"]);
    refreshNodes();
  }
  function refreshNodes(){
    const t=sel.value; chosen=null; ok.disabled=true;
    if(!t||t.startsWith("(")){nodesDiv.innerHTML="<p class='muted'>Flare a constellation first (a related crit, a GM award, or training).</p>";return;}
    const tr=treeOf(t);
    nodesDiv.innerHTML=tr.nodes.map(n=>{
      const cb=canBuy(c,t,n,false);
      return `<div class="talent-pick ${cb.ok?"":"dis"}" data-n="${n.name.replace(/"/g,"&quot;")}">
        <span class="tdot" style="background:${TIERC[n.tier]}"></span><b>${n.name}</b>
        <span style="color:#4a5c66">${stripT(n.effect).length>100?stripT(n.effect).slice(0,98)+"…":n.effect}</span>
        ${cb.ok?"":`<span class="muted">(${cb.why})</span>`}</div>`;}).join("");
    nodesDiv.querySelectorAll(".talent-pick").forEach(el=>el.addEventListener("click",()=>{
      if(el.classList.contains("dis"))return;
      nodesDiv.querySelectorAll(".talent-pick").forEach(x=>x.classList.remove("sel"));
      el.classList.add("sel"); chosen=el.dataset.n; ok.disabled=false;
    }));
  }
  bg.querySelectorAll("input[name=src]").forEach(r=>r.addEventListener("change",refreshTrees));
  sel.addEventListener("change",refreshNodes);
  refreshTrees();
  bg.querySelector("#spx").addEventListener("click",()=>{bg.remove(); if(forced&&forced.onCancel) forced.onCancel();});
  ok.addEventListener("click",()=>{
    const src=bg.querySelector("input[name=src]:checked").value, t=sel.value;
    buy(c,t,chosen);
    if(src==="M"){ c.bankedM--; c.sparks[t]=false; c.log.push(`Spent milestone point: ${t} → ${chosen} (Flare consumed).`); }
    else { c.bankedF--; c.log.push(`Spent Comet: ${t} → ${chosen}.`); }
    bg.remove(); persist();
  });
}
hotload().then(render);
</script>
</body>
</html>
