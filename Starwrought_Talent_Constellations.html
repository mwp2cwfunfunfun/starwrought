function prereqEdges(pts){
  const E=[];
  for(const p of pts){

          else if(run){ arcs.push(run); run=null; } }
        if(run) arcs.push(run);
        arcs=arcs.filter(r2=>r2.len>=8).map(r2=>({s:r2.st/SL*TAU, e:(r2.st+r2.len)/SL*TAU})); } }
    const buckets=arcs.map(()=>[]);
    for(const o of init){ let bi=-1;
      arcs.forEach((x,i)=>{ const a2=o.a>=x.s?o.a:o.a+TAU; if(bi<0&&a2>=x.s&&a2<=x.e) bi=i; });
      if(bi<0){ let bd=1e9; arcs.forEach((x,i)=>{ const mid=(x.s+x.e)/2;
        const d=Math.abs(normA(o.a-mid+Math.PI)-Math.PI); if(d<bd){bd=d;bi=i;} }); }
      buckets[bi].push(o); }
    arcs.forEach((x,i)=>{ if(!buckets[i].length) return;
      const span=x.e-x.s, ry=G.ry(tier);
      const bs=buckets[i].map(o=>({o, v:(o.a<x.s?o.a+TAU:o.a)}))
        .sort((p2,q2)=>p2.v-q2.v || (p2.o.n.name<q2.o.n.name?-1:1));
      const m=bs.length;
      const D=Math.min(2*Math.asin(Math.min(.9, 39/Math.max(44,ry))), span/m);
      const a=bs.map(e=>Math.min(x.e, Math.max(x.s, e.v)));
      for(let k=1;k<m;k++) a[k]=Math.max(a[k], a[k-1]+D);
      a[m-1]=Math.min(a[m-1], x.e-D*0.4);
      for(let k=m-2;k>=0;k--) a[k]=Math.min(a[k], a[k+1]-D);
      for(let k=0;k<m;k++) a[k]=Math.max(x.s+D*0.4, a[k]);
      bs.forEach((e,j)=>{ const rr=mulberry32(djb2(tname+"|jit|"+e.o.n.name));
        angOf[nrmG(e.o.n.name)]=normA(a[j]+(rr()-.5)*Math.min(.05, D*.25)); }); });
    for(const n of strayN){ const d=sameTierDepth(n);
      put(n, tier, angOf[nrmG(n.name)], d>0?subMul(tier,angOf[nrmG(n.name)],d):1); }
  }
  if(rn) pts.push({...rn, x:G.cx, y:G.cy, _geo:G});
  // edges are TRUE requirements only. root->deeper "requires" lines stay undrawn:
  // root-first is the law even unwritten, so a star with no line in needs only the root.
  const E=[]; const of=t2=>pts.filter(p=>p.tier===t2&&!p.root).sort((a,b)=>a.x-b.x);
  const root=pts.find(p=>p.root);
  const hard=prereqEdges(pts); hard.forEach(([a,b])=>{ if(a.root&&b.tier!=="T"&&!b.hroot) return; E.push([a,b,"req"]); });
  const hasReq=new Set(hard.map(([a,b])=>b.name));
  if(root) for(const p of of("T")) if(!hasReq.has(p.name)) E.push([root,p,"req"]);
  const ms=of("M");
  if(ms.length) for(const p of pts){ if(!p.root&&p.name.includes("★")) ms.forEach(q=>E.push([q,p,"cap"])); }
  radialClear(pts,E);
  return {pts,edges:E,root,G};
}
function ringsSVG(cat, lvl, hue, myPts, G, withLabels=true){
  const g=gatesFor(cat);
  const rows=[["T","TRAINED",1],["E","EXPERT",4],["M","MASTER",9],["L","LEGENDARY",16]];
  const F=[RINGF.T,RINGF.E,RINGF.M,RINGF.L];
  const ell=(f)=>{ const rx=G.Rm*G.XR*f, ry=G.Rm*f;
    return `M${(G.cx-rx).toFixed(1)},${G.cy.toFixed(1)} a${rx.toFixed(1)},${ry.toFixed(1)} 0 1,0 ${(2*rx).toFixed(1)},0 a${rx.toFixed(1)},${ry.toFixed(1)} 0 1,0 ${(-2*rx).toFixed(1)},0`; };
  let s="";
  rows.forEach(([tier,name,need],i)=>{
    const gate=tier==="T"?1:g[tier], lvlOK=lvl>=gate, ptsOK=myPts==null?true:myPts>=need, open=lvlOK&&ptsOK;
    const lo=i===0?F[0]*0.42:(F[i-1]+F[i])/2, hi=i===3?F[3]*1.09:(F[i]+F[i+1])/2;
    if(!open) s+=`<path d="${ell(hi)} ${ell(lo)}" fill="#000814" opacity=".30" fill-rule="evenodd"/>`;
    s+=`<ellipse cx="${G.cx}" cy="${G.cy}" rx="${G.rx(tier).toFixed(1)}" ry="${G.ry(tier).toFixed(1)}" fill="none" stroke="${open?mixW(hue,.22):"#31424E"}" stroke-width="1" stroke-dasharray="3 8" opacity=".85"/>`;
    if(withLabels){ const lx=G.cx+(G.rx(tier)+12)*Math.cos(RLANG), ly2=G.cy+(G.ry(tier)+12)*Math.sin(RLANG);
      s+=`<text class="tierlab" x="${lx.toFixed(1)}" y="${ly2.toFixed(1)}" text-anchor="end" style="fill:${open?"#A6BDCB":"#46606E"}">${name} · ${need} pt${need>1?"s":""} · L${gate}+${open?"":"  🔒"}</text>`; }
  });
  return s;
}
function gateChipsSVG(cat, lvl, W, myPts){ // the two-gate verdicts, pinned top-right off the sky
  if(myPts==null) return "";
  const g=gatesFor(cat), OK="#7FD8C8", NO="#C97A6A";
  const rows=[["LEGENDARY",16,g.L],["MASTER",9,g.M],["EXPERT",4,g.E]];
  let s="", y=22;
  for(const [name,need,gate] of rows){ const ptsOK=myPts>=need, lvlOK=lvl>=gate;
    s+=`<text class="tierlab" x="${W-14}" y="${y}" text-anchor="end"><tspan style="fill:#5E7686">${name}</tspan><tspan dx="10" style="fill:${ptsOK?OK:NO}">${ptsOK?"✓":"✗"} ${need} pts (you: ${myPts})</tspan><tspan dx="10" style="fill:${lvlOK?OK:NO}">${lvlOK?"✓":"✗"} L${gate}+ (you: L${lvl})</tspan></text>`; y+=18; }
  return s;
}
const CATLABEL2={Save:"Defense",Heritage:"Bloodline"}; // retired spellings, current word on screen
const catHue=c=>({Skill:"#8FB4E8",Defense:"#7FD8C8",Save:"#7FD8C8",Weapon:"#C98F78","Combat Style":"#E87A62",Armor:"#8FB0DC",Calling:"#F0685A",Ancestry:"#DCCB9E",Culture:"#B49AE8",Bloodline:"#DCCB9E",Heritage:"#DCCB9E",Background:"#C9B47A"}[c]||"#8FA8C8");function layout(tname){ // the viewer shows every branch: all heritages count as owned
  const owned=new Set(TREES[tname].nodes.map(n=>nrmG(n.name)));
  return elayout(tname, W, Hh, owned, {});
}
const R={T:6,E:8,M:10,L:13};
let current=localStorage.getItem("sparks-tree")||"Two-Weapon Fighting";
if(!TREES[current]) current=Object.keys(TREES)[0];
let selNode=null;
function starfield(seed){
  const r=mulberry32(seed);let s="";
  for(let i=0;i<150;i++){const x=r()*W,y=r()*Hh,rad=r()*1.1+.2,o=(r()*.5+.12).toFixed(2);
    s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rad.toFixed(2)}" fill="#AFC4CF" opacity="${o}"/>`;}
  return s;
}
function render(){
  const t=TREES[current], hue=HUES[current]||"#8FA8C8", L=layout(current);
  const {pts,edges}=L;
  const skill=!(t.category==="Combat Style"||t.category==="Armor"||t.category==="Calling");
  const gates={E:5,M:13,L:19};
  document.getElementById("gates").textContent=`${CATLABEL2[t.category]||t.category} constellation gates: Expert L${gates.E} • Master L${gates.M} • Legendary L${gates.L}`;
  let s=starfield(djb2(current));
  s+=`<g fill="${hue}" stroke="${hue}" opacity="0.09" transform="translate(500,300) scale(4.4) translate(-50,-50)">${SIL[current]||""}</g>`;
  s+=ringsSVG(t.category, 20, hue, null, L.G, true); // orbits: Trained at the heart, Legendary at the rim
  s+=`<defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="${mixW(hue,.45)}"/></marker></defs>`;
  for(const [e1,e2,kind] of edges){
    if(kind==="cap") s+=`<line x1="${e1.x}" y1="${e1.y}" x2="${e2.x}" y2="${e2.y}" stroke="#E8C25A" stroke-width="1.2" opacity=".45" stroke-dasharray="1 5"/>`;
    else s+=`<line x1="${e1.x}" y1="${e1.y}" x2="${e2.x}" y2="${e2.y}" stroke="${mixW(hue,.42)}" stroke-width="1.6" opacity=".8" stroke-dasharray="4 6" marker-end="url(#arr)"/>`;
  }
  const LBL=placeLabels(pts,W,R);
  for(const p of pts){
    const r=p.root?12:R[p.tier], sel=selNode===p.name;
    const LB=LBL.get(p), la=LB.la, ly=LB.ly, lxx=la==="middle"?Math.max(64,Math.min(W-64,LB.lx)):LB.lx;
    s+=`<g class="nodeg" data-n="${encodeURIComponent(p.name)}">`;
    if(p.name.includes("★")&&!p.root){for(let i=0;i<8;i++){const ang=Math.PI/4*i, len=r+11;
      s+=`<line x1="${p.x+Math.cos(ang)*(r+2)}" y1="${p.y+Math.sin(ang)*(r+2)}" x2="${p.x+Math.cos(ang)*len}" y2="${p.y+Math.sin(ang)*len}" stroke="${mixW(hue,.5)}" stroke-width="1.8" opacity="1"/>`;}}
    s+=`<circle cx="${p.x}" cy="${p.y}" r="${r*2.6}" fill="${hue}" opacity=".18"/>`
      +`<circle cx="${p.x}" cy="${p.y}" r="${r*1.55}" fill="${hue}" opacity=".38"/>`
      +`<circle class="core" cx="${p.x}" cy="${p.y}" r="${r}" fill="${mixW(hue,.45)}" stroke="#FFFFFF" stroke-width="${sel?2.6:1.2}"/>`
      +`<circle cx="${p.x}" cy="${p.y}" r="${r*.36}" fill="#FFFFFF" opacity="1"/>`
      +(p.root?`<rect x="${p.x-r-6}" y="${p.y-r-6}" width="${2*(r+6)}" height="${2*(r+6)}" fill="none" stroke="#F0C24E" stroke-width="2" transform="rotate(45 ${p.x} ${p.y})"/>`:"")
      +(sel?`<circle cx="${p.x}" cy="${p.y}" r="${r+6.5}" fill="none" stroke="#F6EFE2" stroke-width="1" stroke-dasharray="2 3"/>`:"")+(p.feeds&&p.feeds!==t.feeds?`<circle cx="${p.x}" cy="${p.y}" r="${r*1.9}" fill="none" stroke="${ATTRC[p.feeds]}" stroke-width="1.2" stroke-dasharray="3 4" opacity=".85"/>`:"")
      +`<text class="nlabel" x="${lxx}" y="${ly}" text-anchor="${la}" ${p.root?'style="fill:#F2D9A0;font-weight:700;letter-spacing:1px"':""}>${p.root?"◈ "+p.name.replace(" ★",""):p.name.replace(" ★","")}</text></g>`;
  }
  s+=`<g font-size="10.5" fill="#A8BAC4" font-family="Segoe UI,sans-serif">
    <line x1="20" y1="${Hh-12}" x2="52" y2="${Hh-12}" stroke="${mixW(hue,.42)}" stroke-width="1.6" stroke-dasharray="4 6" marker-end="url(#arr)"/><text x="58" y="${Hh-8}">requires · wheel zooms, drag pans, double-click resets</text>
    <line x1="150" y1="${Hh-12}" x2="182" y2="${Hh-12}" stroke="${hue}" stroke-width="1.1" opacity=".5" stroke-dasharray="2 6"/><text x="188" y="${Hh-8}">⇢ requires (in the app the line fills solid once you own both)</text>
    <text x="330" y="${Hh-8}" fill="#F2D9A0">◈ root: every constellation starts here · no line in = needs only the root</text>
    <text x="520" y="${Hh-8}" fill="#D9A441">☀ rays = capstone (needs any Master talent here)</text></g>`;
  document.getElementById("svg").innerHTML=s;
  skyNav(document.getElementById("svg"), "v|"+current);
  document.querySelectorAll(".nodeg").forEach(g=>g.addEventListener("click",()=>{selNode=decodeURIComponent(g.dataset.n);render();}));
  renderPanel(t,hue,gates); renderSide();
}
function renderPanel(t,hue,gates){
  const P=document.getElementById("panel");
  const node=t.nodes.find(n=>n.name===selNode);
  let h=`<h2>${current}</h2><div class="meta">${t.meta}</div>`;
  if(node){
    h+=`<span class="chip" style="background:${TIERC[node.tier]}">${TIERN[node.tier].toUpperCase()}</span>`
      +(node.name.includes("★")?`<span class="chip" style="background:#B8860B">CAPSTONE</span>`:"")
      +`<div class="sect">${node.name}</div>${node.desc?`<div class="muted" style="font-style:italic;font-size:11px;margin-top:8px">${node.desc}</div>`:""}<div id="ndesc">${node.effect}</div>${node.prereqs?`<div class="hint">Prerequisites: ${node.prereqs}</div>`:""}${node.requires?`<div class="hint">Requires: ${node.requires.join(" or ")}</div>`:""}${node.feeds?`<div class="hint">Feeds <b style="color:${ATTRC[node.feeds]}">${node.feeds}</b>${t.feeds&&t.feeds!==node.feeds?` (constellation default: ${t.feeds})`:""}</div>`:""}`
      +(node.name.includes("★")?`<div class="hint">Capstones require at least one Master talent from this constellation.</div>`:"");
  } else {
    h+=`<div class="sect">Constellation</div><div class="talentlist">`
      +t.nodes.map(n=>`<div data-n="${encodeURIComponent(n.name)}"><span class="tdot" style="background:${TIERC[n.tier]}"></span>${n.name}</div>`).join("")
      +`</div>`;
  }
  h+=`<div class="sect">&#9889; Flares</div><div class="sparks" style="font-style:normal">${UNIFLARE}</div>${t.sparks?`<div class="sparks" style="margin-top:3px">Examples: ${t.sparks}</div>`:""}`
    +`<div class="hint">Rank by points here: 1 Trained &bull; 4 Expert (L${gates.E}) &bull; 9 Master (L${gates.M}) &bull; 16 Legendary (L${gates.L}).<br>Click a star for its talent; click the sky to clear.</div>`;
  P.innerHTML=h;
  P.querySelectorAll(".talentlist div").forEach(d=>d.addEventListener("click",()=>{selNode=decodeURIComponent(d.dataset.n);render();}));
}
function renderSide(){
  // Retired spellings fold into the current word, so a stale trees.json still groups correctly.
  const CATLABEL={Save:"Defense",Heritage:"Bloodline"};
  const cats={};
  for(const [n,t] of Object.entries(TREES)){ const c=CATLABEL[t.category]||t.category;
    (cats[c]=cats[c]||[]).push(n); }
  // Preferred order first, then ANY category the data has that this list forgot. A whitelist alone
  // silently hid the Defenses and Weapons for two releases; leftovers now fall through instead.
  const pref=["Ancestry","Culture","Bloodline","Background","Calling",
              "Defense","Weapon","Combat Style","Skill","Armor"];
  const order=[...pref.filter(c=>cats[c]), ...Object.keys(cats).filter(c=>!pref.includes(c)).sort()];
  let h="";
  for(const c of order){ if(!cats[c]) continue;
    h+=`<div class="cat">${c}</div>`;
    for(const n of cats[c]) h+=`<button class="tree-btn ${n===current?"active":""}" style="--hue:${HUES[n]}" data-t="${encodeURIComponent(n)}">${n}</button>`;
  }
  const S=document.getElementById("side"); S.innerHTML=h;
  S.querySelectorAll(".tree-btn").forEach(b=>b.addEventListener("click",()=>{current=decodeURIComponent(b.dataset.t);selNode=null;localStorage.setItem("sparks-tree",current);render();}));
}
document.getElementById("sky").addEventListener("click",e=>{if(e.target.id==="svg"){selNode=null;render();}});
document.addEventListener("keydown",e=>{
  const keys=Object.keys(TREES), i=keys.indexOf(current);
  if(e.key==="ArrowRight"){current=keys[(i+1)%keys.length];selNode=null;localStorage.setItem("sparks-tree",current);render();}
  if(e.key==="ArrowLeft"){current=keys[(i-1+keys.length)%keys.length];selNode=null;localStorage.setItem("sparks-tree",current);render();}
});
hotload().then(render);
