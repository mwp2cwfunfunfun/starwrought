    h+=`<span class="chip" style="background:${TIERC[node.tier]}">${TIERN[node.tier].toUpperCase()}</span>`
      +(node.name.includes("★")?`<span class="chip" style="background:#B8860B">CAPSTONE</span>`:"")
      +`<div class="sect">${node.name}</div>${node.desc?`<div class="muted" style="font-style:italic;font-size:11px;margin-top:8px">${node.desc}</div>`:""}<div id="ndesc">${node.effect}</div>${node.prereqs?`<div class="hint">Prerequisites: ${node.prereqs}</div>`:""}${node.requires?`<div class="hint">Requires: ${node.requires.join(" or ")}</div>`:""}${node.feeds?`<div class="hint">Feeds <b style="color:${ATTRC[node.feeds]}">${node.feeds}</b>${t.feeds&&t.feeds!==node.feeds?` (constellation default: ${t.feeds})`:""}</div>`:""}`
      +(node.name.includes("★")?`<div class="hint">Capstones require at least one Master talent from this constellation.</div>`:"");
  } else {
    h+=`<div class="sect">Constellation</div><div class="talentlist">`
      +t.nodes.map(n=>`<div data-n="${encodeURIComponent(n.name)}"><span class="tdot" style="background:${TIERC[n.tier]}"></span>${n.name}</div>`).join("")
      +`</div>`;
  }
  h+=`<div class="sect">&#9889; Flares</div><div class="sparks" style="font-style:normal">${UNIFLARE}</div>${t.sparks?`<div class="sparks" style="margin-top:3px">Examples: ${t.sparks}</div>`:""}`
    +`<div class="hint">Rank by points here: 1 Trained &bull; 4 Expert (L${gates.E}) &bull; 9 Master (L${gates.M}) &bull; 16 Legendary (L${gates.L}).<br>Click a star for its talent; click the sky to clear.</div>`;
  P.innerHTML=h;
  P.querySelectorAll(".talentlist div").forEach(d=>d.addEventListener("click",()=>{selNode=decodeURIComponent(d.dataset.n);render();}));
}
function renderSide(){
  // Retired spellings fold into the current word, so a stale trees.json still groups correctly.
  const CATLABEL={Save:"Defense",Heritage:"Bloodline"};
  const cats={};
  for(const [n,t] of Object.entries(TREES)){ const c=CATLABEL[t.category]||t.category;
    (cats[c]=cats[c]||[]).push(n); }
  // Preferred order first, then ANY category the data has that this list forgot. A whitelist alone
  // silently hid the Defenses and Weapons for two releases; leftovers now fall through instead.
  const pref=["Ancestry","Culture","Bloodline","Background","Calling",
              "Defense","Weapon","Combat Style","Skill","Armor"];
  const order=[...pref.filter(c=>cats[c]), ...Object.keys(cats).filter(c=>!pref.includes(c)).sort()];
  let h="";
  for(const c of order){ if(!cats[c]) continue;
    h+=`<div class="cat">${c}</div>`;
    for(const n of cats[c]) h+=`<button class="tree-btn ${n===current?"active":""}" style="--hue:${HUES[n]}" data-t="${encodeURIComponent(n)}">${n}</button>`;
  }
  const S=document.getElementById("side"); S.innerHTML=h;
  S.querySelectorAll(".tree-btn").forEach(b=>b.addEventListener("click",()=>{current=decodeURIComponent(b.dataset.t);selNode=null;localStorage.setItem("sparks-tree",current);render();}));
}
document.getElementById("sky").addEventListener("click",e=>{if(e.target.id==="svg"){selNode=null;render();}});
document.addEventListener("keydown",e=>{
  const keys=Object.keys(TREES), i=keys.indexOf(current);
  if(e.key==="ArrowRight"){current=keys[(i+1)%keys.length];selNode=null;localStorage.setItem("sparks-tree",current);render();}
  if(e.key==="ArrowLeft"){current=keys[(i-1+keys.length)%keys.length];selNode=null;localStorage.setItem("sparks-tree",current);render();}
});
hotload().then(render);
</script>
</body>
