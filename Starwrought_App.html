  if(wikiSec==="Progression") h+=`
    <div class="callout"><b>The Flare loop:</b> ${UNIFLARE}</div>
    <h3>Milestones & levels</h3>
    ${P("Every level is four Milestones. Milestones 1–3 grant 1 Milestone Talent Point apiece, spent <b>immediately</b> in a Flared Constellation. The 4th is the level-up: Vigor rises, new Proficiency Ranks may unlock, and you gain a <b>Comet</b>, a Talent Point that answers to no Constellation. Spend it immediately, anywhere, Flared or not, opened or not. <b>No Talent Point may ever be voluntarily banked.</b> If a Milestone point arrives with nothing Flared, it becomes a <b>Deferred Talent Point</b>, spent the instant something Flares. Level never touches the die: no roll or Threshold ticks up because you levelled, only because a rank did.")}
    <h3>Level-up checklist</h3>
    ${P("+Vigor equal to Ancestry Vigor + Calling Vigor. Check the rank gates (Expert at level 5, Master at 10, Legendary at 15) and spend your Comet. Recompute Attributes if points moved; new weapon dice at 4th, 8th, 12th, and 16th (2 / 3 / 4 / 5 dice).")}
    <h3>Also Flares</h3>
    ${P("<b>GM awards</b> for feats no die roll captured: carrying the survivor out of the fire Flares Athletics, no check required. <b>Downtime training</b>: a week with a teacher, rival, or manual Flares that constellation. This is the deliberate path to growth you haven't stumbled into at the table.")}
    <h3>Retraining</h3>
    ${P("A <b>month</b> of Downtime moves 1 already spent Talent Point anywhere legal. You cannot retrain away from a Talent in your Origin Constellation, a Root Talent, a Talent that another Talent you own requires, or one that would drop your Proficiency Rank. Characters are maps of what you've done, but maps get redrawn.")}`;

  if(wikiSec==="Thresholds") h+=`<div class="callout">A <b>Threshold</b> is the number a check is measured against: ten plus the modifier of the roll it stands in for, so <b>10 + attribute + proficiency</b>, with the same bonuses and penalties. Other games use Armor Class or Difficulty Class in a similar manner. A Guard of +7 is a Guard Threshold of 17. The GM sets them; you roll against them.</div>`
    +P("<b>Creatures carry Thresholds instead of rolling</b>: an Initiative Threshold, an Attack Threshold for each attack (the check it would have rolled, with a 10 in place of the die), and a Threshold for each Defense. When a creature attacks, the player rolls the Defense against its Attack Threshold; when the player attacks, they roll against the creature's Defense Threshold. The same margin is read from whichever side the player is on.")
    +P("<b>Tasks with no creature behind them</b> (a lock, a cliff, a lie to a guard) take a Threshold the GM sets for the difficulty of the thing itself. Some are printed with their rules: Aid and Grab an Edge roll against 15; Rally and Command the Field against 14; Wind against 10 + Load Strain; Persistent Damage against 10 + the amount just taken; a Recovery check against 10 + Dying + Wounds carried; treating a Wound against 10 + Wounds carried. Level never enters a Threshold, so a task does not get harder because you got better; the things you have done get easier.")
    +((R.thresholdTable||[]).length?tbl(["Task level","Threshold"],R.thresholdTable):"");
  return h;
}

// ---------- events ----------
function bind(m){
  m.querySelectorAll(".wizsky svg[data-skykey]").forEach(sv=>skyNav(sv, sv.dataset.skykey));
  m.querySelectorAll("[data-a]").forEach(b=>b.addEventListener("click",()=>act(b.dataset.a)));
  m.querySelectorAll("[data-open]").forEach(c=>c.addEventListener("click",()=>{activeId=c.dataset.open;localStorage.setItem("sparks-active",activeId);render();}));
  m.querySelectorAll("[data-weapon]").forEach(c=>c.addEventListener("click",()=>{wiz.picks.weapon=c.dataset.weapon;wiz.err="";render();}));
  m.querySelectorAll("[data-anc]").forEach(c=>c.addEventListener("click",()=>{wiz.ch.ancestry=c.dataset.anc;wiz.picks.her=null;wiz.picks.tg={};wiz.err="";render();}));
  m.querySelectorAll("[data-her]").forEach(c=>c.addEventListener("click",()=>{wiz.picks.her=c.dataset.her;wiz.picks.tg={};wiz.err="";render();}));
  m.querySelectorAll("[data-cul]").forEach(c=>c.addEventListener("click",()=>{wiz.picks.culName=c.dataset.cul;wiz.err="";render();}));
  m.querySelectorAll("[data-bg]").forEach(c=>c.addEventListener("click",()=>{wiz.picks.bg=c.dataset.bg;wiz.picks.bgA=[];wiz.picks.bgB=[];wiz.picks.bgLore=[];wiz.err="";render();}));
  m.querySelectorAll("[data-cal]").forEach(c=>c.addEventListener("click",()=>{wiz.picks.calName=c.dataset.cal;wiz.picks.calling=[];wiz.picks.calSkill=[];wiz.err="";render();}));
  bindTips(m);
  m.querySelectorAll("[data-skyf]").forEach(b=>b.addEventListener("click",()=>{wiz.skyFocus=wiz.skyFocus||{};wiz.skyFocus[b.dataset.skyf]=b.dataset.skyt;render();}));
  m.querySelectorAll("[data-skytog]").forEach(b=>b.addEventListener("click",()=>{wiz.skyOpen=wiz.skyOpen||{};const k=b.dataset.skytog;wiz.skyOpen[k]=!(wiz.skyOpen[k]!==false);render();}));
  m.querySelectorAll("[data-pick]").forEach(el=>el.addEventListener("click",()=>{
    if(el.classList.contains("dis"))return;
    const key=el.dataset.pick; let id=el.dataset.id;
    if(id.startsWith("Lore||")){ const ty=prompt("What kind of Lore? (e.g., Circus, Warfare, Trade Roads)");
      if(!ty||!ty.trim()) return; id="Lore ("+ty.trim()+")||"+id.split("||")[1]; }
    if(key==="free") togg(wiz.picks.free,id,3);
    if(key==="def") togg(wiz.picks.def=wiz.picks.def||[],id,2);
    if(key==="calling") togg(wiz.picks.calling=wiz.picks.calling||[],id,1);
    if(key==="calSkill") togg(wiz.picks.calSkill=wiz.picks.calSkill||[],id,1);
    if(key==="bgA") togg(wiz.picks.bgA=wiz.picks.bgA||[],id,1);
    if(key==="bgB") togg(wiz.picks.bgB=wiz.picks.bgB||[],id,1);
    if(key==="bgLore") togg(wiz.picks.bgLore=wiz.picks.bgLore||[],id,1);
    if(key.startsWith("tg:")){ const nm2=key.slice(3); wiz.picks.tg=wiz.picks.tg||{}; wiz.picks.tg[nm2]=wiz.picks.tg[nm2]||[];
      const nd=allTreeNames().flatMap(t2=>treeOf(t2).nodes).find(x=>x.name===nm2);
      togg(wiz.picks.tg[nm2],id,(nd&&nd.grant&&nd.grant.n)||1); }
    wiz.err=""; render();
  }));
  const wn=m.querySelector("[data-wname]"); if(wn) wn.addEventListener("input",e=>wiz.ch.name=e.target.value);
  m.querySelectorAll("[data-wzone]").forEach(s=>s.addEventListener("change",e=>{
    wiz.ch.armor=Object.assign(NOARMOR(),wiz.ch.armor||{}); wiz.ch.armor[s.dataset.wzone]=e.target.value||null; render();}));
  const wsh=m.querySelector("[data-wshield]"); if(wsh) wsh.addEventListener("change",e=>{wiz.ch.shield=e.target.value||null;render();});
  m.querySelectorAll("[data-jumpc]").forEach(a2=>a2.addEventListener("click",()=>{(wiz.culShown=wiz.culShown||[]).includes(a2.dataset.jumpc)||wiz.culShown.push(a2.dataset.jumpc);render();}));
  m.querySelectorAll("[data-jump]").forEach(a2=>a2.addEventListener("click",()=>{(wiz.freeShown=wiz.freeShown||[]).includes(a2.dataset.jump)||wiz.freeShown.push(a2.dataset.jump);render();}));
  m.querySelectorAll("[data-tree]").forEach(a2=>a2.addEventListener("click",()=>{etree=a2.dataset.tree;localStorage.setItem("sparks-etree",etree);tab="explorer";eview={mode:2,cat:treeOf(etree).category};esel=null;ezoom="in";render();}));
  m.querySelectorAll("[data-et]").forEach(b=>b.addEventListener("click",()=>{etree=b.dataset.et;localStorage.setItem("sparks-etree",etree);eview={mode:2,cat:treeOf(etree).category};esel=null;ezoom="in";render();}));
  m.querySelectorAll("[data-ev]").forEach(b=>b.addEventListener("click",()=>{const mo=+b.dataset.ev; if(mo===eview.mode&&b.classList.contains("here"))return;
    ezoom="out"; eview = mo===0?{mode:0,cat:null}:{mode:1,cat:eview.cat||treeOf(etree).category}; esel=null; render();}));
  m.querySelectorAll("[data-wstep]").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.wstep; if(canJump(i)){wiz.step=i;wiz.err="";keepY=0;render();}}));
  m.querySelectorAll("[data-skyjump]").forEach(b=>b.addEventListener("click",()=>{ if(!wiz) return; wiz.skyFocus=wiz.skyFocus||{}; wiz.skyFocus.free=b.dataset.skyjump; if(canJump(7)) wiz.step=7; wiz.err=""; render(); }));
  m.querySelectorAll("[data-w]").forEach(b=>b.addEventListener("click",()=>{wikiSec=b.dataset.w;localStorage.setItem("sparks-wiki",wikiSec);render();}));
  m.querySelectorAll("[data-spark]").forEach(s=>s.addEventListener("click",()=>{const c=active();c.sparks[s.dataset.spark]=!c.sparks[s.dataset.spark];persist();}));
  m.querySelectorAll("[data-ms]").forEach(s=>s.addEventListener("click",()=>{const c=active(),n=+s.dataset.ms;
    if(n===4){ if(c.milestones>=3) act("levelup"); return; }
    if(c.milestones>=n){ c.milestones=n-1; persist(); return; }
    const flared=Object.keys(c.sparks).filter(t2=>c.sparks[t2]);
    if(!flared.length){ alert("No constellation is Flared. Flare one first (a consequential crit, a GM award, or a week's training); milestone points are spent the moment you receive them."); return; }
    c.milestones=n; c.bankedM=1; persist();
    spendModal(c,{src:"M",note:"Milestone point: spend it now (points are never banked).",onCancel:()=>{c.bankedM=0;c.milestones=n-1;c.log.push(`Milestone ${n} declined (point must be spent on receipt).`);persist();}});}));
  const dy=m.querySelector("[data-dying]"); if(dy) dy.addEventListener("change",e=>{const c2=active(); if(c2){c2.dying=Math.max(0,Math.min(5,+e.target.value||0));persist();}});
  // Wounds by Zone: clicking box k marks k Wounds, or clears back to k−1 if k is already marked
  m.querySelectorAll("[data-wound]").forEach(s=>s.addEventListener("click",()=>{
    const c2=active(); if(!c2) return; c2.wounds=Object.assign({Head:0,Torso:0,Arms:0,Legs:0},c2.wounds||{});
    const z=s.dataset.wound, k=+s.dataset.wn, cur=+c2.wounds[z]||0;
    c2.wounds[z]=cur>=k?k-1:k; persist();}));
  m.querySelectorAll("[data-expose]").forEach(s=>s.addEventListener("click",()=>{
    const c2=active(); if(!c2) return; c2.exposed=c2.exposed||{};
    const z=s.dataset.expose; if(c2.exposed[z]) delete c2.exposed[z]; else c2.exposed[z]=true; persist();}));
  const vg=m.querySelector("[data-vigor]"); if(vg) vg.addEventListener("change",e=>{active().vigorCur=Math.max(0,+e.target.value||0);persist();}); // Vigor never goes below 0: at 0 you are Spent
  const tp=m.querySelector("[data-vtmp]"); if(tp) tp.addEventListener("change",e=>{active().vigorTmp=Math.max(0,+e.target.value||0);persist();});
  const gr=m.querySelector("[data-gear]"); if(gr) gr.addEventListener("change",e=>{active().gear=e.target.value;saveAll(chars);});
  const nt=m.querySelector("[data-notes]"); if(nt) nt.addEventListener("change",e=>{active().notesTxt=e.target.value;saveAll(chars);});
  m.querySelectorAll("[data-zone]").forEach(s=>s.addEventListener("change",e=>{
    const c2=active(); if(!c2) return; c2.armor=Object.assign(NOARMOR(),c2.armor||{});
    c2.armor[s.dataset.zone]=e.target.value||null; persist();}));
  const shs=m.querySelector("[data-shield]"); if(shs) shs.addEventListener("change",e=>{const c2=active(); if(c2){c2.shield=e.target.value||null;persist();}});
  const im=m.querySelector("#impfile"); if(im) im.addEventListener("change",e=>{
    const f=e.target.files[0]; if(!f)return; const rd=new FileReader();
    rd.onload=()=>{try{const c=JSON.parse(rd.result); if(!c.talents) throw 0; c.id="c"+Date.now(); chars.push(migrate(c)); activeId=c.id; persist();}catch(_){alert("Not a STARWROUGHT character JSON.");}}; // an exported v3 save arrives with hpCur, Weapons and the numeric Wounded: the migrator, as at boot
    rd.readAsText(f);});
}
function togg(list,id,max){ const i=list.indexOf(id); if(i>=0)list.splice(i,1); else if(list.length<max)list.push(id); }
function act(a){
  const c=active();
  if(a==="new"){ tab="wizard"; wiz=null; render(); }
  if(a==="torva"){ if(!chars.find(x=>x.id==="sample-mira")) chars.push(migrate(JSON.parse(JSON.stringify(TORVA)))); activeId="sample-mira"; localStorage.setItem("sparks-active",activeId); persist(); }
  if(a==="import"){ document.getElementById("impfile").click(); }
  if(a==="export"&&c){ const bl=new Blob([JSON.stringify(c,null,2)],{type:"application/json"});
    const u=URL.createObjectURL(bl), el=document.createElement("a"); el.href=u; el.download=(c.name||"character").replace(/\s+/g,"_")+".sparks.json"; el.click(); URL.revokeObjectURL(u); }
  if(a==="del"&&c&&confirm(`Delete ${c.name||"this character"}?`)){ chars=chars.filter(x=>x.id!==c.id); activeId=null; persist(); }
  if(a==="explore"&&c){ const t=Object.keys(c.talents)[0]; if(t){etree=t;} eview={mode:2,cat:treeOf(etree).category}; esel=null; ezoom="in"; tab="explorer"; render(); }
  if(a==="levelup"&&c&&c.milestones>=3){ c.level++; c.milestones=0; c.bankedF=1; c.vigorCur=null; c.log.push(`LEVEL UP → ${c.level}. Comet received. Vigor rises; check the rank gates (Expert L5, Master L10, Legendary L15) and the weapon dice (L4/8/12/16).`); persist();
    spendModal(c,{src:"F",note:"Level-up Comet: spend it now, anywhere (points are never banked).",onCancel:()=>{c.bankedF=0;c.log.push("Comet forfeited (points are never banked).");persist();}}); }
  if(a==="spend"&&c){ spendModal(c); }
  if(a==="wback"){ wiz.step--; wiz.err=""; keepY=0; render(); }
  if(a==="wnext"){
    if(!stepComplete(wiz.step)){ const g=stepGate(wiz.step);
      const pl=pools().find(x=>x.step===wiz.step&&x.ready&&x.spent<x.need);
      wiz.err=g||(pl?`spend before moving on: ${pl.label} (${pl.spent}/${pl.need}, ${pl.where})`:"finish this step first");
    } else {wiz.step++; wiz.err=""; keepY=0;} render(); }
  if(a==="wreset"){ wiz=null; keepY=0; render(); }
  if(a==="wsave"){ const bl=saveBlockers();
    if(bl.length){wiz.err="unfinished business: "+bl.map(b=>b.msg).join("; ")+". The tracker above jumps to each.";render();return;}
    const fc=buildFinal();
    if(!fc){wiz.err="complete every step first";render();return;}
    if(!fc.name){wiz.err="give them a name";render();return;}
    fc.vigorCur=derive(fc).vigorMax; chars.push(fc); activeId=fc.id; localStorage.setItem("sparks-active",activeId); wiz=null; tab="chars"; persist(); }
}
function spendModal(c,forced){
  const useM=forced?forced.src==="M":(c.bankedM||0)>0, useF=forced?forced.src==="F":(c.bankedF||0)>0;
  const sparked=Object.keys(c.sparks).filter(t=>c.sparks[t]);
  const bg=document.createElement("div"); bg.className="modal-bg";
  const treeOpts=(names)=>names.map(t=>`<option>${t}</option>`).join("");
  bg.innerHTML=`<div class="modal"><h2>Spend a talent point</h2>
    <p class="muted">${(forced&&forced.note)?forced.note+" ":""}Milestone points need a Flared constellation (consumes the Flare). Comets go anywhere, opened or not.</p>
    <p style="margin:8px 0">Source:
      <label><input type="radio" name="src" value="M" ${useM?"":"disabled"} ${useM?"checked":""}> Milestone (${c.bankedM||0})</label>
      <label style="margin-left:12px"><input type="radio" name="src" value="F" ${useF?"":"disabled"} ${!useM&&useF?"checked":""}> Comet (${c.bankedF||0})</label></p>
    <p>Tree: <select id="sptree"></select></p>
    <div id="spnodes" style="max-height:44vh;overflow-y:auto"></div>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="b" id="spok" disabled>Buy</button><button class="b ghost" id="spx">Cancel</button></div></div>`;
  document.body.appendChild(bg);
  const sel=bg.querySelector("#sptree"), nodesDiv=bg.querySelector("#spnodes"), ok=bg.querySelector("#spok");
  let chosen=null;
  function refreshTrees(){
    const src=bg.querySelector("input[name=src]:checked")?.value||"F";
    const names=src==="M"?sparked:allTreeNames();
    sel.innerHTML=treeOpts(names.length?names:["(no Flared constellations)"]);
    refreshNodes();
  }
  function refreshNodes(){
    const t=sel.value; chosen=null; ok.disabled=true;
    if(!t||t.startsWith("(")){nodesDiv.innerHTML="<p class='muted'>Flare a constellation first (a related crit, a GM award, or training).</p>";return;}
    const tr=treeOf(t);
    nodesDiv.innerHTML=tr.nodes.map(n=>{
      const cb=canBuy(c,t,n,false);
      return `<div class="talent-pick ${cb.ok?"":"dis"}" data-n="${n.name.replace(/"/g,"&quot;")}">
        <span class="tdot" style="background:${TIERC[n.tier]}"></span><b>${n.name}</b>
        <span style="color:#4a5c66">${stripT(n.effect).length>100?stripT(n.effect).slice(0,98)+"…":n.effect}</span>
        ${cb.ok?"":`<span class="muted">(${cb.why})</span>`}</div>`;}).join("");
    nodesDiv.querySelectorAll(".talent-pick").forEach(el=>el.addEventListener("click",()=>{
      if(el.classList.contains("dis"))return;
      nodesDiv.querySelectorAll(".talent-pick").forEach(x=>x.classList.remove("sel"));
      el.classList.add("sel"); chosen=el.dataset.n; ok.disabled=false;
    }));
  }
  bg.querySelectorAll("input[name=src]").forEach(r=>r.addEventListener("change",refreshTrees));
  sel.addEventListener("change",refreshNodes);
  refreshTrees();
  bg.querySelector("#spx").addEventListener("click",()=>{bg.remove(); if(forced&&forced.onCancel) forced.onCancel();});
  ok.addEventListener("click",()=>{
    const src=bg.querySelector("input[name=src]:checked").value, t=sel.value;
    buy(c,t,chosen);
    if(src==="M"){ c.bankedM--; c.sparks[t]=false; c.log.push(`Spent milestone point: ${t} → ${chosen} (Flare consumed).`); }
    else { c.bankedF--; c.log.push(`Spent Comet: ${t} → ${chosen}.`); }
    bg.remove(); persist();
  });
}
hotload().then(render);
</script>
</body>
</html>
