                "Weapons":"Melee"}, // v4.10: the Weapons Constellation split into the Melee and Ranged parents

                "SNEAK ATTACK (spine)":"Sneak Attack","RAGE ◆ (spine)":"Rage ❶","Rage":"Rage ❶",

// ---------- wizard ----------
let wiz=null;
// v4.10 chargen: 0 Melee or Ranged · 1 Ancestry · 2 Bloodline · 3 Culture · 4 Background
//                5 Calling · 6 Defenses · 7 Comets · 8 Review
// Step 0 grants one root, Melee Training or Ranged Training, the player's choice. The three Origin
// roots (Ancestry, Bloodline, Culture) are Origin Talent Points granted by the choices themselves, so
// those steps ask for no spending. A finished 1st-level character has a minimum of 14 Talent Points:
// 4 granted, and 10 placed (3 Skill, 1 Lore, 1 Calling, 2 Defense, 3 Comets). See PHB v4.10 ch.3.
const rootNamed=(tree,nm)=>!!tree&&treeOf(tree).nodes.some(n=>(n.root||n.hroot)&&n.name===nm);
function grantSourceStep(nm){
  const p=wiz.picks, has=(l,n2)=>(l||[]).some(id=>id.endsWith("||"+n2));
  const anc=wiz.ch.ancestry?ancTreeName():null;
  if(p.her===nm) return 2;                       // bloodline root: free with the bloodline choice
  if(anc&&rootNamed(anc,nm)&&nm!==p.her) return 1;
  if(p.culName&&rootNamed(p.culName,nm)) return 3;
  if(has(p.bgA,nm)||has(p.bgB,nm)||has(p.bgLore,nm)) return 4;
  if(has(p.calling,nm)||has(p.calSkill,nm)) return 5;
  if(has(p.def,nm)) return 6;

function langs(){
  const cn=wiz.picks.culName, base=[];
  const known=(typeof LANGS!=="undefined"&&LANGS)?LANGS.map(l=>l.name):[];
  if(cn&&TREES[cn]&&treeOf(cn).category==="Culture"){
    const rt=treeOf(cn).nodes.find(n=>n.root), txt=rt?stripT(rt.effect):"";
    // "You know Reachspeak and Common." — take every known language the root names
    known.forEach(l=>{ if(new RegExp("\\b"+l+"\\b").test(txt)) base.push(l); });

    if(kind==="cap"){ s+=`<line x1="${e1.x}" y1="${e1.y}" x2="${e2.x}" y2="${e2.y}" stroke="#E8C25A" stroke-width="1.2" opacity=".45" stroke-dasharray="1 5"/>`; continue; }
    const lit=a&&ownsTalent(a,etree,e1.name)&&ownsTalent(a,etree,e2.name);
    s+=`<line x1="${e1.x}" y1="${e1.y}" x2="${e2.x}" y2="${e2.y}" stroke="${mixW(hue,lit?.62:.32)}" stroke-width="${lit?2.6:1.5}" opacity="${lit?.95:.75}"${lit?"":' stroke-dasharray="4 6"'} marker-end="url(#arr)"/>`;
  }
  const LBL=placeLabels(pts,EW,NR);
  for(const p of pts){
    const r=p.root?12:NR[p.tier], own=a&&ownsTalent(a,etree,p.name), dim=a&&pointsIn(a,etree)>0&&!own;
    const LB=LBL.get(p), la=LB.la, ly=LB.ly, lxx=la==="middle"?Math.max(64,Math.min(EW-64,LB.lx)):LB.lx;
    s+=`<g class="nodeg" data-en="${encodeURIComponent(p.name)}" data-tt="${encodeURIComponent(etree)}||${encodeURIComponent(p.name)}" data-st="${own?"owned":""}" opacity="${dim?.62:1}">`;
    if(p.name.includes("★")&&!p.root)for(let i=0;i<8;i++){const ang=Math.PI/4*i;s+=`<line x1="${p.x+Math.cos(ang)*(r+2)}" y1="${p.y+Math.sin(ang)*(r+2)}" x2="${p.x+Math.cos(ang)*(r+11)}" y2="${p.y+Math.sin(ang)*(r+11)}" stroke="${mixW(hue,.5)}" stroke-width="1.8" opacity="1"/>`;}
    s+=`<circle cx="${p.x}" cy="${p.y}" r="${r*2.6}" fill="${hue}" opacity=".18"/><circle cx="${p.x}" cy="${p.y}" r="${r*1.55}" fill="${hue}" opacity=".38"/>
    <circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${mixW(hue,.45)}" stroke="#FFFFFF" stroke-width="${esel===p.name?2.6:(own?2.2:1.2)}"/>
    <circle cx="${p.x}" cy="${p.y}" r="${r*.36}" fill="#FFFFFF" opacity="1"/>
    ${p.root?`<rect x="${p.x-r-6}" y="${p.y-r-6}" width="${2*(r+6)}" height="${2*(r+6)}" fill="none" stroke="#F0C24E" stroke-width="2" transform="rotate(45 ${p.x} ${p.y})"/>`:""}${p.hroot?`<rect x="${p.x-r-4}" y="${p.y-r-4}" width="${2*(r+4)}" height="${2*(r+4)}" fill="none" stroke="#C0CAD4" stroke-width="1.5" transform="rotate(45 ${p.x} ${p.y})"/>`:""}
    ${own?`<circle cx="${p.x}" cy="${p.y}" r="${r+5}" fill="none" stroke="#D9A441" stroke-width="1.5"/>`:""}${p.feeds&&p.feeds!==t.feeds?`<circle cx="${p.x}" cy="${p.y}" r="${r*1.9}" fill="none" stroke="${ATTRC[p.feeds]}" stroke-width="1.2" stroke-dasharray="3 4" opacity=".85"/>`:""}
    <text class="nlabel" x="${lxx}" y="${ly}" text-anchor="${la}" ${p.root?'style="fill:#F2D9A0;font-weight:700;letter-spacing:1px"':""}>${p.root?"◈ "+p.name.replace(" ★",""):(p.hroot?"✧ "+p.name:p.name.replace(" ★",""))}</text></g>`;
  }
  s+=`<g font-size="10.5" fill="#A8BAC4" font-family="Segoe UI,sans-serif">
    <line x1="20" y1="${EH-14}" x2="52" y2="${EH-14}" stroke="${mixW(hue,.32)}" stroke-width="1.5" stroke-dasharray="4 6" marker-end="url(#arr)"/><text x="58" y="${EH-10}">⇢ requires</text>
    <line x1="140" y1="${EH-14}" x2="172" y2="${EH-14}" stroke="${mixW(hue,.62)}" stroke-width="2.6" marker-end="url(#arr)"/><text x="178" y="${EH-10}">solid = you own both stars</text>
    <text x="345" y="${EH-10}" fill="#F2D9A0">◈ root: every constellation starts here</text>
    <text x="540" y="${EH-10}" fill="#D9A441">☀ rays = capstone (needs any Master talent here)</text></g>`;
  document.getElementById("esvg").innerHTML=s;
  skyNav(document.getElementById("esvg"), "obs|"+etree);
  document.querySelectorAll("#esvg .nodeg").forEach(g=>g.addEventListener("click",()=>{esel=decodeURIComponent(g.dataset.en);drawSky();}));
  bindTips(document.getElementById("esvg"));
  // panel
  const P=document.getElementById("epanel"), g=gatesFor(t.category);
  const node=t.nodes.find(n=>n.name===esel);
  const par=parentOf(etree), kids=childrenOf(etree);
  let h=`<h2 style="font-size:16px">${etree}</h2><div class="muted" style="font-style:italic">${t.meta}</div>`;
  if(par) h+=`<p class="muted" style="font-size:11px;margin-top:4px">Child of <a class="tl" data-tree="${par}">${par}</a>: every point here also counts toward ${par}'s rank. Attack rolls use ${par} proficiency; this style lends its Attribute and opens its exploits.</p>`;
  if(kids.length) h+=`<p class="muted" style="font-size:11px;margin-top:4px">Parent Constellation. Points in ${kids.map(k=>`<a class="tl" data-tree="${k}">${k}</a>`).join(", ")} count toward its rank as well; only rank is inherited, its own Talents must still be bought.</p>`;
  if(a){ const inh=inheritedPts(a,etree);
    h+=`<p style="font-size:12px;margin-top:6px"><b>${a.name||"active"}</b>: ${pointsIn(a,etree)} pts${inh?` (+${inh} from its Combat Styles${rootOwned(a,etree)?`: ${poolPts(a,etree)} for rank`:waitNote(a,etree)})`:""}, ${rankOf(a,etree)?TIERN[rankOf(a,etree)]:"Untrained"} ${a.sparks[etree]?"&#9889; Flared":""}</p>`; }
  if(node){
    h+=`<div style="margin-top:8px"><span class="chip" style="background:${TIERC[node.tier]}">${TIERN[node.tier].toUpperCase()}</span>
      ${a&&ownsTalent(a,etree,node.name)?`<span class="chip" style="background:#D9A441">OWNED</span>`:""}
      ${node.name.includes("★")?`<span class="chip" style="background:#B8860B">CAPSTONE</span>`:""}</div>
      <h3>${node.name}</h3>${node.desc?`<p class="muted" style="font-style:italic;font-size:11px;line-height:1.45;margin-bottom:4px">${node.desc}</p>`:""}<p style="font-size:12.5px;line-height:1.5">${node.effect}</p>${node.prereqs?`<p class="muted" style="margin-top:4px;font-size:10.5px">Prerequisites: ${node.prereqs}</p>`:""}${node.requires?`<p class="muted" style="margin-top:4px;font-size:10.5px">Requires: ${node.requires.join(" or ")}</p>`:""}${node.feeds?`<p class="muted" style="font-size:10.5px">Feeds ${attrIcon(node.feeds)} <b style="color:${ATTRC[node.feeds]}">${node.feeds}</b>${t.feeds&&t.feeds!==node.feeds?` (constellation default: ${t.feeds})`:""}</p>`:""}`;
  }
  h+=`<h3>&#9889; Flares</h3><p class="muted" style="font-size:11px;line-height:1.45">${UNIFLARE}</p>${t.sparks?`<p class="muted" style="font-style:italic;font-size:10.5px;line-height:1.4;margin-top:3px">Examples: ${t.sparks}</p>`:""}
    <p class="muted" style="margin-top:10px;font-size:10.5px">Gates: Expert L${g.E} • Master L${g.M} • Legendary L${g.L}. Ranks at 1/4/9/16 pts: +${RB.T}/+${RB.E}/+${RB.M}/+${RB.L}.</p>`;
  P.innerHTML=h;
  P.querySelectorAll("[data-tree]").forEach(a2=>a2.addEventListener("click",()=>{etree=a2.dataset.tree;localStorage.setItem("sparks-etree",etree);eview={mode:2,cat:treeOf(etree).category};esel=null;ezoom="in";render();}));
}

// ---------- wiki ----------
let wikiSec=localStorage.getItem("sparks-wiki")||"How to Play";
const WIKI_RENAMED={"Actions":"Maneuvers"}; // v4.10: an old bookmark follows the section it named
function vWiki(){
  const secs=["How to Play","Creating a Character","Ancestries","Cultures","Backgrounds","Callings",
              "Defenses","Skills & Styles","Equipment","Traits","Conditions","Maneuvers","Combat",
              "Movement","Awareness & Cover","Going Down","Progression","Thresholds"];
  if(WIKI_RENAMED[wikiSec]) wikiSec=WIKI_RENAMED[wikiSec];
  if(!secs.includes(wikiSec)) wikiSec=secs[0]; // a stale bookmark from a retired section
  let h=`<h2>Wiki</h2><div class="wikinav">${secs.map(s=>`<button class="wn ${s===wikiSec?"on":""}" data-w="${s}">${s}</button>`).join("")}</div>`;
  const tbl=(head,rows)=>`<table class="t"><tr>${head.map(x=>`<th>${x}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</table>`;
  const link=t=>(allTreeNames().includes(t)||/^Lore \(/.test(t||""))?`<a class="tl" data-tree="${t}">${t}</a>`:(t||"");
  const P=s=>`<p style="font-size:12.5px">${s}</p>`;
  // data/actions.xlsx is authoritative for any action it names: its rows print under their Type, in the mode
  // the Type names (Exploration, Downtime, else Encounter), and the roster row of that name is left out wherever
  // it lived (the Maneuver groups, exploration, downtime, the Reactions table).
  const acts=(typeof A!=="undefined"&&A&&A.actions)||[];
  // a Maneuver's bare name: glyphs out, a bracketed reaction cost like "(⓿↺)" out, the trailing to/or joiner out
  const bareAct=n=>String(n).replace(/\(\s*[◆◇↺★⓿❶-❻\s]*\)/g,"").replace(/[◆◇↺★⓿❶-❻]/g,"").replace(/\s+(to|or)\s*$/i,"").trim().toLowerCase();
  const fromSheet=new Set(acts.map(a=>bareAct(a.name)));
  const notSheet=rows=>(rows||[]).filter(r=>!fromSheet.has(bareAct(r[0])));
  const modeOf=t=>/exploration/i.test(t)?"Exploration":/downtime/i.test(t)?"Downtime":"Encounter";
  // actions.json costs: "0".."6", "free", "reaction" (+ optional reaction/reactionCost flags), ranges via costMax/costMode
  const CG={"0":"⓿","1":"❶","2":"❷","3":"❸","4":"❹","5":"❺","6":"❻",free:"⓿",reaction:"↺",passive:""};
  const cg=k=>CG[String(k)]??"";
  const costOf=a=>{ let s=cg(a.cost); if(a.costMax) s+=` ${a.costMode==="or"?"or":"to"} ${cg(a.costMax)}`;
    if(a.reaction&&a.cost!=="reaction") s+=a.reactionCost!==undefined&&a.reactionCost!==""&&String(a.reactionCost)!==String(a.cost)?` (${cg(a.reactionCost)}↺)`:"↺";
    return s.trim(); };
  const sheetTables=mode=>[...new Set(acts.filter(a=>modeOf(a.type)===mode).map(a=>a.type))].map(t=>`<h4>${t}</h4>`
    +tbl(["Maneuver","Cost","Traits","Effect"],acts.filter(a=>a.type===t).map(a=>[`<b>${a.name}</b>`,costOf(a),(a.traits||[]).join(", "),
      (a.requirements?`<b>Requirements</b> ${a.requirements}<br>`:"")+(a.trigger?`<b>Trigger</b> ${a.trigger}<br>`:"")+(a.description?`<i>${a.description}</i><br>`:"")+a.effect]))).join("");
  const threatTbl=()=>tbl(["Threat","Answered by","Or by"],THREATS.map(([k,a,b])=>[`<b>${k}</b>`,link(a),link(b)]));

  if(wikiSec==="How to Play") h+=`
    <div class="callout"><b>Check = d20 + Attribute Bonus + Proficiency Bonus + bonuses &amp; penalties</b> (Situation, Condition, Gear). One formula for everything. A tenth-level character is not better at everything because a number went up; they are better at the things they have actually done. Your Attribute Bonus is raw talent. Your Proficiency Bonus is what training adds on top: the bonus from your rank in whichever Constellation the task belongs to, and simply +0 if you have no rank there at all. <b>Level opens the door to higher ranks and pays out Talent Points; it never touches the die.</b> Same-type bonuses never stack; take the best.</div>
    <div class="callout" style="border-color:#B8860B"><b>You roll. Always.</b> The GM sets Thresholds; the players roll dice. Whether you are swinging an axe or answering one, whether the danger is a bandit or a burning rafter, the die is in your hand. A <b>Threshold</b> is ten plus the modifier of the check it stands in for: 10 + Attribute Bonus + Proficiency Bonus, and any bonuses and penalties that apply. A character whose Guard is +7 has a Guard Threshold of 17, and an adversary's Thresholds are built the same way.</div>
    ${P("<b>Which Constellation?</b> Usually it is obvious. When it is not, the player proposes the one that best fits what they are actually doing, and the GM has the final say.")}
    ${P("Three modes of play: <b>Encounter</b> mode when seconds matter, <b>Exploration</b> mode in minutes and hours, and <b>Downtime</b> mode over days, weeks, and months (where income, retraining, and deliberate training live).")}
    <h3>Degrees of success</h3>
    ${tbl(["Result","Meaning for most checks","Meaning for Attacks"],[
      ["Beat the Threshold by 10+","Critical success, and a possible &#9889; Flare","Critical Hit: extra damage, plus critical effects"],
      ["Meet or beat the Threshold","Success","Hit: normal damage"],
      ["Miss the Threshold","Failure","Graze: Stopped, but it skates. One die, or one round"],
      ["Miss by 10+","Critical failure, and a possible &#9889; Flare","Miss: Stopped. Nothing lands"],
      ["Natural 20 / 1","Step the result one degree up / down","Step the result one degree up / down"]])}
    <h3>Ranks</h3>${tbl(["Proficiency Rank","Proficiency","Min. points in the Constellation","Min. level"],[
      ["Untrained","+0","—","—"],["Trained","+3","1","Level 1"],["Expert","+6","4","Level 5"],["Master","+9","9","Level 10"],["Legendary","+12","16","Level 15"]])}
    ${P("One ladder and one gate schedule for every Constellation. Rising in rank needs <b>both</b> the points and the level. Every Constellation begins with a root: buying it is what makes you Trained, and nothing in a Constellation can be bought before it. Many Talents are tier-gated: an Expert Talent requires Expert rank.")}
    <div class="callout"><b>Parent Constellations.</b> ${link("Melee")} and ${link("Ranged")} are parents (Magic will be a third). Every Combat Style is a child of one of them, and every Talent you buy in a child counts toward your Proficiency Rank in its parent as well as in the child. Only rank is inherited: the parent's own Talents must still be bought for their effects, and a Talent feeds its Attribute once. When you Strike, roll the parent that owns the weapon: Melee for anything in your hand, Ranged for anything that leaves it, a thrown dagger included.</div>
    <h3>Attributes</h3>
    ${P("Might is muscle, endurance, and raw force. Agility is speed, balance, and precision. Wits is perception, memory, and fast thinking. Presence is raw nerve, willpower, and weight of personality. You never buy them and never roll them up: every Talent feeds one, and <b>your bonus is the points you've spent in its Talents ÷ 4, rounded down</b>, to a maximum of +5.")}
    ${tbl(["Attribute points","Bonus"],[["0–3","+0"],["4–7","+1"],["8–11","+2"],["12–15","+3"],["16–19","+4"],["20+","+5 (the maximum)"]])}
    <h3>Derived numbers</h3>
    ${tbl(["Stat","Formula"],[
      ["Vigor","10 + Ancestry Vigor + Calling Vigor at 1st level; add both again at every level after. Only your first Calling counts."],
      ["Any Defense","attribute + proficiency (if any). Its Threshold is 10 + that. An Untrained Defense still adds its attribute; its Thresholds are simply 3 lower."],
      ["Any Threshold","10 + attribute + proficiency + bonuses and penalties: a check with a 10 in place of the die"],
      ["Attack roll","d20 + Strike Attribute + Melee (weapon in hand) or Ranged (weapon that leaves it) proficiency, against the Defense that answers it"],
      ["Deliberate ❷ or Committed ❸ Hit","[weapon dice + specialization + Might + bonuses &amp; penalties] − Protection"],
      ["Quick ❶ Hit","one weapon die + precision − Protection"],
      ["Graze","one weapon die − Protection, minimum 1, and nothing else"],
      ["Initiative","usually an Awareness check, or whatever you were actually doing (Stealth, if you were creeping)"],
      ["Speed","feet per Move ❶; a Human's is 6. Step ❶ is half your Speed; Rush ❸ is 5 × Speed in a straight line, less Load Strain"],
      ["Load Strain","the total Load of your armor, minus your Endure reduction and the matched-harness point, minimum 0"],
      ["A night's rest","Vigor equal to level × Presence (minimum your level). Wounds do not rest away."]])}
    <h3>Bonuses and penalties</h3>
    ${P("Three types, named for where the number comes from. A <b>Situation</b> bonus or penalty comes from where you stand and what is happening around you: cover, high ground, an ally's help, a foe Off-Guard. A <b>Condition</b> bonus or penalty comes from something on you: Frightened, or a stance you have taken. A <b>Gear</b> bonus or penalty comes from what you hold or wear: a raised shield. Bonuses of the same type do not stack; use the highest. Penalties of the same type do not stack; use the highest. A bonus and a penalty of the same type add together. Fractions always round down, and multipliers combine by addition: count how far past 1 each takes you, add those, and apply the result once.")}
    ${tbl(["Example","Result"],[["+1 Situation bonus, −2 Situation penalty","−1 Situation penalty (same type: add them together)"],["+1 Gear bonus, +1 Condition bonus","+1 Gear bonus and +1 Condition bonus (different types: keep them separate)"],["−3 Condition penalty, −1 Condition penalty","−3 Condition penalty (same type: only the highest penalty)"]])}
    <h3>Types of Talent Point</h3>
    ${P("Every Talent costs exactly 1 Talent Point, but not every point is free to go anywhere. A point's type answers two questions: where it may be spent, and whether the Constellation must be Flared.")}
    ${tbl(["Type","May be spent on","Flare required?"],(R.talentPointTypes||[]))}
    <h3>Hero Points</h3>
    ${P("Start each session with 1 (maximum 3; the GM awards more for heroism, clever play, and beautiful failure). Spend 1 to <b>reroll a check</b>, taking the new result. Spend all of them (minimum 1) to refuse death: that is not a roll, it cannot fail, and nothing in the game can stop it.")}
    <h3>The round</h3>
    ${P("A round is about six seconds. At the start of each round every combatant receives <b>six actions</b>; unspent actions expire at the end of the round, with no banking and no borrowing. Initiative order is fixed for the encounter, and play cycles through it repeatedly. Each time the order reaches you, you have an <b>Opportunity</b>: perform <b>one Maneuver</b> you can afford, begin or finish a Prepared Maneuver, or <b>Pass</b>. Pay its cost and play moves to the next combatant; you cannot chain two Maneuvers in one Opportunity. A ⓿ Maneuver costs nothing and never uses up your Opportunity. <b>Reactions ↺</b> are Maneuvers performed outside your Opportunity, the moment their Trigger occurs, paid from the same six. A Maneuver of ❸ or more is <b>Prepared</b>: spend one action now, reserve the rest, and it resolves at your next Opportunity. When a full circuit goes by in which everyone Passes, the round ends. A second or third attack in a round costs no penalty on the die; tempo is paid in actions, and six uninterrupted attacks is what a corpse looks like.")}
    ${tbl(["Symbol","Meaning"],[["❶ ❷ ❸ ❹ ❺ ❻","one to six actions"],["⓿","free: no actions, and it never uses up your Opportunity"],["↺","the Reaction trait: usable in answer to its Trigger, at the listed action cost (❶↺, ⓿↺)"]])}
    <h3>Conventions</h3>
    ${P("<b>The player rolls.</b> The GM does not roll behind a screen; monsters carry Thresholds instead, for Initiative, for each attack, and for each Defense. If two players are opposed, the acting player rolls. <b>Player knowledge is not character knowledge</b>: you may know your Awareness roll was low, but your character does not. <b>Specific beats general</b>: the general rule is that you cannot Step into Difficult Terrain, but the Skirmisher's Step Talent lets you. In all cases the GM has the final decision on the results of rolls and the interpretation of rules, at least during the session.")}`;

  if(wikiSec==="Creating a Character") h+=`
    <div class="callout">Your first Constellation is yourself. Ancestry, Bloodline, and Culture merge into one sky, your <b>Origin</b>, and their three roots are granted by the choices themselves. Every character begins <b>Trained in Melee or Ranged</b>, your choice, and in <b>two of the four Defenses</b> (Awareness, Evade, Guard, and Endure).</div>
    ${tbl(["Step","You choose…","You get…","Talent Points"],(R.chargenSteps||[]))}
    <div class="callout" style="border-color:#B8860B"><b>Keyword: become Trained in.</b> When an effect says you become Trained in a Constellation, you gain a talent point that must be spent in that Constellation. If it isn't open yet, the point buys the Training root, and that purchase <i>is</i> becoming Trained. Already open? The point buys any talent there you qualify for: training stacks into growth, never wasted.</div>
    <h3>Defenses</h3>
    ${P("At 1st level you gain <b>2 Defense Talent Points</b>. Choose wisely: each Defense answers two of the four kinds of threat (Blows, Blasts, Blights, Beguilement), and each kind is answered by two Defenses. Two Trained Defenses cover three kinds; choose the pair whose gap you can live with. A Defense you leave Untrained still adds its Attribute, but every Threshold that depends on it is 3 lower.")}
    ${threatTbl()}
    <h3>What a finished 1st-level character has</h3>
    ${P("A minimum of <b>14 Talent Points</b> spent. One is automatically granted: <b>Melee Training or Ranged Training</b>, your choice. Thirteen come from character creation: 3 Origin, 3 Skill, 1 Lore, 1 Calling, 2 Defense, and 3 Comets. Some choices grant additional Talent Points, so your total may be higher.")}
    <h3>Finishing up</h3>
    ${P("<b>Vigor</b> at 1st level is 10 + Ancestry Vigor + Calling Vigor. <b>Attribute Bonuses</b>: total your points per Attribute (each Constellation feeds one); Attribute Bonus = points ÷ 4, rounded down. <b>Derived stats</b>: Vigor and your Defenses as above; note your rank (almost always Trained, +3) in each Constellation you own. <b>Gear</b>: you begin with 15 gold pieces, plus a travelling kit (pack, bedroll, rope, a week's rations, torches, flint, waterskin, the tools of your trade) that costs coppers and needs no tracking.")}
    ${P("Fifteen gold does not buy a complete plate harness: that is four pieces, Load 7, and about 45 gp. <b>Everyone starts the game with gaps in their armor, and deciding where those gaps go is your first real equipment decision.</b>")}`;

  if(wikiSec==="Ancestries") h+=`<div class="callout">Your Ancestry is the body you were born in: it forms the trunk of your Origin, and sets your Vigor per level, Size, Speed, and one special ability. Its root is an Origin Talent Point granted by the choice. Your <b>Bloodline</b> is the lineage inside it, and adds a branch.</div>`
    +tbl(["Ancestry","Vigor/lvl","Size","Speed (ft per Move)","Senses","Key attribute"],R.ancestries.map(a=>[link(a.tree),ancVigor(a),a.size||"Medium",feet(a.speed)+" ft",a.senses||"—",treeOf(a.tree).feeds||"—"]))
    +R.ancestries.map(a=>{
      const tr=treeOf(a.tree), hs=(tr.nodes||[]).filter(n=>n.hroot);
      const rows=hs.length?hs.map(n=>[`✧ ${n.name}${n.feeds?` <span class="muted">(${n.feeds})</span>`:""}`, n.effect]):(a.bloodlines||a.heritages||[]);
      return `<h3>${a.name}: Vigor ${ancVigor(a)} • ${a.size||"Medium"} • Speed ${feet(a.speed)} ft${a.senses&&a.senses!=="—"?" • "+a.senses:""}</h3>
      <p style="font-size:12px;font-style:italic;color:#4a5c66">${a.blurb}</p>
      ${rows.length?tbl(["Bloodline (choose one; root granted free)","Grants"],rows):""}
      <p class="muted">Ancestry Constellation: ${link(a.tree)}</p>`;}).join("");

  if(wikiSec==="Cultures") h+=`<div class="callout">Culture is deliberately separate from Ancestry: an orc raised among Serrovanians is simply both. Choosing a Culture grants its root free, and that root is always a language plus a scaled bonus to Diplomacy toward those who share it. You can embrace or reject your Culture, but you can't unlearn its language.</div>`
    +tbl(["Culture","Language(s)","Key attribute","About"],R.cultures.map(c=>[link(c[0]),c[1],c[2],c[3]||""]))
    +P("The Diplomacy bonus scales with your Origin Constellation: +1 while Trained, +2 at Expert, +3 at Master, +4 at Legendary.")
    +(typeof LANGS!=="undefined"&&LANGS&&LANGS.length?`<h3>Languages</h3>`+tbl(["Language","Rarity","About"],LANGS.map(l=>[l.name,l.rarity,l.desc||"—"])):"");

  if(wikiSec==="Backgrounds") h+=`<div class="callout">Your life before the road: each Background gives you Training in <b>two</b> Skills that its trade leans on, and in a relevant <b>Lore</b>. That is 2 Skill Talent Points and 1 Lore Talent Point, three of the thirteen you get at creation.</div>`
    +tbl(["Background","Skills (1 point each)","Lore (1 point)","You were…"],
      (bgData()||[]).map(b=>[b.name,(b.skills||[]).map(link).join(" & "),b.lore?link(b.lore):"—",stripT(b.desc)]));

  if(wikiSec==="Callings") h+=`<div class="callout">Callings are what other games call classes, except the signature feature sits at the <b>root</b>, so your very first point buys the fantasy. 'Barbarian' was never a job. It was Rage plus Athletics plus a big axe. Now it's yours in any combination or permutation. Each Calling grants Training in 1 Skill or other Constellation, adds a certain amount of Vigor per level, and gives you a special ability.</div>`
    +tbl(["Calling","Free Training","Vigor/lvl","Key attribute","Special ability"],
      (R.callings||[]).map(c=>[link(c[0]),link(c[1]),c[2],c[3],c[4]]))
    +P("Only your <b>first</b> Calling counts toward Vigor, however many you open later.");

  if(wikiSec==="Defenses") h+=`<div class="callout">There are a multitude of ways you can attack your foes, and they have just as many for you. There are four ways to answer them. Your four Defenses are Constellations like any other. You begin play <b>Trained in two of them</b>, your choice, and the other two are Untrained until you spend Defense Talent Points on them; an Untrained Defense still adds its Attribute, it simply has no Proficiency Bonus. Each works two ways: your check is what you roll, and your Threshold is what someone else has to beat.</div>`
    +tbl(["Defense","Key attribute","In a word","Answers","Also answers"],
      (R.defenses||[]).map(dd=>[link(dd[0]),dd[1],dd[2],dd[3],dd[4]]))
    +`<h3>The Four Threats</h3>`
    +P("Every threat is one of four kinds, and every kind is answered by two of the four Defenses. When a rule names a single Defense, roll that one; when it names a kind of threat, or names nothing, the defender chooses either of the two.")
    +threatTbl()
    +P("The wheel closes on the Attributes: Guard (Presence) meets Blows and holds its nerve against Beguilement; Evade (Agility) slips both Blows and Blasts; Endure (Might) stands through Blasts and Blights; Awareness (Wits) catches Blights early and sees through Beguilement. Each Defense you train covers two kinds of threat. Two Trained Defenses cover three and leave one where you roll your Attribute alone; that gap is yours to choose.")
    +`<div class="callout" style="border-color:#B8860B"><b>When a Defense is unavailable.</b> <b>Evade</b> is unavailable while you are Grabbed or Restrained: you cannot slip what is already holding you. <b>Guard</b> is unavailable while you are unaware of the attack, or while you have nothing equipped to ward away the blow: you cannot meet what you did not see or cannot reach. Guard answers a ranged Blow only with a shield Raised: you cannot parry an arrow with a sword; you can catch it on a board. <b>Endure and Awareness are never unavailable</b>; you always have your body and your wits, for whatever they are worth against that particular threat. The GM may determine that others apply.</div>`
    +`<h3>Answering an attack: the basic roll, or a Reaction</h3>`
    +P("You may always roll one of the two Defenses that answer the threat, regardless of how many actions you have remaining. That roll is your <b>basic defense</b>: ordinary footwork, guard position, constitution, alertness. For the potential to do better, you use a <b>Reaction ↺</b>: a Maneuver performed the moment the attack is declared, paid for from the same pool of six actions you attack with. Each Reaction is granted by a Talent; without the Talent, the basic roll is all you have. A fighter who spends five actions attacking has one left to defend with; a fighter who holds three has answers. You may React before your first Opportunity of the round, and as often in a round as you can afford. At 0 actions you still roll your basic Defense, and you may still take a Posture. <b>A Reaction never triggers another Reaction.</b>")
    +tbl(["Reaction","Granted by • Defense","Effect"],notSheet(R.postures))
    +P("<b>Postures</b> are Reactions ⓿↺ gained from Talents, typically from the Evade and Guard Constellations. They may only be used before you know whether the attack was successful. A Posture costs no actions, but it Exposes a Zone of your choice until the end of the round, whether or not it works, and Recenter does not clear that Exposure. Its bonus is a Situation bonus, the same type Parry and Void grant, so a Posture and a Parry or Void do not stack.")
    +`<h3>Size</h3>`
    +P("Creatures gain an innate Evade and Guard difference against physical Attacks based on size. A small fighter is a harder target and a worse wall; a large one is the reverse.")
    +tbl(["Size","Space / token","Natural Reach","Effect on Evade & Guard"],(R.sizes||[]));

  if(wikiSec==="Skills & Styles") h+=`<div class="callout">Instead of skills, classes, and feats, everything a character can do grows on Talent Constellations. Enter any one by spending 1 point on its Root Talent; total investment sets your rank; rank unlocks deeper tiers.</div>
    <h3>Skill Constellations</h3>`
    +tbl(["Skill","Key attribute","Covers"],R.skillRoster.map(s=>[link(s[0]),s[1],s[2]]))
    +P("The <b>Lore</b> Constellation is a template: every Lore you take, Lore (Circus) or Lore (Warfare) or any other, is its own copy of it, so a character can grow several Lores side by side.")
    +`<h3>Melee, Ranged, and the Combat Styles</h3>`
    +`<div class="callout"><b>A Combat Style is a school of exploits, not your attack bonus.</b> Attacks always use your Melee or Ranged Proficiency, while the style you fight in sets the Attribute and opens that school's Talents. Every Combat Style is a child of Melee or Ranged, so every Talent you buy in it also counts toward the parent's rank; only rank is inherited, and a Talent feeds its Attribute once. Checks a Combat Style Talent calls for may use the parent's Proficiency, or the Combat Style's own.</div>`
    +tbl(["Style","Feeds","Fights with","Child of"],R.weaponStyles.map(w=>[link(w[0]),w[1],w[2],link(parentOf(w[0])||"—")]))
    +P(`Everyone begins Trained in ${link("Melee")} or ${link("Ranged")}, your choice. Melee represents transferable fundamentals: measure, timing, reading an opponent, footwork, maintaining guard, committing to a strike. Ranged represents what transfers between every weapon that leaves the hand: judging distance, timing a release, leading a moving target, and shooting past friends. A dagger uses Melee in your hand and Ranged in the air.`)
    +`<div class="callout" style="border-color:#B8860B"><b>Attack roll = d20 + your Strike Attribute + the parent's Proficiency Bonus.</b> Your Strike Attribute is the higher of two numbers: the weapon's natural Attribute (Might; or Agility for a weapon with the Finesse trait, and for any ranged weapon other than a composite bow or a thrown weapon), or the Key Attribute of a Combat Style whose root you have and whose weapons you are wielding. Work it out once per weapon and write it on your sheet. Damage still adds Might where the Strike allows it.</div>`;

  if(wikiSec==="Equipment") h+=`<div class="callout"><b>What gear does, and what it doesn't.</b> Your sword does not make you accurate and your armor does not make you hard to hit. Skill does that, and skill lives in your Talents and in your Constellations. Gear decides what happens when steel finally meets you: a weapon sets the size of the wound, armor sets how much of that wound your body actually feels. This is why there are <b>no magic plusses</b> in STARWROUGHT. Quality, craftsmanship, and enchantment give a weapon <b>Traits</b>, never numbers. A masterwork blade is not a +1 sword; it is a sword that can do something an ordinary one cannot.</div>
    ${P("<b>Starting equipment.</b> You begin play with <b>15 gold pieces</b>. Spend it on the tables below, plus a travelling kit: pack, bedroll, rope, rations for a week, torches, flint, waterskin, and the tools of your trade, all of which cost coppers and none of which needs tracking.")}
    <h3>Armor</h3>`
    +P("Armor is worn in four places: Arms, Legs, Torso, Head. Each Zone holds one piece, and each piece is bought, worn, and lost separately. There is no such thing as 'a suit of plate' on your sheet; there is a breastplate, a helm, a pair of vambraces, and greaves, and you own as many as you can afford. Each piece has <b>Protection</b> (subtracted from every instance of damage landing on that Zone, a Graze included), <b>Load</b>, and Traits. Your torso is the number that matters most, because ordinary Hits land there. The other three Zones come into play when someone has earned an opening.")
    +`<div class="callout" style="border-color:#B8860B"><b>Load Strain</b> = the total Load of all armor you are wearing. Subtract your Load Strain from your <b>Evade</b>, and from any Might- or Agility-related Skill check. Training in ${link("Endure")} reduces Load Strain as your Proficiency Rank in it rises: −1 at Expert, −2 at Master, −3 at Legendary (to a minimum of 0).</div>`
    +`<h4>What armor costs in a fight</h4>`
    +P("Armor does not make you easier to hit, and it costs a Guard fighter nothing on the roll. It costs three other things, all of them real. <b>Wind.</b> At the end of the third round of an encounter and every round after, a fighter with Load Strain 1 or more rolls Endure against <b>10 + Load Strain</b>. On a failure they are Fatigued (−1 Evade and Guard) until they catch their breath after the fight. Men in harness fought hard for a minute, not ten. <b>Sight and hearing.</b> A closed helm gives a <b>−2 Situation penalty</b> to Awareness checks, your Awareness Threshold, and Initiative; an open helm, <b>−1</b>. The Head Zone's Protection is bought with your eyes. <b>Speed at the margin.</b> Armor does not slow a walk; it kills a sprint and a climb. Your Rush and Leap distances are reduced by your Load Strain in feet, and Climb and Swim are Athletics checks, so Load Strain already applies to them.")
    +tbl(["Piece","Zone","Protection","Load","Price","Traits","Material"],(R.armorPieces||[]))
    +`<h3>Armor of proof</h3>`
    +P("Every piece is made of something, and every material has a blow it turns badly. Against the damage type its material turns poorly, a piece's Protection is <b>reduced by 1</b>. A Zone with no armor has no material, and so has no such weakness.")
    +tbl(["Material","Turns poorly"],(R.materials||[]))
    +P("The sword rules the unarmored field, the spear point defeats mail, and the mace is the answer to plate. It is why a careful fighter carries more than one weapon, and why <i>versatile</i> is worth more than it looks: a longsword that can thrust is a longsword that can fight mail.")
    +`<h3>Two rules for mixed kit</h3>`
    +P("<b>Matched harness.</b> If all four of your pieces have the same Material <i>and</i> the same Protection value, add +1 Protection to your torso and reduce your Load Strain by 1, to a minimum of 0. A complete kit sits and moves better than a collection.")
    +P("<b>Clatter.</b> If two or more of your pieces are mail or plate while your torso piece is neither, your kit rattles: you are <i>Noisy</i> regardless of what the individual pieces say.")
    +P("Putting on or taking off a single piece takes 1 minute per point of Protection it has. You cannot sleep in armor without waking fatigued <i>unless your torso piece has Comfort</i>. A complete harness of plate with a closed helm is four pieces, Load 7, and about 45 gp.")
    +`<h3>Shields</h3>`
    +P("A shield is not armor. It grants no Protection, because it does not cover a Zone; it is a tool you actively interpose, which is why it improves <b>Guard</b> and only while you Raise it. <b>Raise a Shield ❶</b> grants the Gear bonus to Guard for physical Attacks until your next Opportunity. A Raised shield is a <b>rigid implement</b>: you may Parry, Bind, and Gain Control with it, and a shield that Controls a foe's weapon opens a Zone for the sword in your other hand. Hardness matters only if you have the Shield Block talent: it is how much damage the shield swallows before the rest reaches you. A tower shield gives you Cover when Raised, and Greater Cover if you Take Cover while it is Raised.")
    +tbl(["Shield","Gear bonus to Guard when Raised","Hardness","Load","Price","Note"],
      (R.shields||[]).map(s=>[s[0],s[1]?"+"+s[1]:"—",s[2],s[3],s[4],s[5]]))
    +`<h3>Weapons</h3>`
    +P("A weapon gives you a damage die and a handful of Traits. It never touches your attack roll; that comes from your Melee or Ranged Proficiency and your Strike Attribute. <b>Damage on a Hit is your weapon's dice, plus your Might (on a Deliberate or Committed Strike), plus your weapon specialization</b> (+2 at Expert, +3 at Master, +4 at Legendary). You roll more dice as you level: <b>two at 4th, three at 8th, four at 12th, five at 16th</b>. A Quick Strike ❶ deals one die plus precision damage and nothing else. <b>Damage on a Graze is a single weapon die and nothing else</b>: no Might, no specialization, no extra dice from your level, no talent damage of any kind; then subtract the Protection of the Zone it landed on, to a minimum of 1.")
    +`<div class="callout" style="border-color:#B8860B"><b>Traits that shape the Exchange.</b> <b>Parry</b>: a guard built for defense, +1 Gear bonus to Guard against melee Attacks while you wield it. <b>Agile</b>: light enough to bite on the way in; a Quick Strike ❶ with it may Critically Hit. <b>Flexible</b> (whips, flails): it cannot Parry, form a Bind, or be Bound, though you can still Guard with it. <b>Unwieldy [N]</b>: −2 Situation penalty to attack rolls against a target within N feet, no attacking with it while Grabbed, and a creature within N feet that you attack with it may Intercept you, as though you had entered its Reach. <b>Massive</b>: any Critical Hit Wounds, Exposed Zone or not; reserved for the largest creatures. <b>Unparryable</b>: cannot be answered with Parry and offers nothing to Bind; Guard still applies. <b>Deadly dX</b> is added after the doubling on a Critical Hit and is not itself doubled. <b>Thrown X</b> uses Might for the attack roll; <b>Ranged [N]</b> uses Agility; <b>Mechanical</b> adds no Might to damage.</div>`
    +`<h4>Handling</h4>`
    +P("All weapons are Intuitive, Practiced, or Technical. Intuitive weapons use your full Melee or Ranged Proficiency Bonus; Practiced and Technical weapons do not unless you are Familiar with them, which comes from the Weapon Familiarity talent (Drilled grants it free).")
    +tbl(["Handling","Meaning","If you lack Familiarity"],(R.handling||[]))
    +`<h4>Melee weapons</h4>`+tbl(["Weapon","Handling","Group","Damage","Reach (ft)","Traits","Price"],(R.weaponsMelee||[]))
    +`<h4>Ranged weapons</h4>`+tbl(["Weapon","Handling","Group","Damage","Range","Traits"],(R.weaponsRanged||[]))
    +P("Reach assumes a weapon meant for a Medium-sized creature: Weapon Reach = normal Reach × the Weapon Size Factor (Tiny 1/3, Small 2/3, Medium 1, Large 1½, Huge 2, Gargantuan 3); when rounding down, treat 0 ft as Adjacent. You may wield a weapon of your Size or smaller, and a weapon retains its own damage, Reach, Traits, and hands required whoever holds it. <b>Total Reach = your Natural Reach + the weapon's Reach</b>, measured from the edge of your space to the edge of your target's.");

  if(wikiSec==="Traits") h+=`<div class="callout">A Trait is a word attached to an action, a Talent, an item, a spell, or another word that plugs it into a rule written somewhere else. Traits keep the game rules from repeating themselves: rather than writing "a foe answers this with a Defense, as an Exchange" on forty different things, each one simply has the Attack trait. <b>A Trait is never flavor.</b> If the word is in a Trait line, some rule cares about it.</div>
    <h3>Maneuver traits</h3>${tbl(["Trait","What it means"],(R.actionTraits||[]))}
    <h3>Weapon traits</h3>${tbl(["Trait","Effect"],(R.weaponTraits||[]))}
    <h3>Armor traits</h3>${tbl(["Trait","Effect"],(R.armorTraits||[]))}`;

  if(wikiSec==="Conditions") h+=tbl(["Condition","In one line"],R.conditions);

  if(wikiSec==="Maneuvers") h+=`<div class="callout">A <b>Maneuver</b> is anything you do at an Opportunity: a Step, a Strike, a Gain Control, a spell. Each has a cost in actions, the six you receive each round, marked ⓿, ❶, ❷, ❸, and so on. A Maneuver of two or more actions is a single indivisible thing: interrupt it and you lose all of it. A <b>⓿ Maneuver</b> costs no actions and never uses up your Opportunity: you may perform any number of them alongside the Maneuver you take, and ⓿ Reactions whenever their Trigger occurs. You take <b>one Maneuver at each of your Opportunities</b>. Between Opportunities you may spend actions only on <b>Reactions ↺</b>: Maneuvers with the Reaction trait, performed the moment their Trigger occurs. A Maneuver of ❸ or more is <b>Prepared</b>: spend one action now and set the rest aside as reserved; at your next Opportunity you must finish it or abandon it (losing the action spent), and taking a Wound abandons it for you. <b>Pass</b> is not a Maneuver at all: it is declining your Opportunity, and a full circuit of Passes ends the round.</div>`
    +`<h3>Encounter Mode</h3>`
    +sheetTables("Encounter")
    +Object.entries(R.actions||{}).map(([grp,rows])=>{ const kept=notSheet(rows);
      return kept.length?`<h4>${grp}</h4>`+tbl(["Maneuver","Traits","Effect"],kept):""; }).join("")
    +`<h3>Exploration Mode</h3>`
    +P("Your Travel Speed is <b>Speed × 40 feet per minute</b>, <b>Speed ÷ 2 miles per hour</b>, or <b>Speed × 4 miles per day</b>. Exploration Mode Activities (such as Avoid Notice) halve it, except Hustle, which doubles it. Difficult Terrain halves it; Greater Difficult Terrain cuts it to one-third. As a rule of thumb, it takes about 10 minutes to proceed through a location while performing Activities such as Search, be it a ballroom, a dungeon corridor, or a forest clearing.")
    +sheetTables("Exploration")
    +tbl(["Activity","Speed","Effect"],notSheet(R.explorationActions))
    +`<h3>Downtime Mode</h3>`
    +P("You spend days, and the GM typically tells you how many you have before the world begins to move quickly again. One activity per day: an activity that takes a week is the same choice made on seven consecutive days, and interrupting it loses the days already spent unless the GM says otherwise. Ordinary rest is not a Downtime Activity: a night's sleep already restores some of your Vigor but none of your Wounds; Downtime is for the things a night's rest cannot fix.")
    +sheetTables("Downtime")
    +tbl(["Activity","Duration","Effect"],notSheet(R.downtimeActions));

  if(wikiSec==="Combat") h+=`
    <div class="callout"><b>Every attack in Starwrought is an exchange</b>: a sword, a fireball, a poisoned cup, or a lie told to a guard. A fencing master would tell you the first question is not whether it landed but who came out of it holding the advantage. One roll answers three things at once: whether harm landed, how much, and who is out of position. The exchange runs in the same order every time: the Attack is declared, the Defense answers it, the die decides the Result, the Damage and effects land, and the Position of everyone involved is settled.</div>
    ${tbl(["Step","Resolving an Exchange"],[
      ["1. Declare the Attack","The attacker names the Maneuver, its target (which must be within the Attack's Reach or Range and legal to target), the weapon, spell, or effect involved, and how many actions are behind it, and checks any Requirements."],
      ["2. Answer","Every threat is either a Blow, a Blast, a Blight, or a Beguilement. The defender chooses one of the two Defenses that answer it (unless the GM or a rule names one or makes one unavailable), and decides whether to spend an action on a Reaction, take a Posture, or do neither. Anything else that must be declared before the outcome is known is declared now."],
      ["3. Roll","The player rolls: their Attack against the chosen Defense Threshold, or their chosen Defense against the creature's Attack Threshold, with all bonuses and penalties. How far the roll beat or missed the Threshold gives the Result: Critical Hit, Hit, Graze, or Miss."],
      ["4. Apply the Harm","Roll the damage or effect the Result calls for and apply it where the Result puts it, in the order of operations for damage, along with any conditions, Wounds, Persistent Damage, or forced movement the Attack created."],
      ["5. Settle Position","If a Blow was Stopped, resolve the Bind, Control, ground given, and Exposure it causes."],
      ["6. Resolve Triggered Abilities","A Reaction occurs at the moment its Trigger describes: one triggered by a Move happens before the movement, one triggered by a Hit after the Result is read."]])}
    <h3>1. The Attack</h3>
    ${P("Anything with the Attack trait is an Attack, and every Attack is answered with a Defense. A sword Strike is an Attack. So is a Grapple, a fireball, a dose of poison, and a lie. What they share is the check: <b>d20 + the Attribute the Attack uses + your Proficiency Bonus in the Constellation it belongs to + bonuses and penalties</b>, against the Threshold of the Defense that answers it. When a creature attacks, that number is its Attack Threshold, and the player rolls the Defense against it instead.")}
    ${P("<b>Your Strike Attribute</b> is the higher of two numbers: the weapon's natural Attribute (Might; or Agility for a weapon with the Finesse trait, and for any ranged weapon other than a composite bow or a thrown weapon), or the Key Attribute of a Combat Style whose root you have and whose weapons you are wielding. Work it out once per weapon and write it on your sheet. Damage still adds Might where the Strike allows it.")}
    <h4>Strikes</h4>
    ${P("An Attack made with a weapon, natural weapon, or unarmed blow is a Strike. A Strike is always a Blow, but not every Blow is a Strike: a Grapple, a Shove, a falling rock, and a conjured fist are Blows too. Strike names the Maneuver you take; Blow names the kind of threat the defender answers. A Strike uses the Strike Maneuver and your <b>Melee or Ranged Proficiency</b>. It can take one, two, or three of your actions, and the count is a statement about how much of yourself you are putting behind it.")}
    ${tbl(["Strike","Body behind it","If it is Stopped"],[
      ["<b>Quick ❶</b>","None. It is a probe: one weapon die plus any precision damage, and nothing else. No level dice, no specialization, no Might. It cannot Critically Hit (a natural 20 is a Hit), Protection applies to it in full even on an Exposed Zone, and it lands on the Torso.","Nothing. You recover your line at once. A Guard can bind a probe, but not Control it."],
      ["<b>Deliberate ❷</b>","Full. All dice, specialization, and your Might. It can Critically Hit, it may be placed on an Exposed Zone, and on a Critical Hit you Expose a plausible Zone.","A Graze costs you nothing but the tempo. On a Miss, you are Exposed in a Zone of the defender's choice. A Parry that Stops it takes Control."],
      ["<b>Committed ❸</b>","Everything. Prepared: resolves at your next Opportunity. All dice, specialization, and your Might. On any Hit, Expose a plausible Zone.","You are Exposed in a Zone of the defender's choice, Graze or Miss. A Parry that Stops it takes Control."]])}
    ${P("Only a Committed Strike has the <b>Weighted</b> trait: a Graze against it Exposes you. A Miss Exposes you regardless of commitment; you Missed outright, and everyone saw where your weapon ended up. A Parry can take Control of any Deliberate or Committed blade it Stops, because a committed blade is there to be bound. A Quick Strike is a probe: Stopped, it forms at most a neutral Bind. <b>Agile</b> weapons are light enough to bite on the way in: a Quick Strike with one may Critically Hit.")}
    ${P("<b>Other Attacks.</b> Athletics attacks (Grapple, Shove, Trip, Disarm, and Reposition) are Blows answered by Evade or Guard. They read the Result the same way; what a Hit or Graze does is written in each attack's own entry under Maneuvers. Blasts, Blights, and Beguilements come from spells, breath, traps, poisons, and deceptions. Each names its kind of threat, and its own text says what a Critical Hit, Hit, and Graze do wherever that differs from the defaults in The Result, below.")}
    <h3>2. The Defense</h3>
    ${P("Your four Defenses are Constellations like any other. You begin play Trained in two of them, your choice, and the other two are Untrained until you spend Defense Talent Points on them; an Untrained Defense still adds its Attribute, it simply has no Proficiency Bonus. Every threat is one of four kinds, and every kind is answered by two of the four Defenses. When a rule names a single Defense, roll that one; when it names a kind of threat, or names nothing, the defender chooses either of the two.")}
    ${threatTbl()}
    ${P("<b>When a Defense is unavailable.</b> Evade is unavailable while you are Grabbed or Restrained. Guard is unavailable while you are unaware of the attack, or while you have nothing equipped to ward away the blow, and it answers a ranged Blow only with a shield Raised. Endure and Awareness are never unavailable. The GM may determine that others apply.")}
    <h4>Answering an Attack</h4>
    ${P("You may always roll one of the two Defenses that answer the threat, regardless of how many actions you have remaining. That roll is your <b>basic defense</b>: ordinary footwork, guard position, constitution, alertness. For the potential to do better, you use a <b>Reaction ↺</b>: a Maneuver performed the moment the attack is declared, paid for from the same pool of six actions you attack with. Each Reaction below is granted by a Talent; without the Talent, the basic roll is all you have.")}
    ${tbl(["Reaction ↺","Cost","Effect"],[
      ["<b>Parry ❶↺</b>","1 action","(Guard Training) You Guard with a +2 Situation bonus. You need a rigid weapon, a shield, or a permitted natural weapon in hand. If you Stop a Deliberate or Committed Strike, you take Control of the attacking weapon rather than a neutral Bind, and you may at once make a Quick Strike ⓿ against its owner: the riposte. A Stopped Quick Strike gives only a neutral Bind."],
      ["<b>Void ❶↺</b>","1 action","(Evade Training) You Evade with a +2 Situation bonus. If the attack is Stopped, you may Step in any direction."],
      ["<b>Counter ❶↺</b>","1 action","(Melee Training) Answer a melee Blow from a foe within your Reach with a Quick Strike of your own. No bonus to your Defense. Roll both; resolve both. Both can land."],
      ["<b>Intercept ❶↺</b>","1 action","(Melee Training) When a foe Moves from outside your Total Reach to inside it, or Strikes you with an Unwieldy weapon from inside its Unwieldy distance, make a Quick Strike at the moment they enter. Once per foe per Move. A Wound stops their movement; anything less and it continues."],
      ["<b>Posture ⓿↺</b>","A Zone","(Gained from specific Talents) A Situation bonus to the named Defense. Always results in a Zone of your choice becoming Exposed until the end of the round; Recenter does not clear it."]])}
    ${P("Reactions are paid from the same six actions you attack with. A fighter who spends five actions attacking has one left to defend with; a fighter who holds three has answers. You may React before your first Opportunity of the round, and as often in a round as you can afford. At 0 actions you still roll your basic Defense, and you may still take a Posture. <b>A Reaction never triggers another Reaction</b>: you cannot Counter a Counter or an Intercept, and a fighter who is Countered rolls only their basic Defense against it.")}
    ${P("<b>Postures.</b> A Posture is a Reaction ⓿↺ gained from Talents, typically from the Evade and Guard Constellations. Postures may only be used before you know whether the attack was successful. A Posture costs no actions, but it Exposes a Zone until the end of the round, whether or not the Posture works, and Recenter does not clear that Exposure. Its bonus is a Situation bonus, the same type Parry and Void grant, so a Posture and a Parry or Void do not stack.")}
    <h3>3. The Result</h3>
    ${P("The player rolls, so the same margin is read from whichever side of the exchange the player is on. The table gives both readings and one Result.")}
    ${tbl(["Attacker's roll vs the Defense Threshold","Defender's roll vs the Attack Threshold","Result"],[
      ["Beat it by 10+","Miss it by 10+","<b>Critical Hit.</b> Double damage, or the effect's critical result, plus critical effects. For a Blow, the attacker chooses the Zone."],
      ["Meet or beat it","Miss it by less than 10","<b>Hit.</b> Full damage or effect. A Blow lands on the Torso, or on an Exposed Zone the attacker chooses."],
      ["Miss it by less than 10","Meet or beat it","<b>Graze.</b> Stopped, but it skates: one die, or one round. A Blow deals one weapon die to a Zone the defender chooses; a Blast deals one of its dice; a Blight or Beguilement takes hold only until the end of the round. Position changes in the defender's favor."],
      ["Miss it by 10+","Beat it by 10+","<b>Miss.</b> Stopped. Nothing lands. For a Blow, the attacker is Exposed in a Zone of the defender's choice."],
      ["Natural 20 / natural 1","Natural 1 / natural 20","Step the result one degree up / down."]])}
    <h4>Reading the Result for a Blow</h4>
    ${tbl(["Result","What happens"],[
      ["<b>Critical Hit</b>","The attacker chooses the Zone. Roll all dice and add all damage modifiers, then double it. Apply the Zone's critical effect (see Position), then any critical effect of the weapon or Talent. A Critical Hit on an Exposed Zone with a Deliberate or Committed Strike Wounds it."],
      ["<b>Hit</b>","Full damage to the Torso, or to an Exposed Zone of the attacker's choice if the Strike was Deliberate or Committed. Roll and add all damage modifiers."],
      ["<b>Graze</b>","The defender chooses the Zone the blow skated across, and takes one weapon die of damage, less that Zone's Protection. Position changes in the defender's favor: if they Guarded with a rigid weapon or shield, the two weapons are now in a neutral Bind (Control, if they Parried a Deliberate or Committed Strike; a Quick Strike can only be bound). If they Evaded, they give 3 feet of ground directly away from the attacker (a Step of their own choosing, if they Voided). If the Strike was Committed ❸, the attacker is Exposed in a Zone of the defender's choice."],
      ["<b>Miss</b>","Nothing lands. The attacker is Exposed in a Zone of the defender's choice, whatever the Strike was. If the defender Guarded with a rigid weapon or shield, they take Control of the attacking weapon. If the defender Evaded, they may Step. A Miss may also trigger Reactions from certain Talents."]])}
    <h3>4. Damage and Effects</h3>
    <div class="callout"><b>Damage = [Dice + Modifiers] − Protection.</b> Protection applies to any damage that lands on a Zone; Resistance, Weakness, and Immunity apply to everything.<br>
      <b>Deliberate or Committed Hit = [Weapon Dice + Specialization + Might + Bonuses &amp; Penalties] − Protection</b><br>
      <b>Quick Strike Hit = One Weapon Die + Precision − Protection</b><br>
      <b>Graze = One Weapon Die − Protection (minimum 1)</b></div>
    ${P("A Deliberate or Committed Strike deals its weapon dice (more of them as you gain levels: two at 4th, three at 8th, four at 12th, five at 16th), plus weapon specialization, plus your Might, plus any bonuses or penalties. A Quick Strike is a probe: on a Hit it deals one weapon die plus any precision damage, and nothing else. A Graze deals one weapon die and nothing else: no specialization, no level dice, no precision, no talent damage. Protection is subtracted from each, though against a Graze it cannot reduce the damage below 1.")}
    ${P("<b>Precision damage</b> is extra damage that comes from where you put the blow rather than how hard you swing it. It is added to a Hit and to a Critical Hit, and doubled along with everything else on a Critical Hit. It is never added to a Graze. It is part of the same instance of damage as the Strike that carried it, so the Zone's Protection is subtracted once from the total, not once from each part. Some creatures with strange anatomy may be resistant or immune to it.")}
    ${P("<b>Persistent damage</b> is damage that is still happening: a wound that will not close, a fire that will not go out, a venom already in the blood. It is always written as a type and an amount, such as 1d4 persistent bleed. You take it at the end of each round, rolling its dice fresh each time. Protection does not apply: armor turns a blow aside; it does nothing about a blow that already landed. Immediately after you take it, roll an Endure check against <b>10 + the amount you just took</b>; on a success it ends. An adjacent ally may spend ❶ to help (smothering the flames, packing the wound), for a +2 Situation bonus to that Endure check. Two instances of the same type do not stack; keep the higher. Different types run separately. It keeps working while you are unconscious and while you are Dying.")}
    <h4>Protection</h4>
    ${P("Protection is armor, and armor decides how much of a blow your body actually feels. It never makes you harder to hit. Each Zone has its own Protection, and that number subtracts from every instance of damage that lands on that Zone, a Graze included. <b>Protection alone can never reduce damage below 1.</b> Something always gets through. Resistance and Immunity can take it to 0; armor cannot.")}
    ${tbl(["Step","Finding a Zone's Protection"],(R.protectionSteps||[]))}
    ${P("<b>Resistance N</b> reduces each instance of damage of the named type by N, and unlike Protection can take it all the way to 0. <b>Weakness N</b> increases each instance of damage of the named type by N; a single point is enough, so one point of fire against weakness 5 (fire) deals 6. <b>Immunity</b> means that kind of damage or effect does nothing whatsoever; it is checked before Weakness and Resistance, and it overrides the rule that at least 1 damage always gets through.")}
    <h4>The order of operations</h4>
    ${tbl(["Step","The order of operations for damage"],(R.damageOrder||[]))}
    ${P("Work top to bottom, after rolling your damage dice but before adding them up. Weakness is added <i>before</i> Resistance is subtracted, so a creature with both weakness 5 (fire) and resistance 5 (fire) simply takes normal fire damage. A weapon's <b>Deadly</b> die lands at the same seam: it is a critical effect of the weapon, so it is added after the doubling in step 5 and before Protection is subtracted in step 6.")}
    <h3>5. Position</h3>
    ${P("Every Blow leaves the fighters somewhere. Three things track it: which Zones are Exposed, whether two weapons are in a Bind, and who Controls it.")}
    <h4>Zones</h4>
    ${P("There are four Zones: Arms, Legs, Torso, and Head. Each can carry its own armor for Protection. Hits go to the Torso unless a Zone is Exposed or the Hit is Critical. When a Zone is Critically Hit, the target suffers an effect depending on the Zone:")}
    ${tbl(["Zone","Critical Hit","Critical Hit on an Exposed Zone"],(R.zones||[]))}
    <div class="callout"><b>Exposed [Zone].</b> A part of you is open for a focused attack. Its Protection counts as 0 against a Deliberate or Committed Strike; a Quick Strike gains nothing from it. An ordinary Hit from a Deliberate or Committed Strike may be placed there instead of the Torso. A Critical Hit on it with a Deliberate or Committed Strike Wounds it. It stays Exposed until you <b>Recenter ❶</b>, except that a Zone Exposed by a Posture stays Exposed until the end of the round, and Recenter does not clear it. Zones become Exposed when your own Committed Strike is Stopped; when any Strike of yours Misses; when you take a Posture; when a foe Controls your weapon in a Bind; and through certain Talents and critical effects.</div>
    ${P("Maneuvers create openings too: if the target's Legs are already Exposed, Trip increases its degree of success by one, and Disarm does the same against Exposed Arms.")}
    <h4>The Bind</h4>
    ${P("When a rigid weapon or shield stops a melee weapon or natural attack, the two are in contact: a <b>Bind</b>. Track one relationship per implement, and name the two implements: longsword and spear, or shield over bite. A Bind is <b>neutral</b> when neither fighter has the line, or <b>Controlled</b> when one does. Only Guard can form a Bind, and only with a rigid weapon, a shield, or a natural weapon its profile allows. A bare hand or a Flexible weapon can Guard, but cannot Bind.")}
    ${P("A Bind forms when a Guard Stops an attack, or when a Gain Control action Grazes. Control is taken when a Parry Stops a Deliberate or Committed Strike, when a Guard answers a Miss, or when Gain Control succeeds. A Quick Strike is a probe: Stopped, it can be bound but never Controlled.")}
    ${tbl(["Gain Control ❶ (Attack)","Roll Melee against the target's Guard. Evade cannot answer a bind; slipping it is what Step is for."],[
      ["Requirements","A rigid weapon, shield, or permitted natural weapon in hand; the target's weapon or natural attack is within the longer of your two Total Reaches; the target is no more than one Size larger than you."],
      ["Critical Success","You Control the weapon, and the target is Off-Guard until its next Opportunity."],
      ["Success","You Control the weapon."],
      ["Graze","A neutral Bind forms."],
      ["Miss","You pressed badly: the target Controls your weapon instead."]])}
    ${P("<b>While you Control a weapon:</b> your partner has an Exposed Zone of your choice, and it stays Exposed while the Bind lasts; your partner's attacks with the Controlled weapon take a −2 Situation penalty; and you may <b>Close ❶</b>, a Step toward your partner while keeping the Bind, which the Controlled weapon cannot Intercept. A Bind has one Controller at most; a new Control replaces the old.")}
    ${P("<b>A Bind ends</b> when a Strike between the two actors resolves, when either partner Moves or Steps (Close excepted), when either actor Recenters, when the Controlling actor is attacked by a third party, or when either implement is dropped or Disarmed. Controlled is not Grappled or Restrained: you are redirecting a weapon, not holding a body. The Controlled actor may still Step, Move, or attack with something else, and attacking with an uncontrolled weapon or limb ends the Bind before the roll. <b>Recenter ❶</b> clears every Exposed Zone on you (except one Exposed by a Posture) and ends any Bind you are in. Being Controlled costs you the same action that being Exposed does; that is the tempo price of a lost line, and the reason Gain Control is worth an action.")}
    ${P("<b>Size.</b> An actor one Size larger or smaller Binds normally. Two or more Sizes apart, the smaller actor gains only momentary Control: it lasts until its first benefit is used or until the end of the Controller's next Opportunity, whichever comes first, and the larger creature Moves without first breaking the Bind. You can redirect a dragon's claw, but you cannot hold it. <b>What cannot Bind:</b> Flexible weapons (whips and flails), bare hands without a Talent, areas, spells, and attacks with the Unparryable trait. Incorporeal and amorphous attackers offer nothing to bind. Measure, footwork, and commitment still apply to all of them.")}
    <h4>Allies in the Exchange</h4>
    ${P("<b>Support.</b> Each other conscious ally whose Total Reach includes your target grants you a +1 Situation bonus to melee attacks against it, to a maximum of +2. Bodies behind a blocked passage grant nothing; only a creature that could actually reach the target counts. Support is a Situation bonus, so it does not stack with Control. <b>Third parties.</b> A Bind is between two implements. Your ally striking the opponent you Control does not break your Bind; that is the point of holding the line. An enemy striking you does.")}
    <h3>Measure, and what armor costs in a fight</h3>
    ${P("<b>Measure</b> is the gap between you and your foe: the shortest gap between the edges of your spaces, rounded up to the next foot; adjacent is 0. <b>Out of Measure</b>: neither of you can reach the other; closing costs actions, and the one who closes typically takes the risk. <b>Long Measure</b>: only the longer weapon reaches; the spearman wants to stay here. <b>Close Measure</b>: both weapons reach, and inside a weapon's Unwieldy distance it is crowded: the weapon takes its penalty and the crowded foe may Intercept every Strike made with it; the dagger wants to be here. <b>Entering Measure is dangerous.</b> When you Move from outside a foe's Total Reach to inside it, that foe may Intercept you, striking at the moment you enter. A Step never provokes an Intercept. A Rush always does, and you are Off-Guard against it. Withdrawing out of a foe's Reach provokes nothing unless a Talent says otherwise; leaving is the safe direction.")}
    ${P("<b>Wind.</b> At the end of the third round of an encounter and every round after, a fighter with Load Strain 1 or more rolls Endure against <b>10 + Load Strain</b>. On a failure they are Fatigued (−1 Evade and Guard) until they catch their breath after the fight. <b>Sight and hearing.</b> A closed helm gives a −2 Situation penalty to Awareness checks, your Awareness Threshold, and Initiative; an open helm, −1. <b>Speed at the margin.</b> Your Rush and Leap distances are reduced by your Load Strain in feet.")}`;

  if(wikiSec==="Movement") h+=`
    <div class="callout"><b>Grid squares are 1 foot</b>, not the usual 5. That gives far more freedom for creatures of different sizes and weapons of different lengths. Diagonals are measured exactly: moving diagonally across a square costs about 1.4 feet, and a VTT measures it precisely.</div>
    ${P("<b>Speed</b> is how far you move with a single Move ❶, in feet. A round is about six seconds and holds six actions, so a Speed of 6 is a brisk walk for a fighter who spends every action moving and measured footwork for one who does not. <b>A Human's Speed is 6.</b> Speed is set by your Ancestry (and some Talents). A <b>Step ❶</b> is a move up to half your Speed and does not provoke an Intercept; a <b>Rush ❸</b> covers five times your Speed in a straight line, less your Load Strain in feet, for a fighter who wants ground more than safety: no Reactions until your next Opportunity, and Off-Guard against any Intercept made during it.")}
    ${tbl(["Motion Maneuver","Distance"],[
      ["Move ❶","up to your Speed; crossing into a foe's Total Reach may provoke an Intercept"],
      ["Step ❶","up to half your Speed; never provokes; not into difficult terrain; ends any Bind (Close excepted)"],
      ["Rush ❸","5 × Speed in a straight line, less Load Strain in feet"],
      ["Leap ❶","10 feet horizontally (less Load Strain in feet) or 3 feet vertically, without a check; longer or higher is an Athletics check"],
      ["Crawl ❶","3 feet, while prone"],
      ["Climb ❶ / Swim ❶","an Athletics check: half your Speed on a success, your full Speed on a critical success; a critical failure falls or sinks"]])}
    <h3>Size, space, and reach</h3>
    ${tbl(["Size","Space / token","Natural Reach","Effect on Evade & Guard"],(R.sizes||[]))}
    ${P("<b>Adjacent</b> means your space and theirs are touching, with no gap at all: 0 feet between them. Touching at a corner counts. <b>Total Reach = your Natural Reach + your weapon's Reach</b>, measured from the edge of your space to the edge of your target's. A weapon does not change Size when a differently-sized creature picks it up: a Large ogre wielding a Medium dagger is wielding a Medium dagger, though the ogre's greater Natural Reach still increases its Total Reach.")}
    <h3>Measure</h3>
    ${P("Measure is the gap between you and your foe. Measure the shortest gap between the edges of your spaces, rounding up to the next foot; adjacent is 0.")}
    ${tbl(["Measure","What it means"],[
      ["Out of Measure","Neither of you can reach the other. Closing costs actions; the one who closes typically takes the risk."],
      ["Long Measure","Only the longer weapon reaches. The spearman wants to stay here."],
      ["Close Measure","Both weapons reach. Inside a weapon's Unwieldy distance it is crowded: the weapon takes its penalty and the crowded foe may Intercept every Strike made with it; the dagger wants to be here."]])}
    ${P("<b>Entering Measure is dangerous.</b> When you Move from outside a foe's Total Reach to inside it, that foe may Intercept you, striking at the moment you enter. A Step never provokes an Intercept. A Rush always does, and you are Off-Guard against it. Withdrawing out of a foe's Reach provokes nothing unless a Talent says otherwise; leaving is the safe direction.")}
    <h3>Terrain</h3>
    ${tbl(["Terrain","Cost"],[
      ["Difficult Terrain","Moving into a square costs 2 feet instead of 1."],
      ["Greater Difficult Terrain","Moving into a square costs 3 feet instead of 1."],
      ["Hazardous Terrain","Its effect applies for every five feet you move, minimum 1."]])}
    ${P("You normally cannot Step into Difficult or Greater Difficult Terrain, though some Talents allow it. Narrow, slippery, uneven, or inclined surfaces may call for Acrobatics or other checks at the GM's discretion.")}
    <h3>Travel</h3>
    ${P("In Exploration Mode you move at your Travel Speed: <b>Speed × 40 feet per minute</b>, <b>Speed ÷ 2 miles per hour</b>, or <b>Speed × 4 miles per day</b>. Exploration Mode Activities halve it, except Hustle, which doubles it; Difficult Terrain halves it; Greater Difficult Terrain cuts it to one-third.")}`;

  if(wikiSec==="Awareness & Cover") h+=`
    <div class="callout"><b>Awareness works two ways, as every Defense does.</b> Your Awareness <i>check</i> is what you roll to find something. Your Awareness <i>Threshold</i> is the number someone else has to beat to Sneak, Hide, Feint, or Lie to you.</div>
    <h3>What your foe knows about you</h3>
    ${tbl(["Your state","What your foe knows","Effect","Examples"],(R.detection||[]))}
    ${P("<b>Staying hidden.</b> You remain Hidden or Undetected only while you have Concealment or at least Lesser Cover. While you are moving, only where you <i>finish</i> matters: crossing open ground mid-move does not reveal you, and that is the risk the Stealth check represents. But if you end your movement with neither, you are Observed however well you rolled.")}
    ${P("Sight is the only sense that finds anything precisely. Hearing, smell, and a hand on the floor can tell you roughly where something is, which is enough to make it Hidden and never enough to make it plainly seen. In darkness, Seek is a matter of listening, so it can bring a creature to Hidden and no further.")}
    <h3>Light</h3>
    ${tbl(["If a creature is in…","Effect on you"],(R.light||[]))}
    <h3>Cover</h3>
    ${P("Cover is something solid between you and your foe. Draw a line from the centre of your space to the centre of theirs; if nothing solid is in the way, they have no cover. Otherwise determine which Zones the obstacle is in front of from the attacker's side, and count them.")}
    ${tbl(["Zones covered","Grade","Effect"],(R.cover||[]))}
    ${P("<b>Apply the Zone rule.</b> An attacker cannot place a blow on a covered Zone. If a Hit would land on one, it lands on your Arms instead, or your Head if the Arms are covered too. A Critical Hit ignores this and chooses freely, because finding the gap is what a critical hit is.")}
    ${P("Cover is judged per attacker, every time. The same wall can give you Greater Cover against the archer in front of you and nothing at all against the one who walked around your flank. Nothing about cover is a property of you; it is a property of the line between you and your foe. <b>Total cover works both ways</b>: if nothing can reach you, you cannot see out either. And <b>a creature never gives more than Lesser Cover</b>, whatever it happens to be standing in front of. Bodies are not walls.")}
    <h3>Concealment</h3>
    ${P("Where cover is having something solid in the way, Concealment is not being clearly seen: a +2 Situation bonus to your Defense while your enemy still knows exactly where you are. Dim light, fog, smoke, heavy rain, and thick snow all conceal. None of them hide you, which is why Hide ❶ and Sneak ❶ exist: they are how you turn concealment into being genuinely unfound, and both are Stealth against the Awareness of whoever might spot you.")}`;

  if(wikiSec==="Going Down") h+=`
    <div class="callout"><b>Vigor is not meat.</b> It is what you have left in you: wind, focus, the strength to keep your guard where it belongs, and the sort of luck that turns a killing blow into a shallow one. Losing Vigor is not collecting Wounds. It is running out of the things that keep Wounds from happening. Wounds are the meat, and they are tracked separately, by Zone. This is why a character at 3 Vigor is not carved apart: they are winded, sloppy, and one bad moment from finished. It is also why Vigor comes back with a night's sleep, and why a tenth-level character has more of it without having thicker skin.</div>
    <h3>Your Vigor</h3>
    ${P("At 1st level: <b>10 + your Ancestry's Vigor + your Calling's Vigor</b>. At every level thereafter, add your Ancestry's Vigor + your Calling's Vigor again. Only your first Calling counts toward Vigor, however many you open later. A full night's rest restores Vigor equal to your <b>level × your Presence</b> (if that is greater than one; otherwise Vigor equal to your level).")}
    <h3>Temporary Vigor</h3>
    ${P("A buffer laid over your Vigor. Damage comes out of it first, and only what is left over reaches your real Vigor. It is not healing: anything that restores Vigor restores your own, never these. You can only have one pool at a time; if an effect would give you a second, keep whichever pool is larger and discard the other. It lasts until it is spent or until the effect that granted it ends, whichever comes first. Losing your last point of Temporary Vigor is <i>not</i> the same as being reduced to 0 Vigor: it does not make you Spent. Protection applies first, because Protection reduces the damage itself.")}
    <h3>Reaching 0 Vigor: Spent</h3>
    ${P("When damage reduces you to 0 Vigor, you are <b>Spent</b>. You are still on your feet and still fighting, but there is nothing left between the blows and your body. Damage beyond what it took to empty your Vigor is simply lost; you cannot go below 0. While you are Spent, <b>every Hit that lands on you inflicts a Wound</b> on the Zone it struck, and a Critical Hit inflicts two. A Graze does not inflict a Wound. Nonlethal damage that would Wound a Spent creature knocks it unconscious instead; it wakes in ten minutes, or sooner if someone rouses it, with 1 Vigor.")}
    <h3>Wounds</h3>
    ${P("A Wound is a real injury, and is applied to a Zone. You take a Wound on two triggers: <b>a Critical Hit with a Deliberate or Committed Strike lands on an Exposed Zone</b> (the attacker found the gap and drove through it; a Quick Strike is a probe and cannot Wound this way; an attack with the Massive trait Wounds on any Critical Hit), or <b>any Hit lands while you are Spent</b> (a Critical Hit while Spent inflicts two). The Wound goes to the Zone struck, and that Zone carries the condition Wounded [Zone]. Its effect is the Zone's critical effect made lasting: it does not clear when you Recenter, only when the Wound is treated.")}
    ${tbl(["Zone","First Wound","Final Wound"],["Arms","Legs","Torso","Head"].map(z=>[`<b>${z}</b>`,WOUNDFX[z][0],WOUNDFX[z][1]]))}
    ${P("<b>Wound capacity.</b> A Medium or smaller creature's Zone carries two Wounds: the first has the first-Wound effect, the second the final effect. Larger creatures carry more before the final effect: Large 3, Huge 4, Gargantuan 5. Each Wound between the first and the last repeats the first-Wound effect (a second Torso Wound on a Large creature adds another 1d4 of persistent bleed; a second Legs Wound halves what Speed it had left). Creature templates such as Elite or Boss may add capacity. A further Wound to a useless Arm or Leg goes to the Torso instead.")}
    ${P("<b>Treating Wounds.</b> Vigor comes back with sleep; Wounds do not. An ally may spend ten minutes treating one of your Wounds and roll Endure against a Threshold of <b>10 + the number of Wounds you carry</b>. On a success the Wound is bound: its effect ends, but it still counts as a Wound for Recovery checks and for treating the others until it heals. A Wound heals after one week of Downtime rest, or through effects that specifically heal Wounds. Restoring Vigor never heals a Wound.")}
    <h3>Dying</h3>
    ${P("Dying is a value, and it counts up toward the end. You begin Dying when your <b>Torso or Head takes its final Wound</b> (the second, for a Medium or smaller creature): at <b>Dying 1</b>, or <b>Dying 2</b> if the blow that dropped you was a Critical Hit. While Dying you are unconscious and helpless: you cannot act, and attacks against you succeed without a roll. Taking damage while Dying increases your Dying value by 1, or by 2 from a Critical Hit. <b>At Dying 5, you die.</b>")}
    <h4>Recovery checks</h4>
    ${P("At the start of each round while Dying, make a Recovery check: an Endure check against a Threshold of <b>10 + your Dying value + the number of Wounds you carry</b>. It costs no action.")}
    ${tbl(["Result","Effect"],(R.recovery||[]))}
    ${P("<b>Helping.</b> An adjacent ally may spend ❶ to press a wound, straighten your neck, or shout your soul back into your body: you gain a +2 Situation bonus to your next Recovery check. <b>Healing.</b> Any effect that restores even 1 Vigor to a Dying character ends their Dying at once. They are conscious, with that Vigor. Their Wounds remain.")}
    <h3>Refusing death</h3>
    <div class="callout" style="border-color:#B8860B">${P("When you would die, you may spend <b>all</b> of your Hero Points (if you have any) to refuse it. This is not a roll. It cannot fail, and nothing in the game can stop it. Your Dying value drops to 0. You are unconscious and stable at 0 Vigor. Your Wounds remain. You have no Hero Points until the GM awards more, or until the next session.")}${P("It is the only thing in Starwrought that simply happens. Spend it and describe how: the blow that should have finished you turned on a buckle, the arrow found the strap and not the throat, you got your chin down at the last possible instant. You have bought one more scene, and paid everything you had for it.")}</div>`;
