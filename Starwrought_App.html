    ${P("<b>Strike Attribute and proficiency.</b> A melee Strike uses Might, or Agility if the weapon has the Finesse trait; a ranged Strike uses Agility, or Might if the weapon has the Thrown trait. Use Melee proficiency for melee Strikes and Ranged proficiency for ranged Strikes, thrown weapons included. A Strike made as part of another Maneuver still uses the appropriate proficiency; if that Maneuver's Key Attribute has a higher bonus than the Strike's normal Attribute, you may use it instead, provided you meet all of the Maneuver's Requirements. A character Trained in Melee (+3) with Agility +3 Strikes with a rapier at +6; a Maneuver that lets the Strike use a +4 Presence makes it +7.")}
    <h4>Strikes</h4>
    ${P("An Attack made with a weapon, natural weapon, or unarmed blow is a Strike. A Strike is always a Blow, but not every Blow is a Strike: a Grapple, a Shove, a falling rock, and a conjured fist are Blows too. Strike names the Maneuver you take; Blow names the kind of threat the defender answers. The basic Strike Maneuver has three forms, and the count is a statement about how much of yourself you are putting behind it.")}
    ${tbl(["Strike","Body behind it","If it is Stopped"],[
      ["<b>Quick ❶</b>","None. It is a probe: one weapon die whatever your rank, with precision or other extras only where a Maneuver or Talent allows them, and no Might. It cannot Critically Hit (a natural 20 is a Hit) unless the weapon is Agile, Protection applies to it in full even on an Exposed Zone, and it lands on the Torso.","Nothing. You recover your line at once. A Guard can bind a probe, but not Control it."],
      ["<b>Deliberate ❷</b>","Full. The rank's weapon dice and your Might. It can Critically Hit, it may be placed on an Exposed Zone, and on a Critical Hit you Expose a plausible Zone.","A Graze costs you nothing but the tempo. On a Miss, you are Exposed in a Zone of the defender's choice. A Parry that Stops it may take Control."],
      ["<b>Committed ❸</b>","Everything. Prepared: resolves at your next Opportunity. The rank's weapon dice and your Might. On any Hit, Expose a plausible Zone.","You are Exposed in a Zone of the defender's choice, Graze or Miss. A Parry that Stops it may take Control."]])}
    ${P("Only a Committed Strike has the <b>Weighted</b> trait: a Graze against it Exposes you. A Miss Exposes you regardless of commitment; you Missed outright, and everyone saw where your weapon ended up. A Parry can take Control of any Deliberate or Committed blade it Stops, because a committed blade is there to be bound. A Quick Strike is a probe: Stopped, it forms at most a neutral Bind. <b>Agile</b> weapons are light enough to bite on the way in: a Quick Strike with one may Critically Hit.")}
    ${P("<b>Other Attacks.</b> Athletics attacks (Grapple, Shove, Trip, Disarm, and Reposition) are Blows answered by Evade or Guard. They read the Result the same way; what a Hit or Graze does is written in each attack's own entry under Maneuvers. Blasts, Blights, and Beguilements come from spells, breath, traps, poisons, and deceptions. Each names its kind of threat, and its own text says what a Critical Hit, Hit, and Graze do wherever that differs from the defaults in The Result, below.")}
    <h4>Threat and Delivery</h4>
    ${P("Every Attack has a <b>Threat</b>, which says which two Defenses may answer it, and a damaging Attack has a <b>Delivery</b>, which says how its harm arrives. A <b>Zoned</b> Attack lands on one Zone: a struck Zone's Protection comes off its damage once, and an Exposed Zone can be chosen for it. A <b>Pervasive</b> Attack engulfs you: it ignores ordinary Protection and no Zone is struck. An Attack with no damage has no Delivery.")}
    ${tbl(["Example","Threat and Delivery"],(R.damageDelivery||[]))}
    <h3>2. The Defense</h3>
    ${P("Your four Defenses are Constellations like any other. You begin play Trained in two of them, your choice, and the other two are Untrained until you spend Defense Talent Points on them; an Untrained Defense still adds its Attribute, it simply has no Proficiency Bonus. Every threat is one of four kinds, and every kind is answered by two of the four Defenses. When a rule names a single Defense, roll that one; when it names a kind of threat, or names nothing, the defender chooses either of the two. Guard meets a ranged Blow or an Attack with an area only with a shield Raised.")}
    ${threatTbl()}
    <h4>Answering an Attack: Reactions and Postures</h4>
    ${P("Rolling a basic Defense costs no actions, even when your pool is empty. That roll is your <b>basic defense</b>: ordinary footwork, guard position, constitution, alertness. For the potential to do better, you use a <b>Reaction ↺</b> whose Trigger and Requirements are satisfied: a Maneuver performed the moment its Trigger occurs, paid for from the same pool of six actions you use for everything else, and usable as often in a round as you can afford. Every Reaction is granted by a Talent; without it, the basic roll is all you have. A fighter who spends five actions attacking has one left to defend with; a fighter who holds three has answers. <b>A Reaction never triggers another Reaction</b>, and when an Attack is made as part of a Reaction, its defender uses only their basic Defense.")}
    ${tbl(["Reaction ↺","Granted by • Defense","Effect"],(R.postures||[]).map(r=>[`<b>${r[0]}</b>`,r[1],r[2]]))}
    ${P("<b>Postures.</b> A Posture is a ⓿↺ Reaction granted by a Talent, commonly from Evade or Guard. It costs no actions but carries the drawback its description names, whether or not it improves the outcome: usually a Zone of your choice Exposed until the end of the round, which Recenter does not clear. At 0 actions you still roll your basic Defense and may still use a ⓿↺ Reaction you qualify for. You answer an attack with one Reaction, and a Posture is one.")}
    <h3>3. The Result</h3>
    ${P("The player rolls, so the same margin is read from whichever side of the exchange the player is on. The table gives both readings and one Result. An Attack that Grazes or Misses is <b>Stopped</b>; a Stopped Attack can still deal Graze damage or cause other effects. For a Flare, use the player's final degree of success and the training their check demonstrated.")}
    ${tbl(["Attacker's roll vs the Defense Threshold","Defender's roll vs the Attack Threshold","Result"],[
      ["Beat it by 10+","Miss it by 10+","<b>Critical Hit.</b> Double damage, or the effect's critical result, plus critical effects. For a Blow, the attacker chooses the Zone that is struck."],
      ["Meet or beat it","Miss it by less than 10","<b>Hit.</b> Full damage or effect. For a Blow, it lands on the Torso, or on an Exposed Zone the attacker chooses."],
      ["Miss it by less than 10","Meet or beat it","<b>Graze.</b> Stopped, but partial damage: apply the reduced damage or lesser effects the Attack specifies, and some Attacks have no effect on a Graze. A Strike deals one weapon die to a Zone the defender chooses; a Focused Cast deals one of its dice, a Quick Cast normally nothing. Position changes in the defender's favor (see 5. Position)."],
      ["Miss it by 10+","Beat it by 10+","<b>Miss.</b> Stopped, no damage. For a Blow, the attacker is Exposed in a Zone of the defender's choice."],
      ["Natural 20 / Natural 1","Natural 1 / Natural 20","Step the result one degree up / down."]])}
    <h4>Reading the Result for a Blow</h4>
    ${tbl(["Result","What happens"],[
      ["<b>Critical Hit</b>","The attacker chooses the Zone. Roll all dice and add all damage modifiers, subtract the Zone's Protection, then double what is left. Apply the Zone's critical effect (see Position), then any critical effect of the weapon or Talent. A Critical Hit with a Deliberate or Committed Strike on a Zone that was already Exposed Wounds it."],
      ["<b>Hit</b>","Full damage to the Torso, or to an Exposed Zone of the attacker's choice if the Strike was Deliberate or Committed. Roll and add all damage modifiers."],
      ["<b>Graze</b>","The defender chooses the Zone the blow skated across, and takes one weapon die of damage, less that Zone's Protection. Position changes in the defender's favor: if they Guarded with a rigid weapon or shield, the two weapons are now in a neutral Bind (a Parry that Stopped a Deliberate or Committed Strike may at once attempt Gain Control; a Quick Strike can only be bound). If they Evaded, they give 3 feet of ground directly away from the attacker (a Step of their own choosing, if they Sidestepped). If the Strike was Committed ❸, the attacker is Exposed in a Zone of the defender's choice."],
      ["<b>Miss</b>","Stopped, no damage. The attacker is Exposed in a Zone of the defender's choice, whatever the Strike was. If the defender Guarded with a rigid weapon or shield, they take Control of the attacking weapon. If the defender Evaded, they may Step. A Miss may also trigger Reactions from certain Talents."]])}
    <h3>4. Damage and Effects</h3>
    <div class="callout"><b>Damage = [Dice + Modifiers] − Protection, once, for a Zoned Attack.</b> Immunity, Resistance, and Weakness apply to everything; Protection to what lands on a Zone.<br>
      <b>Deliberate or Committed Hit = [the rank's Weapon Dice + Might + Bonuses &amp; Penalties] − Protection</b><br>
      <b>Quick Strike Hit = One Weapon Die (+ Precision where allowed) − Protection</b><br>
      <b>Graze = the damage the Maneuver prints (one Weapon Die for a Strike) − Protection</b><br>
      <b>Spellwork = the discipline's Damage Dice of the spell's die and type; no Might</b></div>
    ${P("<b>Weapon dice follow your rank.</b> On a Hit with a Deliberate or Committed Strike, roll one weapon die at Trained, two at Expert, three at Master, and four at Legendary, by your Melee or Ranged rank, then add Might when applicable and any additional effects the Attack or your Talents expressly grant; the rank progression already includes the extra dice, so there is no weapon specialization bonus on top. A Quick Strike rolls one weapon die regardless of rank. On a Graze, use the damage the Maneuver prints: a Deliberate or Committed Strike normally rolls one weapon die rather than its full dice, with precision or other effects only where a Maneuver or Talent allows them; then apply Protection normally. <b>Spellwork</b> takes its Damage Dice from the spell's discipline alone (Trained 1, Expert 2, Master 3, Legendary 4), of the die and type the spell names; a Quick Cast rolls one. Every offensive spell is at will once learned. An Area Attack does not automatically double its damage on a Critical Hit; its own text says what a Critical Hit and a Graze do.")}
    ${P("<b>Precision damage</b> comes from placing an attack accurately rather than swinging it hard. Add it only when its requirements are satisfied, and only where the Maneuver or a Talent allows it; it is part of the same instance of damage as the Strike that carried it, so the Zone's Protection is subtracted once from the total and it is doubled with the rest on a Critical Hit. Creatures with unusual anatomy may have Resistance or Immunity to it.")}
    ${P("<b>Persistent damage</b> is damage that is still happening: a wound that will not close, a fire that will not go out, a venom already in the blood. It is always written as a type and an amount, such as 1d4 persistent bleed. You take it at the end of each round, rolling its dice fresh each time. Protection does not apply: armor turns a blow aside; it does nothing about a blow that already landed. Immediately after you take it, roll an Endure check against <b>10 + the amount you just took</b>; on a success it ends. An adjacent ally may spend ❶ to help (smothering the flames, packing the wound), for a +2 Situation bonus to that Endure check. Two instances of the same type do not stack; keep the higher. Different types run separately. It keeps working while you are unconscious and while you are Dying, and it is not a Hit: it Wounds no one, Spent or not.")}
    <h4>Protection</h4>
    ${P("Protection is armor, and armor decides how much of a blow your body actually feels. It never makes you harder to hit and never changes the Result. Each Zone has its own Protection, and that number subtracts once from a Zoned Attack's damage on that Zone, a Graze included. <b>Protection alone can never reduce positive damage below 1.</b> Something always gets through. Resistance and Immunity can take it to 0; armor cannot. A Pervasive Attack and Persistent Damage ignore it.")}
    ${tbl(["Rule","Protection"],(R.protectionSteps||[]))}
    ${P("<b>Resistance N</b> reduces each instance of damage of the named type by N, once per damage type per instance, and unlike Protection can take it all the way to 0. <b>Weakness N</b> increases each instance of damage of the named type by N, provided that type still deals damage after Resistance; independent sources of Weakness add up. <b>Immunity</b> means that kind of damage or effect does nothing whatsoever; it is checked first, and it overrides the rule that at least 1 damage always gets through.")}
    <h4>The order of operations</h4>
    ${tbl(["Step","Damage resolution"],(R.damageOrder||[]))}
    ${P("Work top to bottom: check Immunity, total each damage type, subtract Resistance, add Weakness to what still deals damage, take a Zoned Attack's Protection off once, double on a Critical Hit that calls for it, then apply what is left to Vigor. Resistance comes <i>before</i> Weakness, so fire that Resistance has taken to 0 is not raised again by a Weakness to fire. A weapon's <b>Deadly</b> die is a critical effect of the weapon, so it is added after the doubling in step 6 and is not itself doubled. Protection is subtracted before the doubling, so a Critical Hit doubles what got through the armor, not the whole roll.")}
    <h3>5. Position</h3>
    ${P("Every Blow leaves the fighters somewhere. Three things track it: which Zones are Exposed, whether two weapons are in a Bind, and who Controls it.")}
    <h4>Zones</h4>
    ${P("There are four Zones: Arms, Legs, Torso, and Head. Each can carry its own armor for Protection. Hits go to the Torso unless a Zone is Exposed or the Hit is Critical. When a Zone is Critically Hit, the target suffers an effect depending on the Zone:")}
    ${tbl(["Zone","Critical Hit","Critical Hit on an Exposed Zone"],(R.zones||[]))}
    <div class="callout"><b>Exposed [Zone].</b> A part of you is open for a focused attack. Its Protection counts as 0 against a Deliberate or Committed Strike; a Quick Strike gains nothing from it. An ordinary Hit from a Deliberate or Committed Strike may be placed there instead of the Torso. A Critical Hit on it with a Deliberate or Committed Strike Wounds it. It stays Exposed until you <b>Recenter ❶</b>, except that a Zone Exposed by a Posture stays Exposed until the end of the round, and Recenter does not clear it. Zones become Exposed when your own Committed Strike is Stopped; when any Strike of yours Misses; when you take a Posture; when a foe Controls your weapon in a Bind; and through certain Talents and critical effects.</div>
    ${P("Maneuvers create openings too: if the target's Legs are already Exposed, Trip increases its degree of success by one, and Disarm does the same against Exposed Arms.")}
    <h4>The Bind</h4>
    ${P("When a rigid weapon or shield stops a melee weapon or natural attack, the two are in contact: a <b>Bind</b>. Track one relationship per implement, and name the two implements: longsword and spear, or shield over bite. A Bind is <b>neutral</b> when neither fighter has the line, or <b>Controlled</b> when one does. Only Guard can form a Bind, and only with a rigid weapon, a shield, or a natural weapon its profile allows. A bare hand or a Flexible weapon can Guard, but cannot Bind.")}
    ${P("A Bind forms when a rigid weapon or shield Guards against a melee Attack that Grazes or Misses, provided the implements involved can Bind, or when a Gain Control action Grazes. Control is taken when a Guard answers a Miss, or when Gain Control succeeds; a Parry that Stops a Deliberate or Committed Strike may attempt Gain Control at once, and with Riposte may make a Quick Strike instead. A Quick Strike is a probe: Stopped, it can be bound but never Controlled.")}
    ${tbl(["Gain Control ❶ (Attack)","Roll Melee against the target's Guard. Evade cannot answer a bind; slipping it is what Step is for."],[
      ["Requirements","A rigid weapon, shield, or permitted natural weapon in hand; the target's weapon or natural attack is within the longer of your two Total Reaches; the target is no more than one Size larger than you."],
      ["Critical Success","You Control the weapon, and the target is Off-Guard until its next Opportunity."],
      ["Success","You Control the weapon."],
      ["Graze","A neutral Bind forms."],
      ["Miss","You pressed badly: the target Controls your weapon instead."]])}
    ${P("<b>While you Control a weapon:</b> your partner has an Exposed Zone of your choice, and it stays Exposed while the Bind lasts; your partner's attacks with the Controlled weapon take a −2 Situation penalty; and you may <b>Close ❶</b>, a Step toward your partner while keeping the Bind, which the Controlled weapon cannot Intercept. A Bind has one Controller at most; a new Control replaces the old.")}
    ${P("<b>A Bind ends</b> when a Strike between the two actors resolves, when either partner Moves or Steps (Close excepted), when either actor Recenters, when the Controlling actor is attacked by a third party, or when either implement is dropped or Disarmed. Controlled is not Grappled or Restrained: you are redirecting a weapon, not holding a body. The Controlled actor may still Step, Move, or attack with something else, and attacking with an uncontrolled weapon or limb ends the Bind before the roll. <b>Recenter ❶</b> clears every Exposed Zone on you (except one Exposed by a Posture) and ends any Bind you are in. Being Controlled costs you the same action that being Exposed does; that is the tempo price of a lost line, and the reason Gain Control is worth an action.")}
    ${P("<b>Size.</b> An actor one Size larger or smaller Binds normally. Two or more Sizes apart, the smaller actor gains only momentary Control: it lasts until its first benefit is used or until the end of the Controller's next Opportunity, whichever comes first, and the larger creature Moves without first breaking the Bind. You can redirect a dragon's claw, but you cannot hold it. <b>What cannot Bind:</b> Flexible weapons (whips and flails), bare hands without a Talent, areas, spells, and attacks with the Unparryable trait. Incorporeal and amorphous attackers offer nothing to bind. Measure, footwork, and commitment still apply to all of them.")}
    <h4>Allies in the Exchange</h4>
    ${P("<b>Support.</b> Each conscious ally other than you whose Total Reach includes your target grants you a +1 Situation bonus to melee Attacks against it, to a maximum Support bonus of +4. Bodies behind a blocked passage grant nothing; only a creature that could actually reach the target counts. Each ally is an independent circumstance, so Support adds to the other bonuses on the roll. <b>Third parties.</b> A Bind is between two implements. Your ally striking the opponent you Control does not break your Bind; that is the point of holding the line. An enemy striking you does.")}
    <h3>Measure, and what armor costs in a fight</h3>
    ${P("<b>Measure</b> is the gap between you and your foe: the shortest gap between the edges of your spaces, rounded up to the next foot; adjacent is 0. <b>Out of Measure</b>: neither of you can reach the other; closing costs actions, and the one who closes typically takes the risk. <b>Long Measure</b>: only the longer weapon reaches; the spearman wants to stay here. <b>Close Measure</b>: both weapons reach, and inside a weapon's Unwieldy distance it is crowded: the weapon takes its penalty and the crowded foe may Intercept every Strike made with it; the dagger wants to be here. <b>Entering Measure is dangerous.</b> When you Move from outside a foe's Total Reach to inside it, that foe may Intercept you, striking at the moment you enter. A Step never provokes an Intercept. A Rush always does, and you are Off-Guard against it. Withdrawing out of a foe's Reach provokes nothing unless a Talent says otherwise; leaving is the safe direction.")}
    ${P("<b>Wind.</b> If your Load Strain is at least 1, then at the end of every round while in an encounter, you roll Endure against <b>10 + Load Strain</b>; on a failure your Fatigued rises by 1, on a critical failure by 2 (Fatigued N is a −N Condition penalty to your four Defenses and your attack rolls, to a maximum of 3; it ends after ten minutes of rest). There is no exemption: a high Endure Threshold makes the roll easy, never unnecessary. <b>Sight.</b> A Visored helm lowered is a −1 Gear penalty to Awareness and Initiative; raised, that Zone's Protection is 1 lower instead. <b>Speed at the margin.</b> Your Rush and Leap distances are reduced by your Load Strain in feet, and Stealth, Acrobatics, Climb, and Swim checks take it as a Condition penalty.")}`;

  if(wikiSec==="Movement") h+=`
    <div class="callout"><b>Grid squares are 1 foot</b>, not the usual 5. That gives far more freedom for creatures of different sizes and weapons of different lengths. Diagonals are measured exactly: moving diagonally across a square costs about 1.4 feet, and a VTT measures it precisely.</div>
    ${P("<b>Speed</b> is how far you move with a single Move ❶, in feet. A round is about six seconds and holds six actions, so a Speed of 6 is a brisk walk for a fighter who spends every action moving and measured footwork for one who does not. <b>A Human's Speed is 6.</b> Speed is set by your Ancestry (and adjusted by some Talents and other abilities). A <b>Step ❶</b> is a move up to half your Speed and does not provoke an Intercept; a <b>Rush ❷</b> covers three times your Speed in a straight line, less your Load Strain in feet, for a fighter who wants ground more than safety: you are Off-Guard until your next Opportunity, and a Rush always provokes an Intercept.")}
    ${tbl(["Motion Maneuver","Distance"],[
      ["Move ❶","up to your Speed; crossing into a foe's Total Reach may provoke an Intercept"],
      ["Step ❶","up to half your Speed; never provokes; not into difficult terrain; ends any Bind (Close excepted)"],
      ["Rush ❷","3 × Speed in a straight line, less Load Strain in feet; Off-Guard until your next Opportunity"],
      ["Leap ❶ to ❸","no check needed: ❶ Quick Jump, up to half your Speed; ❷ Standing Long Jump, up to your Speed; ❸ Running Long Jump, move at least half your Speed and leap up to 1.5 × your Speed in the same direction; each less your Load Strain in feet. Longer or higher is an Athletics check, counted as part of the Leap"],
      ["Crawl ❶","up to half your Speed, while prone"],
      ["Stand ❶","get up from prone"],
      ["Climb ❶ / Swim ❶","an Athletics check against a Threshold the GM sets: half your Speed on a success, your full Speed on a critical success; a critical failure falls or sinks"]])}
    <h3>Size, space, and reach</h3>
    ${tbl(["Size","Space / token","Natural Reach","Effect on Evade & Guard"],(R.sizes||[]))}
    ${P("<b>Adjacent</b> means your space and theirs are touching, with no gap at all: 0 feet between them. Touching at a corner counts. <b>Total Reach = your Natural Reach + your weapon's Reach</b>, measured from the edge of your space to the edge of your target's. A weapon does not change Size when a differently-sized creature picks it up: a Large ogre wielding a Medium dagger is wielding a Medium dagger, though the ogre's greater Natural Reach still increases its Total Reach.")}
    <h3>Measure</h3>
    ${P("Measure is the gap between you and your foe. Measure the shortest gap between the edges of your spaces, rounding up to the next foot; adjacent is 0.")}
    ${tbl(["Measure","What it means"],[
      ["Out of Measure","Neither of you can reach the other. Closing costs actions; the one who closes typically takes the risk."],
      ["Long Measure","Only the longer weapon reaches. The spearman wants to stay here."],
      ["Close Measure","Both weapons reach. Inside a weapon's Unwieldy distance it is crowded: the weapon takes its penalty and the crowded foe may Intercept every Strike made with it; the dagger wants to be here."]])}
    ${P("<b>Entering Measure is dangerous.</b> When you Move from outside a foe's Total Reach to inside it, that foe may Intercept you, striking at the moment you enter. A Step never provokes an Intercept. A Rush always does, and you are Off-Guard against it. Withdrawing out of a foe's Reach provokes nothing unless a Talent says otherwise; leaving is the safe direction.")}
    <h3>Terrain</h3>
    ${tbl(["Terrain","Cost"],[
      ["Difficult Terrain","Moving into a square costs 2 feet instead of 1."],
      ["Greater Difficult Terrain","Moving into a square costs 3 feet instead of 1."],
      ["Hazardous Terrain","Its effect applies for every five feet you move, minimum 1."]])}
    ${P("You normally cannot Step into Difficult or Greater Difficult Terrain, though some Talents allow it. Narrow, slippery, uneven, or inclined surfaces may call for Acrobatics or other checks at the GM's discretion.")}
    <h3>Travel</h3>
    ${P("In Exploration Mode you move at your Travel Speed: <b>Speed × 40 feet per minute</b>, <b>Speed ÷ 2 miles per hour</b>, or <b>Speed × 4 miles per day</b>. Exploration Mode Activities halve it, except Hustle, which doubles it; Difficult Terrain halves it; Greater Difficult Terrain cuts it to one-third.")}`;

  if(wikiSec==="Awareness & Cover") h+=`
    <div class="callout"><b>Awareness works two ways, as every Defense does.</b> Your Awareness <i>check</i> is what you roll to find something. Your Awareness <i>Threshold</i> is the number someone else has to beat to Sneak, Hide, Feint, or Lie to you.</div>
    <h3>What your foe knows about you</h3>
    ${tbl(["Your state","What your foe knows","Effect","Examples"],(R.detection||[]))}
    ${P("<b>Staying hidden.</b> You remain Hidden or Undetected only while you have Concealment or at least Lesser Cover. While you are moving, only where you <i>finish</i> matters: crossing open ground mid-move does not reveal you, and that is the risk the Stealth check represents. But if you end your movement with neither, you are Observed however well you rolled.")}
    ${P("Sight is the only sense that finds anything precisely. Hearing, smell, and a hand on the floor can tell you roughly where something is, which is enough to make it Hidden and never enough to make it plainly seen. In darkness, Seek is a matter of listening, so it can bring a creature to Hidden and no further.")}
    <h3>Light</h3>
    ${tbl(["If a creature is in…","Effect on you"],(R.light||[]))}
    <h3>Cover</h3>
    ${P("Cover is something solid between you and your foe. Draw a line from the centre of your space to the centre of theirs; if nothing solid is in the way, they have no cover. Otherwise determine which Zones the obstacle is in front of from the attacker's side, and count them.")}
    ${tbl(["Zones covered","Grade","Effect"],(R.cover||[]))}
    ${P("<b>Apply the Zone rule.</b> An attacker cannot place a blow on a covered Zone. If a Hit would land on one, it lands on your Arms instead, or your Head if the Arms are covered too. A Critical Hit ignores this and chooses freely, because finding the gap is what a critical hit is.")}
    ${P("Cover is judged per attacker, every time. The same wall can give you Greater Cover against the archer in front of you and nothing at all against the one who walked around your flank. Nothing about cover is a property of you; it is a property of the line between you and your foe. <b>Total cover works both ways</b>: if nothing can reach you, you cannot see out either. And <b>a creature never gives more than Lesser Cover</b>, whatever it happens to be standing in front of. Bodies are not walls.")}
    <h3>Concealment</h3>
    ${P("Where cover is having something solid in the way, Concealment is not being clearly seen: a +2 Situation bonus to your Defense while your enemy still knows exactly where you are. Dim light, fog, smoke, heavy rain, and thick snow all conceal. None of them hide you, which is why Hide ❶ and Sneak ❶ exist: they are how you turn concealment into being genuinely unfound, and both are Stealth against the Awareness of whoever might spot you.")}`;

  if(wikiSec==="Going Down") h+=`
    <div class="callout"><b>Vigor is not meat.</b> It is what you have left in you: wind, focus, the strength to keep your guard where it belongs, and the sort of luck that turns a killing blow into a shallow one. Losing Vigor is not collecting Wounds. It is running out of the things that keep Wounds from happening. Wounds are the meat, and they are tracked separately, by Zone. This is why a character at 3 Vigor is not carved apart: they are winded, sloppy, and one bad moment from finished. It is also why Vigor comes back with a night's sleep, and why a tenth-level character has more of it without having thicker skin.</div>
    <h3>Your Vigor</h3>
    ${P("At 1st level: <b>your Ancestry's Vigor + your first Calling's Opening Vigor + 10</b>. At every level thereafter: your Ancestry's Vigor. (The book's formula still names an Endure Bonus; Endure Training grants none since v4.21, its clause being Load Strain relief, so it is 0.) Only your first Calling adds its Opening Vigor, however many you open later. <b>Ten minutes</b> spent relaxing and refocusing restores Vigor equal to your <b>level × your Presence</b> (if positive). <b>A full night's rest restores all of your Vigor.</b> Vigor returns quickly because it is not meat; a tenth-level character has more of it without having thicker skin.")}
    <h3>Temporary Vigor</h3>
    ${P("A buffer laid over your Vigor. Damage comes out of it first, and only what is left over reaches your real Vigor. It is not healing: anything that restores Vigor restores your own, never these. You can only have one pool at a time; if an effect would give you a second, keep whichever pool is larger and discard the other. It lasts until it is spent or until the effect that granted it ends, whichever comes first. Losing your last point of Temporary Vigor is <i>not</i> the same as being reduced to 0 Vigor: it does not make you Spent. Protection applies first, because Protection reduces the damage itself.")}
    <h3>Reaching 0 Vigor: Spent</h3>
    ${P("When damage reduces you to 0 Vigor, you are <b>Spent</b>. You are still on your feet and still fighting, but there is nothing left between the blows and your body. Damage beyond what it took to empty your Vigor is simply lost; you cannot go below 0. While you are Spent, <b>every Hit that lands on you inflicts a Wound</b> on the Zone it struck, and a Critical Hit inflicts two. A Graze does not inflict a Wound. Nonlethal damage that would Wound a Spent creature knocks it unconscious instead; it wakes in ten minutes, or sooner if someone rouses it, with 1 Vigor.")}
    <h3>Wounds</h3>
    ${P("A Wound is a real injury, and is applied to a Zone. You take a Wound on two triggers: <b>a Critical Hit with a Deliberate or Committed Strike lands on an Exposed Zone</b> (the attacker found the gap and drove through it; a Quick Strike is a probe and cannot Wound this way; an attack with the Massive trait Wounds on any Critical Hit), or <b>any Hit lands while you are Spent</b> (a Critical Hit while Spent inflicts two). The Wound goes to the Zone struck, and that Zone carries the condition Wounded [Zone]. Its effect is the Zone's critical effect made lasting: it does not clear when you Recenter, only when the Wound is treated.")}
    ${tbl(["Zone","First Wound","Final Wound"],["Arms","Legs","Torso","Head"].map(z=>[`<b>${z}</b>`,WOUNDFX[z][0],WOUNDFX[z][1]]))}
    ${P("<b>Wound capacity.</b> A Medium or smaller creature's Zone carries two Wounds: the first has the first-Wound effect, the second the final effect. Larger creatures carry more before the final effect: Large 3, Huge 4, Gargantuan 5. Each Wound between the first and the last repeats the first-Wound effect (a second Torso Wound on a Large creature adds another 1d4 of persistent bleed; a second Legs Wound halves what Speed it had left). Creature templates such as Elite or Boss may add capacity. A further Wound to a useless Arm or Leg goes to the Torso instead.")}
    ${P("<b>Treating Wounds.</b> Vigor comes back with sleep; Wounds do not. An ally may spend ten minutes treating one of your Wounds and roll Endure against a Threshold of <b>10 + the number of Wounds you carry</b>. On a success the Wound is bound: its effect ends, but it still counts as a Wound for Recovery checks and for treating the others until it heals. A Wound heals after one week of Downtime rest, or through effects that specifically heal Wounds. Restoring Vigor never heals a Wound.")}
    <h3>Dying</h3>
    ${P("Dying is a value, and it counts up toward the end. You begin Dying when your <b>Torso or Head takes its final Wound</b> (the second, for a Medium or smaller creature): at <b>Dying 1</b>, or <b>Dying 2</b> if the blow that dropped you was a Critical Hit. While Dying you are unconscious and helpless: you cannot act, and attacks against you succeed without a roll. Taking damage while Dying increases your Dying value by 1, or by 2 from a Critical Hit. <b>At Dying 5, you die.</b>")}
    <h4>Recovery checks</h4>
    ${P("At the start of each round while Dying, make a Recovery check: an Endure check against a Threshold of <b>10 + your Dying value + the number of Wounds you carry</b>. It costs no action.")}
    ${tbl(["Result","Effect"],(R.recovery||[]))}
    ${P("<b>Helping.</b> An adjacent ally may spend ❶ to press a wound, straighten your neck, or shout your soul back into your body: you gain a +2 Situation bonus to your next Recovery check. <b>Healing.</b> Any effect that restores even 1 Vigor to a Dying character ends their Dying at once. They are conscious, with that Vigor. Their Wounds remain.")}
    <h3>Refusing death</h3>
    <div class="callout" style="border-color:#B8860B">${P("When you would die, you may spend <b>all</b> of your Hero Points (if you have any) to refuse it. This is not a roll. It cannot fail, and nothing in the game can stop it. Your Dying value drops to 0. You are unconscious and stable at 0 Vigor. Your Wounds remain. You have no Hero Points until the GM awards more, or until the next session.")}${P("It is the only thing in Starwrought that simply happens. Spend it and describe how: the blow that should have finished you turned on a buckle, the arrow found the strap and not the throat, you got your chin down at the last possible instant. You have bought one more scene, and paid everything you had for it.")}</div>`;

  if(wikiSec==="Progression") h+=`
    <div class="callout"><b>The Flare loop:</b> ${UNIFLARE}</div>
    <h3>Milestones & levels</h3>
    ${P("Every level is four Milestones. Milestones 1–3 grant 1 Milestone Talent Point apiece, spent <b>immediately</b> on a Talent eligible through an applicable Flare. The 4th is the level-up: Vigor rises, new Proficiency Ranks may unlock, and you gain a <b>Comet</b>, a Talent Point that answers to no Constellation. Spend it immediately, anywhere, Flared or not, opened or not, prerequisites met. <b>No Talent Point may ever be voluntarily banked.</b> <b>Milestone conversion:</b> if no Talent you qualify for is eligible through any of your Flares, the Milestone point becomes a Comet instead. Level never touches the die: no roll or Threshold ticks up because you levelled, only because a rank did.")}
    <h3>Flares and training</h3>
    ${P("A Flare records the <b>particular training</b> demonstrated by the event that produced it, such as Dueling or Flamecraft. A Milestone Talent Point can be spent only on a Talent relevant to that training, subject to GM approval. Sharing a Proficiency Rank does not make unrelated Talents eligible: a critical success with a Dueling technique Flares Dueling, not Shield Fighting, though a Talent bought through that Flare still counts toward your Melee rank. The relevant training need not already be open to you: a consequential check made Untrained can Flare a Constellation and let the point buy its root.")}
    <h3>Level-up checklist</h3>
    ${P("+Vigor equal to your Ancestry Vigor. Check the rank gates (Expert at level 5, Master at 10, Legendary at 15) and spend your Comet. Recompute Attributes if points moved. A new rank in Melee or Ranged is another weapon die on a Deliberate or Committed Strike (1 / 2 / 3 / 4 at Trained / Expert / Master / Legendary), and a new rank in a magical discipline another Damage Die.")}
    <h3>Also Flares</h3>
    ${P("<b>GM awards</b> for meaningful achievements no die roll captured: carrying the survivor out of the fire Flares Athletics, no check required. <b>Downtime training</b>: a week with a teacher, rival, or manual (the Train Activity) records a Flare for the training pursued. This is the deliberate path to growth you haven't stumbled into at the table.")}
    <h3>Retraining</h3>
    ${P("A <b>month</b> of Downtime moves 1 already spent Talent Point anywhere legal. You cannot retrain away from a Talent in your Origin Constellation, a Root Talent, a Talent that another Talent you own requires, or one that would drop your Proficiency Rank. Characters are maps of what you've done, but maps get redrawn.")}`;

  if(wikiSec==="Thresholds") h+=`<div class="callout">A <b>Threshold</b> is the number a check is measured against: ten plus the modifier of the roll it stands in for, so <b>10 + attribute + proficiency</b>, with the same bonuses and penalties. Other games use Armor Class or Difficulty Class in a similar manner. A Guard of +7 is a Guard Threshold of 17. The GM sets them; you roll against them.</div>`
    +P("<b>Creatures carry Thresholds instead of rolling</b>: an Initiative Threshold, an Attack Threshold for each attack (the check it would have rolled, with a 10 in place of the die), and a Threshold for each Defense. When a creature attacks, the player rolls the Defense against its Attack Threshold; when the player attacks, they roll against the creature's Defense Threshold. The same margin is read from whichever side the player is on.")
    +P("<b>Tasks with no creature behind them</b> (a lock, a cliff, a lie to a guard) take a Threshold the GM sets for the difficulty of the thing itself. Some are printed with their rules: Aid and Grab an Edge roll against 15; Rally and Command the Field against 14; Wind against 10 + Load Strain (at the end of every round, with Load Strain of at least 1; a critical failure is Fatigued +2); Persistent Damage against 10 + the amount just taken; a Recovery check against 10 + Dying + Wounds carried; treating a Wound against 10 + Wounds carried. Level never enters a Threshold, so a task does not get harder because you got better; the things you have done get easier.")
    +((R.thresholdTable||[]).length?tbl(["Task level","Threshold"],R.thresholdTable):"");
  return h;
}

// ---------- events ----------
function bind(m){
  m.querySelectorAll(".wizsky svg[data-skykey]").forEach(sv=>skyNav(sv, sv.dataset.skykey));
  m.querySelectorAll("[data-a]").forEach(b=>b.addEventListener("click",()=>act(b.dataset.a)));
  m.querySelectorAll("[data-open]").forEach(c=>c.addEventListener("click",()=>{activeId=c.dataset.open;localStorage.setItem("sparks-active",activeId);render();}));
  m.querySelectorAll("[data-combat]").forEach(c=>c.addEventListener("click",()=>{wiz.picks.combat=c.dataset.combat;wiz.err="";render();}));
  m.querySelectorAll("[data-anc]").forEach(c=>c.addEventListener("click",()=>{wiz.ch.ancestry=c.dataset.anc;wiz.picks.her=null;wiz.picks.tg={};wiz.err="";render();}));
  m.querySelectorAll("[data-her]").forEach(c=>c.addEventListener("click",()=>{wiz.picks.her=c.dataset.her;wiz.picks.tg={};wiz.err="";render();}));
  m.querySelectorAll("[data-cul]").forEach(c=>c.addEventListener("click",()=>{wiz.picks.culName=c.dataset.cul;wiz.err="";render();}));
  m.querySelectorAll("[data-bg]").forEach(c=>c.addEventListener("click",()=>{wiz.picks.bg=c.dataset.bg;wiz.picks.bgA=[];wiz.picks.bgB=[];wiz.picks.bgLore=[];wiz.err="";render();}));
  m.querySelectorAll("[data-cal]").forEach(c=>c.addEventListener("click",()=>{wiz.picks.calName=c.dataset.cal;wiz.picks.calling=[];wiz.picks.calSkill=[];
    if(!combatOptions(c.dataset.cal).includes(wiz.picks.combat)) wiz.picks.combat=null; wiz.err="";render();}));
  bindTips(m);
  m.querySelectorAll("[data-skyf]").forEach(b=>b.addEventListener("click",()=>{wiz.skyFocus=wiz.skyFocus||{};wiz.skyFocus[b.dataset.skyf]=b.dataset.skyt;render();}));
  m.querySelectorAll("[data-skytog]").forEach(b=>b.addEventListener("click",()=>{wiz.skyOpen=wiz.skyOpen||{};const k=b.dataset.skytog;wiz.skyOpen[k]=!(wiz.skyOpen[k]!==false);render();}));
  m.querySelectorAll("[data-pick]").forEach(el=>el.addEventListener("click",()=>{
    if(el.classList.contains("dis"))return;
    const key=el.dataset.pick; let id=el.dataset.id;
    if(id.startsWith("Lore||")){ const ty=prompt("What kind of Lore? (e.g., Circus, Warfare, Trade Roads)");
      if(!ty||!ty.trim()) return; id="Lore ("+ty.trim()+")||"+id.split("||")[1]; }
    if(key==="free") togg(wiz.picks.free,id,3);
    if(key==="def") togg(wiz.picks.def=wiz.picks.def||[],id,2);
    if(key==="calling") togg(wiz.picks.calling=wiz.picks.calling||[],id,1);
    if(key==="calSkill") togg(wiz.picks.calSkill=wiz.picks.calSkill||[],id,1);
    if(key==="bgA") togg(wiz.picks.bgA=wiz.picks.bgA||[],id,1);
    if(key==="bgB") togg(wiz.picks.bgB=wiz.picks.bgB||[],id,1);
    if(key==="bgLore") togg(wiz.picks.bgLore=wiz.picks.bgLore||[],id,1);
    if(key.startsWith("tg:")){ const nm2=key.slice(3); wiz.picks.tg=wiz.picks.tg||{}; wiz.picks.tg[nm2]=wiz.picks.tg[nm2]||[];
      const nd=allTreeNames().flatMap(t2=>treeOf(t2).nodes).find(x=>x.name===nm2);
      togg(wiz.picks.tg[nm2],id,(nd&&nd.grant&&nd.grant.n)||1); }
    wiz.err=""; render();
  }));
  const wn=m.querySelector("[data-wname]"); if(wn) wn.addEventListener("input",e=>wiz.ch.name=e.target.value);
  m.querySelectorAll("[data-wzone]").forEach(s=>s.addEventListener("change",e=>{
    wiz.ch.armor=Object.assign(NOARMOR(),wiz.ch.armor||{}); wiz.ch.armor[s.dataset.wzone]=e.target.value||null; render();}));
  const wsh=m.querySelector("[data-wshield]"); if(wsh) wsh.addEventListener("change",e=>{wiz.ch.shield=e.target.value||null;render();});
  m.querySelectorAll("[data-jumpc]").forEach(a2=>a2.addEventListener("click",()=>{(wiz.culShown=wiz.culShown||[]).includes(a2.dataset.jumpc)||wiz.culShown.push(a2.dataset.jumpc);render();}));
  m.querySelectorAll("[data-jump]").forEach(a2=>a2.addEventListener("click",()=>{(wiz.freeShown=wiz.freeShown||[]).includes(a2.dataset.jump)||wiz.freeShown.push(a2.dataset.jump);render();}));
  m.querySelectorAll("[data-tree]").forEach(a2=>a2.addEventListener("click",()=>{etree=a2.dataset.tree;localStorage.setItem("sparks-etree",etree);tab="explorer";eview={mode:2,cat:treeOf(etree).category};esel=null;ezoom="in";render();}));
  m.querySelectorAll("[data-et]").forEach(b=>b.addEventListener("click",()=>{etree=b.dataset.et;localStorage.setItem("sparks-etree",etree);eview={mode:2,cat:treeOf(etree).category};esel=null;ezoom="in";render();}));
  m.querySelectorAll("[data-ev]").forEach(b=>b.addEventListener("click",()=>{const mo=+b.dataset.ev; if(mo===eview.mode&&b.classList.contains("here"))return;
    ezoom="out"; eview = mo===0?{mode:0,cat:null}:{mode:1,cat:eview.cat||treeOf(etree).category}; esel=null; render();}));
  m.querySelectorAll("[data-wstep]").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.wstep; if(canJump(i)){wiz.step=i;wiz.err="";keepY=0;render();}}));
  m.querySelectorAll("[data-skyjump]").forEach(b=>b.addEventListener("click",()=>{ if(!wiz) return; wiz.skyFocus=wiz.skyFocus||{}; wiz.skyFocus.free=b.dataset.skyjump; if(canJump(7)) wiz.step=7; wiz.err=""; render(); }));
  m.querySelectorAll("[data-w]").forEach(b=>b.addEventListener("click",()=>{wikiSec=b.dataset.w;localStorage.setItem("sparks-wiki",wikiSec);render();}));
  m.querySelectorAll("[data-spark]").forEach(s=>s.addEventListener("click",()=>{const c=active();c.sparks[s.dataset.spark]=!c.sparks[s.dataset.spark];persist();}));
  m.querySelectorAll("[data-ms]").forEach(s=>s.addEventListener("click",()=>{const c=active(),n=+s.dataset.ms;
    if(n===4){ if(c.milestones>=3) act("levelup"); return; }
    if(c.milestones>=n){ c.milestones=n-1; persist(); return; }
    const flared=Object.keys(c.sparks).filter(t2=>c.sparks[t2]);
    // v4.21 (ch.7, Milestone Conversion): with no Talent eligible through any Flare, the Milestone point becomes a Comet
    if(!flared.length){ c.milestones=n; c.bankedF=1; c.log.push(`Milestone ${n}: nothing Flared, so the Milestone point becomes a Comet.`); persist();
      spendModal(c,{src:"F",note:"Milestone point with nothing Flared: it becomes a Comet. Spend it now, anywhere (points are never banked).",onCancel:()=>{c.bankedF=0;c.milestones=n-1;c.log.push(`Milestone ${n} declined (point must be spent on receipt).`);persist();}}); return; }
    c.milestones=n; c.bankedM=1; persist();
    spendModal(c,{src:"M",note:"Milestone point: spend it now through a Flare, on a Talent of the training the Flare records (points are never banked).",onCancel:()=>{c.bankedM=0;c.milestones=n-1;c.log.push(`Milestone ${n} declined (point must be spent on receipt).`);persist();}});}));
  const dy=m.querySelector("[data-dying]"); if(dy) dy.addEventListener("change",e=>{const c2=active(); if(c2){c2.dying=Math.max(0,Math.min(5,+e.target.value||0));persist();}});
  // Wounds by Zone: clicking box k marks k Wounds, or clears back to k−1 if k is already marked
  m.querySelectorAll("[data-wound]").forEach(s=>s.addEventListener("click",()=>{
    const c2=active(); if(!c2) return; c2.wounds=Object.assign({Head:0,Torso:0,Arms:0,Legs:0},c2.wounds||{});
    const z=s.dataset.wound, k=+s.dataset.wn, cur=+c2.wounds[z]||0;
    c2.wounds[z]=cur>=k?k-1:k; persist();}));
  m.querySelectorAll("[data-expose]").forEach(s=>s.addEventListener("click",()=>{
    const c2=active(); if(!c2) return; c2.exposed=c2.exposed||{};
    const z=s.dataset.expose; if(c2.exposed[z]) delete c2.exposed[z]; else c2.exposed[z]=true; persist();}));
  const vg=m.querySelector("[data-vigor]"); if(vg) vg.addEventListener("change",e=>{active().vigorCur=Math.max(0,+e.target.value||0);persist();}); // Vigor never goes below 0: at 0 you are Spent
  const tp=m.querySelector("[data-vtmp]"); if(tp) tp.addEventListener("change",e=>{active().vigorTmp=Math.max(0,+e.target.value||0);persist();});
  const gr=m.querySelector("[data-gear]"); if(gr) gr.addEventListener("change",e=>{active().gear=e.target.value;saveAll(chars);});
  const nt=m.querySelector("[data-notes]"); if(nt) nt.addEventListener("change",e=>{active().notesTxt=e.target.value;saveAll(chars);});
  m.querySelectorAll("[data-zone]").forEach(s=>s.addEventListener("change",e=>{
    const c2=active(); if(!c2) return; c2.armor=Object.assign(NOARMOR(),c2.armor||{});
    c2.armor[s.dataset.zone]=e.target.value||null; persist();}));
  const shs=m.querySelector("[data-shield]"); if(shs) shs.addEventListener("change",e=>{const c2=active(); if(c2){c2.shield=e.target.value||null;persist();}});
  const im=m.querySelector("#impfile"); if(im) im.addEventListener("change",e=>{
    const f=e.target.files[0]; if(!f)return; const rd=new FileReader();
    rd.onload=()=>{try{const c=JSON.parse(rd.result); if(!c.talents) throw 0; c.id="c"+Date.now(); chars.push(migrate(c)); activeId=c.id; persist();}catch(_){alert("Not a STARWROUGHT character JSON.");}}; // an exported v3 save arrives with hpCur, Weapons and the numeric Wounded: the migrator, as at boot
    rd.readAsText(f);});
}
function togg(list,id,max){ const i=list.indexOf(id); if(i>=0)list.splice(i,1); else if(list.length<max)list.push(id); }
function act(a){
  const c=active();
  if(a==="new"){ tab="wizard"; wiz=null; render(); }
  if(a==="torva"){ if(!chars.find(x=>x.id==="sample-mira")) chars.push(migrate(JSON.parse(JSON.stringify(TORVA)))); activeId="sample-mira"; localStorage.setItem("sparks-active",activeId); persist(); }
  if(a==="import"){ document.getElementById("impfile").click(); }
  if(a==="export"&&c){ const bl=new Blob([JSON.stringify(c,null,2)],{type:"application/json"});
    const u=URL.createObjectURL(bl), el=document.createElement("a"); el.href=u; el.download=(c.name||"character").replace(/\s+/g,"_")+".sparks.json"; el.click(); URL.revokeObjectURL(u); }
  if(a==="del"&&c&&confirm(`Delete ${c.name||"this character"}?`)){ chars=chars.filter(x=>x.id!==c.id); activeId=null; persist(); }
  if(a==="explore"&&c){ const t=Object.keys(c.talents)[0]; if(t){etree=t;} eview={mode:2,cat:treeOf(etree).category}; esel=null; ezoom="in"; tab="explorer"; render(); }
  if(a==="levelup"&&c&&c.milestones>=3){ c.level++; c.milestones=0; c.bankedF=1; c.vigorCur=null; c.log.push(`LEVEL UP → ${c.level}. Comet received. Vigor rises; check the rank gates (Expert L5, Master L10, Legendary L15): a new rank in Melee or Ranged is another weapon die.`); persist();
    spendModal(c,{src:"F",note:"Level-up Comet: spend it now, anywhere (points are never banked).",onCancel:()=>{c.bankedF=0;c.log.push("Comet forfeited (points are never banked).");persist();}}); }
  if(a==="spend"&&c){ spendModal(c); }
  if(a==="wback"){ wiz.step--; wiz.err=""; keepY=0; render(); }
  if(a==="wnext"){
    if(!stepComplete(wiz.step)){ const g=stepGate(wiz.step);
      const pl=pools().find(x=>x.step===wiz.step&&x.ready&&x.spent<x.need);
      wiz.err=g||(pl?`spend before moving on: ${pl.label} (${pl.spent}/${pl.need}, ${pl.where})`:"finish this step first");
    } else {wiz.step++; wiz.err=""; keepY=0;} render(); }
  if(a==="wreset"){ wiz=null; keepY=0; render(); }
  if(a==="wsave"){ const bl=saveBlockers();
    if(bl.length){wiz.err="unfinished business: "+bl.map(b=>b.msg).join("; ")+". The tracker above jumps to each.";render();return;}
    const fc=buildFinal();
    if(!fc){wiz.err="complete every step first";render();return;}
    if(!fc.name){wiz.err="give them a name";render();return;}
    fc.vigorCur=derive(fc).vigorMax; chars.push(fc); activeId=fc.id; localStorage.setItem("sparks-active",activeId); wiz=null; tab="chars"; persist(); }
}
function spendModal(c,forced){
  const useM=forced?forced.src==="M":(c.bankedM||0)>0, useF=forced?forced.src==="F":(c.bankedF||0)>0;
  const sparked=Object.keys(c.sparks).filter(t=>c.sparks[t]);
  const bg=document.createElement("div"); bg.className="modal-bg";
  const treeOpts=(names)=>names.map(t=>`<option>${t}</option>`).join("");
  bg.innerHTML=`<div class="modal"><h2>Spend a talent point</h2>
    <p class="muted">${(forced&&forced.note)?forced.note+" ":""}A Milestone point is spent through a Flare, on a Talent of the training the Flare records (and consumes it). Comets go anywhere, opened or not.</p>
    <p style="margin:8px 0">Source:
      <label><input type="radio" name="src" value="M" ${useM?"":"disabled"} ${useM?"checked":""}> Milestone (${c.bankedM||0})</label>
      <label style="margin-left:12px"><input type="radio" name="src" value="F" ${useF?"":"disabled"} ${!useM&&useF?"checked":""}> Comet (${c.bankedF||0})</label></p>
    <p>Tree: <select id="sptree"></select></p>
    <div id="spnodes" style="max-height:44vh;overflow-y:auto"></div>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="b" id="spok" disabled>Buy</button><button class="b ghost" id="spx">Cancel</button></div></div>`;
  document.body.appendChild(bg);
  const sel=bg.querySelector("#sptree"), nodesDiv=bg.querySelector("#spnodes"), ok=bg.querySelector("#spok");
  let chosen=null;
  function refreshTrees(){
    const src=bg.querySelector("input[name=src]:checked")?.value||"F";
    const names=src==="M"?sparked:allTreeNames();
    sel.innerHTML=treeOpts(names.length?names:["(no Flared constellations)"]);
    refreshNodes();
  }
  function refreshNodes(){
    const t=sel.value; chosen=null; ok.disabled=true;
    if(!t||t.startsWith("(")){nodesDiv.innerHTML="<p class='muted'>Flare a constellation first (a related crit, a GM award, or training).</p>";return;}
    const tr=treeOf(t);
    nodesDiv.innerHTML=tr.nodes.map(n=>{
      const cb=canBuy(c,t,n,false);
      return `<div class="talent-pick ${cb.ok?"":"dis"}" data-n="${n.name.replace(/"/g,"&quot;")}">
        <span class="tdot" style="background:${TIERC[n.tier]}"></span><b>${n.name}</b>
        <span style="color:#4a5c66">${stripT(n.effect).length>100?stripT(n.effect).slice(0,98)+"…":n.effect}</span>
        ${cb.ok?"":`<span class="muted">(${cb.why})</span>`}</div>`;}).join("");
    nodesDiv.querySelectorAll(".talent-pick").forEach(el=>el.addEventListener("click",()=>{
      if(el.classList.contains("dis"))return;
      nodesDiv.querySelectorAll(".talent-pick").forEach(x=>x.classList.remove("sel"));
      el.classList.add("sel"); chosen=el.dataset.n; ok.disabled=false;
    }));
  }
  bg.querySelectorAll("input[name=src]").forEach(r=>r.addEventListener("change",refreshTrees));
  sel.addEventListener("change",refreshNodes);
  refreshTrees();
  bg.querySelector("#spx").addEventListener("click",()=>{bg.remove(); if(forced&&forced.onCancel) forced.onCancel();});
  ok.addEventListener("click",()=>{
    const src=bg.querySelector("input[name=src]:checked").value, t=sel.value;
    buy(c,t,chosen);
    if(src==="M"){ c.bankedM--; c.sparks[t]=false; c.log.push(`Spent milestone point: ${t} → ${chosen} (Flare consumed).`); }
    else { c.bankedF--; c.log.push(`Spent Comet: ${t} → ${chosen}.`); }
    bg.remove(); persist();
  });
}
hotload().then(render);
</script>
</body>
