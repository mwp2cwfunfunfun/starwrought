<script>
let TREES = {
 "Human": {
  "category": "Ancestry",
  "enabled": true,
  "feeds": "Presence",
  "lore": [
   {
    "label": "Summary",
    "text": "Humans are restless, adaptable, and ambitious, making much of their brief lives and finding strength in one another."
   },
   {
    "label": "About",
    "text": "Humans are everywhere, and everywhere they are different. No other people spreads so far, argues so loudly, or reinvents itself so often. A human border town can change its laws, its faith, and its skyline inside a single generation; an elf who naps through a decade returns to find the maps redrawn. What humans lack in long memory they repay in momentum, and the other peoples watch them with a mix of admiration and alarm.<br><br>That restlessness is personal as much as cultural. A human feels the shortness of their years and answers it with ambition: one more field cleared, one more deal struck, one more mountain nobody sensible would climb. At their best, humans bind strangers into companies and companies into causes. At their worst, they burn through places, promises, and people the way they burn through years."
   },
   {
    "label": "If you want...",
    "text": "If you want a character who can come from anywhere, get along with anyone, and refuse to stay in any lane, you should play a human."
   },
   {
    "label": "You Might...",
    "text": "• Chase a goal so hard that rest starts to feel like theft.<br>• Collect skills, contacts, and causes the way others collect coins.<br>• Assume any problem can be solved if you just find the right people for it."
   },
   {
    "label": "Others Probably...",
    "text": "• Envy how quickly you learn, adapt, and move on.<br>• Wonder what you are running from, or racing toward.<br>• Trust your knack for finding common ground, even between old enemies."
   },
   {
    "label": "Physical Description (at a glance)",
    "text": "Humans are middling in most measures and wildly varied in all of them. They stand roughly five to six and a half feet tall, in every build from wiry to broad, with skin, hair, and eyes spanning every shade their homelands offer. What marks a human crowd is not a shared look but a shared motion: quick eyes, busy hands, and clothing that borrows freely from every neighbor they have ever traded with."
   },
   {
    "label": "Physical Description (lifecycle)",
    "text": "Humans reach physical adulthood around 15 years and are usually granted a place at the adults' table by 18, though every town draws that line differently. A human who avoids war, plague, and their own ambition can expect sixty to ninety years, and a rare few see a century. Their short season is the quiet engine of their character; humans plant orchards whose shade they will never sit in, and they know it."
   },
   {
    "label": "Society",
    "text": "Human society is less a single design than a permanent argument about what the design should be. Kingdoms, leagues, free towns, wandering companies: humans have tried them all, usually at the same time, usually within a week's ride of each other. Their gift is the joining of strangers. A human market will seat a dwarven smith beside an elven dyer and a gnomish clockmaker, and by closing time the three will share a ledger and a grudge against the harbormaster.<br><br>Because they invent themselves so freely, humans put enormous weight on names, oaths, and reputations, the few things that outlive them. A human's word, once given before witnesses, is a load-bearing wall; whole towns stand on webs of such promises. Breaking one is not just a sin but a kind of vandalism.<br><br>Humans honor their dead by continuing their projects. Workshops, farms, feuds, and half-built bridges pass from hand to hand like torches, and a human family can often recite what each generation added to the house even when they have forgotten the builders' faces."
   },
   {
    "label": "Beliefs",
    "text": "Human belief runs hot and plural. One village keeps six shrines and hedges its bets at all of them; the next follows a single creed with terrifying focus. What is consistent is the human conviction that effort matters, that the world is unfinished, and that somebody, probably them, ought to get on with finishing it. Their prayers tend to be practical: strength for the harvest, luck for the crossing, courage for the morning."
   },
   {
    "label": "Popular Edicts",

 "Dwarf": {
  "category": "Ancestry",
  "enabled": true,
  "feeds": "Might",
  "lore": [
   {
    "label": "Summary",
    "text": "Dwarves are enduring and powerfully built, with long memories for the things that hold a life together and the faults that can bring it down."
   },
   {
    "label": "About",
    "text": "A dwarf is difficult to hurry when they think the next step deserves another look. They can feel the strain in a carried load, set their weight before a hard pull, and continue a task long after its novelty has worn away. Outsiders often call this stubbornness. Sometimes the dwarf agrees.<br><br>Long life and a durable body make endurance familiar, but they do not make every dwarf patient or every attachment wise. Some stay with a failing work because leaving would feel like admitting it was never worth the effort. Others become adventurers when they finally distinguish what is theirs to carry from what an older generation placed on their shoulders. A dwarf’s departure can be as considered and determined as another dwarf’s decision to remain."
   },
   {
    "label": "If you want...",
    "text": "If you want a character who can hold their ground, carry a difficult responsibility, and decide which commitments deserve that strength, play a dwarf."
   },
   {
    "label": "You Might...",
    "text": "• Inspect the support before trusting the impressive surface.<br>• Keep an old tool or ordinary object because of who used it before you.<br>• Show affection by doing the work someone else has been avoiding."
   },
   {
    "label": "Others Probably...",
    "text": "• Trust you to stay when a task turns unpleasant.<br>• Assume your certainty comes from experience rather than temperament.<br>• Wonder how long you intend to remember one careless remark."
   },
   {
    "label": "Physical Description (at a glance)",
    "text": "Dwarves generally stand four to five feet tall, with broad torsos, sturdy joints, and a low center of balance. They are Medium despite their height. Hair, skin, and eye colors vary by lineage; thick hair and strong facial growth are common but differ between individuals and families. A dwarf’s clothing, beard styling, jewelry, and visible marks of belonging reflect their Culture and choices rather than an ancestry-wide uniform."
   },
   {
    "label": "Physical Description (lifecycle)",
    "text": "Dwarves reach physical adulthood around twenty years and often live two to three centuries. They tend to retain strength well into later life, though age still brings injury, fatigue, and loss. Different cultures place different weight on years, experience, or the acceptance of a public responsibility when recognizing adulthood."
   },
   {
    "label": "Society",
    "text": "Dwarves inhabit mountain holds, river towns, cities, farms, and settlements alongside other peoples. Their work is as varied as the places they inhabit. In some communities with many dwarven families, a household is understood as a work carried across generations: its members might maintain a bridge, keep a garden, preserve a library, or support a trade. The obligation matters more than the material it involves.<br><br>Such arrangements can make reliable institutions and burdensome expectations. A family may expect a young dwarf to continue a work they never chose, or refuse to admit that a respected practice no longer serves anyone. Other communities deliberately pass important duties beyond blood relations, considering the person who keeps a thing working more significant than the name of its first maker."
   },
   {
    "label": "Beliefs",
    "text": "Dwarven traditions often give spiritual weight to maintenance, honest workmanship, and obligations that can survive a bad year. A repaired roof may be a more convincing offering than an expensive ceremony. That outlook can serve many faiths, including those that have no connection to stone or metal. A dwarf may honor an ancestor by continuing their work, improving it, or finally correcting the harm it caused."
   },
   {
    "label": "Popular Edicts",
    "text": "• Make the thing sound before calling it finished.<br>• Carry the share you have agreed to carry.<br>• Teach someone how to maintain what you leave behind."
   },
   {
    "label": "Popular Anathemas",
    "text": "• Conceal a fault that will endanger another person.<br>• Claim the credit for work another hand completed.<br>• Demand endurance from others to spare yourself an honest change."
   },
   {
    "label": "Names",
    "text": "Many dwarven family names combine a material or descriptive word with part of a lasting structure: a span, vault, arch, pier, or lintel. The name may commemorate an ancestral home or public work rather than a current occupation. Given names are often short, with firm consonants.<br><b>• Common given names </b>Bera, Dagna, Dorik, Helda, Korrin, Marda, Rurik, Torren.<br><b>• Common family names</b> Broadarch, Deepvault, Highlintel, Ironspan, Redkeystone, Stonepier."
   }

 "Elf": {
  "category": "Ancestry",
  "enabled": true,
  "feeds": "Wits",
  "lore": [
   {
    "label": "Summary",
    "text": "Elves are long-lived and keen-sensed, finding beauty in careful attention and difficulty in knowing when a thing is truly finished."
   },
   {
    "label": "About",
    "text": "An elf may remember the sapling beneath a spreading oak, the face on a weathered statue, and the first small quarrel behind a feud that now has its own songs. That memory changes how the world feels. A road is also the wood it replaced. A stranger’s expression may recall someone who died a century ago. Few things arrive without an echo.<br><br>Yet elves are as capable of impatience as anyone. Some spend years refining a small work because its imperfections will not leave them alone; others flee an old home because every doorway holds a conversation they can still hear. Their long lives offer time to change, but also time to become very certain that change is a mistake. An elf who takes to the road may be seeking something new, or finally accepting that something old is over."
   },
   {
    "label": "If you want...",
    "text": "If you want a character whose long memory and careful senses make even familiar places feel layered with possibility, play an elf."
   },
   {
    "label": "You Might...",
    "text": "• Notice how a place has changed before asking who now owns it.<br>• Return to an unfinished craft, friendship, or promise after years away.<br>• Become fiercely attached to a short-lived companion’s plans."
   },
   {
    "label": "Others Probably...",
    "text": "• Mistake your deliberate attention for distraction or indifference.<br>• Ask you to remember a history you never personally witnessed.<br>• Wonder whether you are listening to them or to someone they remind you of."
   },
   {
    "label": "Physical Description (at a glance)",
    "text": "Elves usually stand five and a half to six and a half feet tall, with long limbs, fine ears, and a light frame. Their coloring varies widely between families; eyes often show distinct rings or flecks that become clearer in dim light. Their movements tend to make small adjustments early, keeping a loose surface or crowded passage from becoming an obvious obstacle. Clothing and ornament follow upbringing, occupation, and personal taste."
   },
   {
    "label": "Physical Description (lifecycle)",
    "text": "Elves reach physical adulthood at roughly twenty years. Many live three to five centuries, with rare elders surviving longer. Customs about adulthood vary by Culture, often marking the acceptance of responsibility or a first independent undertaking. Their memories remain fallible, and an old elf knows only the parts of history they actually lived or studied."
   },
   {
    "label": "Society",
    "text": "Elves live in cities, farm valleys, forest settlements, and communities shared with other ancestries. Their cultures govern their laws and loyalties. Where long-lived elven families gather, continuity often rests with people as much as with records: the same neighbor may witness several generations of a household’s agreements. This can preserve trust, but it can also preserve a grievance long after anyone else remembers its beginning.<br><br>Some elven households keep a place for returning members, expecting departures that would count as a lifetime elsewhere. Others deliberately move, rename themselves, or pass responsibility onward so the young are not forever waiting behind an elder. Among mixed communities, elves often learn the difficult habit of making decisions on someone else’s shorter timetable."
   },
   {
    "label": "Beliefs",
    "text": "Elven beliefs are as varied as their cultures. Traditions with long elven histories often ask what deserves to continue and what should be allowed to end. A carefully maintained grove, a restored public square, and a song finally permitted to change may all express the same reverence. Some elves find comfort in cycles; others devote themselves to a particular life or work precisely because it will not return."
   },
   {
    "label": "Popular Edicts",
    "text": "• Give a person or a work your full attention.<br>• Preserve what others cannot afford to lose.<br>• Leave room for those who will follow you."
   },
   {
    "label": "Popular Anathemas",
    "text": "• Treat a short life as a lesser one.<br>• Keep a promise only because you have forgotten why it mattered.<br>• Destroy an irreplaceable thing through simple impatience."
   },
   {
    "label": "Names",
    "text": "Many elven naming traditions pair a flowing given name with a family name recalling a seasonal or celestial change. In Common, these family names often become two-part compounds such as Firstfrost or Rainwake. The name may recall an ancestor’s arrival, a remembered omen, or the season when a household began.<br><b>• Common given names </b>Aelira, Calen, Elaris, Lethan, Meriel, Naeris, Orilan, Saelith.<br><b>• Common family names</b> Dawnbloom, Firstfrost, Leafturn, Nightfall, Rainwake, Sunwane."
   }
  ],

 "Gnome": {
  "category": "Ancestry",
  "enabled": true,
  "feeds": "Wits",
  "lore": [
   {
    "label": "Summary",
    "text": "Gnomes are perceptive and resilient, with a lasting sensitivity to the unusual and a capacity for attention that can make a small detail occupy an entire afternoon."
   },
   {
    "label": "About",
    "text": "A gnome may notice a slight change in a voice, a hairline seam in a well-made object, or a pattern that only appears when everyone else has stopped looking. Some turn that attention toward machines or magic; others toward gardens, people, music, law, or a question so narrow that its importance takes time to explain. An interest can outlast a working life and follow its owner through several changes of vocation.<br><br>Old stories connect gnomes with places where the world behaves a little differently: lights without a flame, paths that seem shorter on the return journey, voices heard through the wrong wall. Their inherited resistance to mental influence lends those stories weight, though it does not prove any one account. Gnomes can be practical about the uncanny and hopelessly speculative about an ordinary loose hinge. They become adventurers for the same varied reasons anyone does, with the added possibility that the unanswered question has finally moved somewhere dangerous."
   },
   {
    "label": "If you want...",
    "text": "If you want a character who notices the odd detail, follows an interest seriously, and can bring an unusual perspective to a familiar problem, play a gnome."
   },
   {
    "label": "You Might...",
    "text": "• Ask a precise question that changes what everyone thought they understood.<br>• Keep a small object because its construction or history still puzzles you.<br>• Become deeply competent in a subject that first caught your attention by accident."
   },
   {
    "label": "Others Probably...",
    "text": "• Confuse your intense interest with an inability to take anything seriously.<br>• Bring you a mystery when they meant to ask for a simple repair.<br>• Discover that you remember the small thing they said months ago."
   },
   {
    "label": "Physical Description (at a glance)",
    "text": "Gnomes generally stand two and a half to three and a half feet tall. They are Small, with expressive faces, fine ears, and alert eyes. Skin, hair, and eye colors vary widely; some lineages show unusual saturated tones or a faint luminous sheen. These features need not be bright or conspicuous. Dress, ornament, and the tools a gnome carries reflect their Culture and work rather than an ancestry-wide taste for tinkering."
   },
   {
    "label": "Physical Description (lifecycle)",
    "text": "Gnomes reach physical adulthood around twenty years and commonly live one hundred eighty to two hundred fifty years. Their interests may change many times over that span, or deepen around a single enduring pursuit. Age brings physical changes and personal losses. Some elders seek fresh pursuits; others find a settled pleasure in familiar work and the people who have come to share it."
   },
   {
    "label": "Society",
    "text": "Gnomes live in mixed cities, quiet rural settlements, river communities, and places of their own making. Their laws and institutions come from their cultures. In communities with many gnomish households, informal networks often gather around shared interests: a survey, a musical tradition, an old court case, or the careful observation of one hillside. Such groups can outlast the problem that brought them together.<br><br>Attention can be generous or possessive. One gnome may welcome anyone who can add a useful observation, while another guards a modest discovery as though it were a royal inheritance. Long-running projects sometimes become the easiest route into a community and the hardest thing to leave. Adventuring gnomes often carry a promise to bring back a specimen, an answer, or simply an account that someone at home will understand."
   },
   {
    "label": "Beliefs",
    "text": "Gnomish traditions often value careful observation, honest wonder, and the obligation to admit when a cherished explanation fails. Some faiths understand discovery as a form of devotion; others emphasize tending the mysteries that should not be disturbed. A gnome’s sensitivity to the uncanny can lead to reverence, skepticism, or a very practical desire to know which door should remain closed."
   },
   {
    "label": "Popular Edicts",
    "text": "• Look closely before deciding that a thing is ordinary.<br>• Share a discovery with someone who can make good use of it.<br>• Change your explanation when the evidence demands it."
   },
   {
    "label": "Popular Anathemas",
    "text": "• Make a person the unwilling subject of your curiosity.<br>• Hide a dangerous flaw to protect the elegance of an idea.<br>• Dismiss another person’s interest merely because it is small or unfamiliar."
   },
   {
    "label": "Names",
    "text": "Some gnomish families favor alliterative names. Their translated family names often pair a material with a small object or component, preserving the memory of an old discovery, project, or household curiosity. A pleasing sound can follow a family for generations after the original object or project has been forgotten.<br>• Common given names Bimri, Della, Fenna, Nori, Perri, Sella, Tessa, Venn.<br>• Common family names Brasshinge, Dewglass, Flintwheel, Needlespring, Pewterpin, Tinspire."
   }

 "Halfling": {
  "category": "Ancestry",
  "enabled": true,
  "feeds": "Agility",
  "lore": [
   {
    "label": "Summary",
    "text": "Halflings are small and adaptable, often finding that an attentive hand and a fortunate second chance can turn the course of a much larger problem."
   },
   {
    "label": "About",
    "text": "Halflings live close to a world built by larger people. A countertop can hide a conversation; a hurried crowd can become moving walls; a door made for someone else may require both hands. Familiarity with such inconveniences often produces a practical eye for another approach. A halfling notices the smaller latch, the loose board, or the person nobody thought to ask.<br><br>Their reputed luck is harder to explain. A slipping grip catches again. A lock yields at the last adjustment. The bridge plank breaks one step behind them. Halflings disagree about whether this is a blessing, an inherited gift, or a story people tell after forgetting all the careful work that preceded it. None of those explanations guarantees an easy life, and many halflings become adventurers because they are tired of being someone else’s reassuring little exception."
   },
   {
    "label": "If you want...",
    "text": "If you want a character whose small stature leaves plenty of room for resourcefulness, courage, and the occasional unlikely escape, play a halfling."
   },
   {
    "label": "You Might...",
    "text": "• Notice who has been overlooked in a crowded room.<br>• Keep a modest comfort ready for an uncertain journey.<br>• Try a practical approach after an imposing one has failed."
   },
   {
    "label": "Others Probably...",
    "text": "• Underestimate how far you have already traveled.<br>• Tell the story of your escape as though luck did all the work.<br>• Relax around you before realizing how closely you have been paying attention."
   },
   {
    "label": "Physical Description (at a glance)",
    "text": "Halflings usually stand two and a half to three and a half feet tall. They are Small, with varied builds, rounded or lightly pointed ears, and hands capable of very precise work. Broad feet and dense hair on the lower legs occur in many families; well-fitted boots and sturdy sandals are as common as bare feet. Their clothing and household arrangements follow the Culture and surroundings in which they live."
   },
   {
    "label": "Physical Description (lifecycle)",
    "text": "Halflings reach physical adulthood at around eighteen years. Many live between one hundred and one hundred sixty years, with some surviving longer. Their physical development resembles that of humans more closely than that of the very long-lived peoples, while their extended later years let them remain part of several generations of a household."
   },
   {
    "label": "Society",
    "text": "Halflings build their own settlements and live throughout the towns and countries of other peoples. Their families may be established farmers, urban tenants, river travelers, court officials, or anything else their Culture and circumstances allow. Communities with many halfling households often pay close attention to shared access: a low latch, an extra step, and a place to sit are signs that someone has considered who will actually use a room.<br><br>Some households preserve belonging through regular meals and visits; others through routes, letters, and the expectation that a traveler can return without explaining every year away. This welcome can become intrusive when a family decides it knows what kind of life should make a person content. A halfling who leaves may be carrying the household’s hopes, escaping them, or simply curious about what lies beyond the familiar turn in the road."
   },
   {
    "label": "Beliefs",
    "text": "Many halfling traditions give significance to ordinary acts of welcome, safe passage, and remembering the absent. Luck may be addressed as a spirit, a blessing, an ancestor’s attention, or a habit of staying alert. Their beliefs can be solemn, skeptical, or exuberant. The familiar emphasis on small comforts is often an acknowledgment that security requires work, not proof that the world is harmless."
   },
   {
    "label": "Popular Edicts",
    "text": "• Make room for someone the room was not built to welcome.<br>• Share what keeps you steady through a difficult day.<br>• Give a good effort the chance to become a fortunate one."
   },
   {
    "label": "Popular Anathemas",
    "text": "• Mistake another person’s small stature for a small claim to respect.<br>• Take hospitality and repay it with contempt.<br>• Rely on luck to excuse a danger you could have prevented."
   },
   {
    "label": "Names",
    "text": "Many halfling family names remember a small landmark near an ancestral home: a gate, lane, stile, ford, or turn in a road. In Common they often combine a plant or local feature with that landmark. The family need not still live there.<br><b>• Common given names</b> Bessa, Jory, Milo, Nell, Orrin, Pella, Tamsin, Tobin.<br><b>• Common family names </b>Barleybridge, Brackenstile, Hazelturn, Littleford, Reedgate, Sunlane."
   }
  ],

 "Serrovane": {
  "category": "Culture",
  "enabled": true,
  "feeds": "Presence",
  "lore": [
   {
    "label": "Summary",
    "text": "Serrovanians build trust through witnessed promises, careful records, and the conviction that a person should answer for their word."
   },
   {
    "label": "About",
    "text": "Serrovane is a lowland order-state of cultivated fields, raised roads, and towns gathered around registry halls. Its ledgers are kept in triplicate, its agreements carry witnesses, and its disputes follow forms that everyone is expected to respect. A promise spoken casually may be forgotten. A promise entered into the record becomes something other people can build their lives upon.<br><br>People of many ancestries belong to this order. An elven witness, a dwarven magistrate, and a human challenger may disagree bitterly while trusting the same record. Serrovanians learn how to state a grievance, acknowledge an obligation, and offer a concession without surrendering their standing. They can be formidable negotiators: they know exactly what they have promised, and they expect you to know the same."
   },
   {
    "label": "If you want...",
    "text": "If you want a character who takes promises seriously, understands the power of public reputation, and can turn a few carefully chosen words into a lasting obligation, choose Serrovane."
   },
   {
    "label": "You Might...",
    "text": "• Ask who witnessed an agreement before asking whether it was a good one.<br>• Carry copies of important promises, judgments, or introductions among your belongings.<br>• Insist on settling the terms of a contest before anyone draws a weapon."
   },
   {
    "label": "Others Probably...",
    "text": "• Trust you to remember an obligation long after everyone else has forgotten it.<br>• Find your careful questions reassuring, exhausting, or faintly threatening.<br>• Worry that an innocent remark might become a commitment in your hearing."
   },
   {
    "label": "Dress and Bearing",
    "text": "Serrovanian clothing favors orderly layers, durable fabrics, and visible signs of affiliation. Household colors, office badges, and witness cords help others recognize whom a person represents. Garments vary with ancestry, occupation, and means, but people generally take care that closures are secure and identifying marks remain legible.<br><br>Formal bearing matters as much as fine clothing. Standing to acknowledge a witness, leaving another speaker room to finish, and presenting a document with clean hands all communicate respect."
   },
   {
    "label": "Upbringing and Milestones",
    "text": "Children learn promises through ordinary responsibilities: returning borrowed tools, delivering messages accurately, and admitting when a task remains unfinished. Many households preserve a young person’s first independently witnessed obligation.<br><br>Public responsibility follows demonstrated judgment, with its timing shaped by ancestry and family custom. Taking an office, joining a household, completing an apprenticeship, and retiring from service are commonly marked by a formal acknowledgment of the duties being accepted or released."
   },
   {
    "label": "Society",
    "text": "Serrovanian institutions depend on recorded responsibilities. Officials swear to the limits of their offices, guilds preserve the terms of their charters, and households keep accounts of debts, inheritances, and obligations. Public scribes and witnesses are familiar figures in markets and village squares.<br><br>Formal challenge gives disputes an accepted shape. The grievance, the contest, and the consequences are declared before witnesses. Some challenges involve arms; others test skill, testimony, or the ability to substantiate a claim. Violence within accepted terms can be lawful. Breaking those terms threatens the trust that made the challenge possible.<br><br>This order has its cruelties. Wealth buys patient advocates, old records can preserve old injustices, and a precisely worded agreement can conceal an ugly intention. Serrovanians argue fiercely over whether justice lies in honoring the record or correcting what should never have been written into it."
   },
   {
    "label": "Beliefs",
    "text": "Serrovanians follow many faiths, but promises, testimony, and remembrance occupy an honored place across them. Shrines often witness marriages, reconciliations, and vows of service. An ancestor may be remembered through an obligation their descendants continue to uphold.<br><br>Mercy also has a recognized dignity. Publicly releasing someone from an oath can be an act of generosity remembered as long as the oath itself."
   },
   {
    "label": "Popular Edicts",
    "text": "• Keep your word when doing so becomes inconvenient.<br>• State your terms before the contest begins.<br>• Stand witness when another needs the truth recorded."
   },
   {
    "label": "Popular Anathemas",
    "text": "• Knowingly swear an oath you intend to break.<br>• Falsify a record entrusted to your care.<br>• Inflict punishment beyond the terms of an accepted challenge."
   },
   {
    "label": "Names",
    "text": "Many Serrovanian surnames take the form of a short promise: something a household declares it will uphold. These names are inherited, and families take particular pride in living up to them. Someone named Speaktrue can expect a lie to be remembered with unusual clarity.<br><br>People commonly retain given names from their family or ancestry. The surnames below are familiar Common translations of Serrovine names.<br><b>• Common given names </b>Cerran, Dovra, Ilyra, Maroven, Orven, Selka, Tavren, Veyra.<br><b>• Common surnames</b> Bearwitness, Holdfaith, Keepword, Speaktrue, Standfast.<br><b>• Example names</b> Cerran Keepword, Dovra Standfast, Ilyra Speaktrue, Maroven Bearwitness, Selka Holdfaith."
   }
  ],

 "Kestrel Reach": {
  "category": "Culture",
  "enabled": true,
  "feeds": "Wits",
  "lore": [
   {
    "label": "Summary",
    "text": "Reachers thrive where people and possibilities meet, building livelihoods through sharp observation, useful introductions, and bargains worth making again."
   },
   {
    "label": "About",
    "text": "Kestrel Reach spreads across a wide river delta, where channels divide around crowded islands and trade-towns rise above the floodwater. Six languages may be spoken along a single dock, with three more heard by evening. Boats bring unfamiliar goods, travelers bring unfamiliar customs, and someone is always looking for a person who understands both.<br><br>Reachers grow accustomed to difference early. An elven shipwright, a dwarven grain factor, and a human ferryman may share a neighborhood, a business venture, and a running argument about harbor fees. Local knowledge means knowing how people prefer to be approached, which courtesies matter to them, and whom they trust to make an introduction. A good broker can accomplish with an afternoon’s conversation what an armed company might spend a season making worse."
   },
   {
    "label": "If you want...",
    "text": "If you want a character who is comfortable among unfamiliar faces, always listening for an opportunity, and rarely without someone they could ask for help, choose Kestrel Reach."
   },
   {
    "label": "You Might...",
    "text": "• Learn a few useful words whenever you encounter a new language.<br>• Introduce yourself by naming someone the other person already knows.<br>• Look for what each side needs before deciding that a dispute cannot be settled."
   },
   {
    "label": "Others Probably...",
    "text": "• Expect you to know a useful contact in almost any port.<br>• Wonder whether your friendly questions are leading toward a proposal.<br>• Rely on you to notice the custom, omission, or hidden cost they overlooked."
   },
   {
    "label": "Dress and Bearing",
    "text": "Reach clothing reflects crowded docks, changeable weather, and goods arriving from distant places. Practical layers, secure pockets, broad hats, and garments kept clear of ropes are common. Fabrics and ornaments travel freely between communities, adapted to each wearer’s build and family traditions.<br><br>Reachers often display a token of their trade, vessel, or trading house where an acquaintance can recognize it. Greeting gestures vary between neighborhoods, and knowing which one to offer can make a warmer introduction than expensive clothes."
   },
   {
    "label": "Upbringing and Milestones",
    "text": "Young Reachers learn by carrying messages, helping with household business, and accompanying experienced relatives through markets and landing places. They are taught to notice who has spoken, who has been overlooked, and whether everyone understands the same terms.<br><br>A first independently completed bargain or entrusted journey often marks growing responsibility. Its importance lies in returning with the agreement fulfilled and the other party willing to deal with the household again. These milestones follow readiness and circumstance across the Reach’s many ancestries."
   },
   {
    "label": "Society",
    "text": "The delta depends on cooperation that extends beyond individual towns. Ferrymen need maintained channels, merchants need dependable warehouses, and everyone needs the flood banks to hold. Neighborhood associations, trading houses, craft guilds, and harbor officials overlap in a web of favors and competing responsibilities.<br><br>Reputation moves quickly along the waterways. A generous settlement can bring business from three towns away; a cheated customer can arrive ahead of you wherever you hoped to trade next. Brokers earn their standing by remembering details, protecting confidences, and finding terms that people will actually honor.<br><br>The Reach’s friendliness can conceal hard boundaries. Established houses sometimes keep profitable routes among themselves, and an introduction may matter more than an excellent offer. Reachers admire people who open opportunities for others, but they also know how easily a well-connected few can decide who gets a place at the table."
   },
   {
    "label": "Beliefs",
    "text": "Reach shrines welcome travelers, returning crews, and families whose traditions came from elsewhere. River spirits, ancestral patrons, and gods of craft, fortune, and safe passage all receive offerings.<br><br>Many Reachers regard hospitality as an obligation that travels. Someone shelters a stranger today because another household may shelter their own kin tomorrow. Gifts, favors, and acts of kindness create relationships whose value cannot always be entered into an account."
   },
   {
    "label": "Popular Edicts",
    "text": "• Learn how to greet people on their own terms.<br>• Give the other party a reason to trade with you again.<br>• Share a useful introduction when it costs you little."
   },
   {
    "label": "Popular Anathemas",
    "text": "• Abuse the protection offered to a guest.<br>• Conceal a danger that makes an agreement impossible to fulfill.<br>• Betray a confidence entrusted to you as a broker."
   },
   {
    "label": "Names",
    "text": "Reach surnames often come from waterways and shoreline features. A name may remember the bank where a household built its first home, the channel its boats worked, or the landing from which its members scattered across the world. Families carry these names inland long after the river itself has become a distant memory.<br><br>Given names mingle freely across languages and ancestries. The surnames below are commonly used in their Common forms.<br><b>• Common given names </b>Avi, Dena, Jori, Kes, Lio, Mira, Neris, Orren, Savi, Tavi.<br><b>• Common surnames</b> Broadwater, Lowbank, Northbank, Reedbank, Siltwater, Stillwater, Three-Tides, Willowbend.<br><b>• Example names</b> Avi Northbank, Dena Willowbend, Jori Reedbank, Mira Three-Tides, Neris Stillwater, Tavi Lowbank."
   }
  ],

 "Cairnward": {
  "category": "Culture",
  "enabled": true,
  "feeds": "Might",
  "lore": [
   {
    "label": "Summary",
    "text": "Cairnwarders share the work that keeps a mountain road passable, a shelter supplied, and a struggling traveler from being left behind."
   },
   {
    "label": "About",
    "text": "Cairnward is a chain of high valleys and pass towns joined by narrow roads, rope bridges, and stone shelters whose doors open from the outside. Snow can close a route between breakfast and dusk. Every settlement therefore maintains places where a stranger can find dry fuel, a blanket, and directions to the next safe roof. The supplies belong to the road, and taking what you need creates an expectation that you will replenish a shelter when you can.<br><br>People of many ancestries keep this system working. A halfling may inspect a bridge’s underside while a dwarf anchors the line, an elf reads a changing sky, and a gnome counts the fuel left at the next refuge. Cairnwarders learn that useful strength includes knowing when to ask for another pair of hands. The region admires a difficult rescue, but admires the uneventful journey made possible by good maintenance just as much."
   },
   {
    "label": "If you want...",
    "text": "If you want a character who judges a community by whom it is prepared to help, shares difficult work readily, and knows the value of a safe place to stop, choose Cairnward."
   },
   {
    "label": "You Might...",
    "text": "• Check how much fuel and food remain before settling into a borrowed shelter.<br>• Divide a difficult load before anyone has to admit that it is too heavy.<br>• Leave a clear warning where the next traveler will see it."
   },
   {
    "label": "Others Probably...",
    "text": "• Trust you to notice when someone is quietly falling behind.<br>• Find your questions about ropes, weather, and spare blankets excessive until the road turns bad.<br>• Assume you will help, and sometimes forget to ask what that help costs you."
   },
   {
    "label": "Dress and Bearing",
    "text": "Cairnward clothing favors repairable layers, close-fitting sleeves, and cords that can be handled with cold fingers. Bright shoulder tabs make travelers easier to count in fog or snow. Different towns favor different colors, while a small braided loop commonly identifies a household that helps maintain a particular route. Garments and equipment are fitted to their wearer’s ancestry and build.<br><br>Offering someone the sheltered side of a doorway is a familiar courtesy. So is taking one end of a load before beginning a long conversation. Elaborate clothing earns little admiration if its owner refuses to mend a loose fastening."
   },
   {
    "label": "Upbringing and Milestones",
    "text": "Children begin with small contributions: carrying a handful of kindling to a nearby refuge, learning the warning signs, and accompanying adults on a short maintenance walk. They are taught to distinguish a task they can manage from one that needs help.<br><br>A first independently completed shelter round often marks growing responsibility. The young person returns with an account of what was repaired, replaced, or left for a more experienced crew. Ancestry, ability, and circumstance shape the timing. Later milestones include taking responsibility for a route, teaching a new crew, and handing a demanding duty onward before age or injury makes it unsafe."
   },
   {
    "label": "Society",
    "text": "Cairnward’s towns govern their own affairs but share responsibility for the routes between them. Seasonal gatherings assign shelter rounds, bridge inspections, and repair crews. Contributions may be labor, materials, food, transport, or skilled planning. A person who cannot safely climb a pass can still arrange the work that makes it passable.<br><br>Rescue crews are assembled around the situation rather than inherited office. The most experienced person for the route leads, and others are expected to speak when they notice a danger. Once everyone is home, the community replaces damaged equipment and supports those injured in its service.<br><br>The system can also make unreasonable demands. A capable household may receive every difficult assignment while a wealthy one supplies goods and keeps its members safe at home. Families sometimes pressure an exhausted rescuer to prove their loyalty one more time. Cairnwarders argue over how to share danger fairly, and who must be heard when a respected leader says the risk is acceptable."
   },
   {
    "label": "Beliefs",
    "text": "Cairnward shelters often contain a small shared shrine, though the people who maintain them follow many faiths. Travelers leave a knot, a stone, or a few words of thanks after reaching safety. Those lost on the road are remembered by name, with particular care taken to mark where a rescue failed or a route changed.<br><br>Many Cairnwarders understand care for an unknown future traveler as a form of devotion. A dry blanket left behind can serve that purpose as readily as a prayer spoken aloud."
   },
   {
    "label": "Popular Edicts",
    "text": "• Leave the shelter ready for the person who comes after you.<br>• Share the load before it breaks someone.<br>• Mark a danger clearly, even when you cannot repair it yourself."
   },
   {
    "label": "Popular Anathemas",
    "text": "• Take a refuge’s last supplies and conceal the shortage.<br>• Move or falsify a trusted waymark for personal advantage.<br>• Pressure someone into a rescue whose danger you refuse to share."
   },
   {
    "label": "Names",
    "text": "Cairnward household names often pair a number with a useful provision. Such a name remembers the painted sign of an old refuge, the gift that established a household, or the supplies its members once promised to maintain. The number is a remembered emblem rather than a current inventory. Adopted relatives and people who join a household commonly take its name.<br><br>Given names often come from family and ancestry traditions. Common forms of the household names are used below.<br><b>• Common given names </b>Anya, Bera, Elda, Fenna, Kellan, Meriel, Pella, Torek.<br><b>• Common household names</b> Five-Blankets, Four-Cups, Nine-Ropes, Seven-Coals, Three-Loaves, Two-Lanterns."
   }
  ],

 "Lethra": {
  "category": "Culture",
  "enabled": true,
  "feeds": "Agility",
  "lore": [
   {
    "label": "Summary",
    "text": "Lethrans learn to read the part a person is playing, signal across a crowded room, and move gracefully between public duties and private lives."
   },
   {
    "label": "About",
    "text": "Lethra is a terraced hill city and its surrounding towns, known for shaded lanes, lantern courts, and the public masks hung beside the doors of neighborhood halls. A service mask identifies a duty. The Open Palm hears a dispute, the Lantern Eye guides people through the night, and the White Reed carries an entrusted message. Qualified residents take turns wearing them, so a familiar office may have a different voice or stature tomorrow.<br><br>The custom gives people a way to serve without making every public act a test of family standing. An elven mediator, a dwarven messenger, and a halfling night guide may wear masks recognized across the same quarter. Private faces are greeted by name; public masks are addressed by their duties. Festivals turn that habit into theater, with neighbors borrowing parts, exchanging costumes, and enjoying how much a small change of bearing can alter a familiar person."
   },
   {
    "label": "If you want...",
    "text": "If you want a character who understands the power of a convincing role, protects room for a private self, and can turn a crowded scene into an opportunity for a companion, choose Lethra."
   },
   {
    "label": "You Might...",
    "text": "• Ask what duty a person is performing before deciding how to address them.<br>• Use a small gesture to cue a companion across a noisy room.<br>• Keep a change of clothing or a carefully maintained mask among your belongings."
   },
   {
    "label": "Others Probably...",
    "text": "• Expect you to notice a false note in someone’s manner.<br>• Wonder which parts of your public confidence you carry into private life.<br>• Rely on you to draw attention when someone else needs a moment to act."
   },
   {
    "label": "Dress and Bearing",
    "text": "Lethran clothing favors garments that can be adjusted, layered, and moved in easily. Reversible coats, detachable collars, and bright linings let a person change their public presentation without replacing an entire wardrobe. Masks are fitted to the wearer: beards, ears, spectacles, and different facial shapes all receive practical consideration.<br><br>Service masks use established designs; festival masks invite invention. Lethrans generally leave another person’s mask alone unless invited to handle it. Removing one’s own mask at the end of a duty is a small but deliberate acknowledgment that the office has been put aside."
   },
   {
    "label": "Upbringing and Milestones",
    "text": "Children learn public roles through games, errands, and supervised festival performances. A game may require them to deliver an accurate message while pretending to be someone else, or to recognize a familiar adult from posture alone. They also learn when a shared joke has made another person uncomfortable.<br><br>A first public duty is usually undertaken with an experienced partner. Acceptance depends on readiness, training, and the demands of the role across Lethra’s many ancestries. Taking a service mask, returning it after a final term, and teaching its next wearer are widely recognized milestones."
   },
   {
    "label": "Society",
    "text": "Neighborhood maskhouses maintain the service masks, train their wearers, and arrange rotating duties. Residents can bring a complaint against an office without knowing the wearer’s private name. The maskhouse is responsible for examining the complaint and putting right harm done in its service; the wearer remains answerable for deliberate abuse.<br><br>Public performance supports ordinary civic life. Announcements, petitions, and difficult disagreements are often presented in open courts where people are accustomed to attending closely and responding in turn. A well-timed pause or an offered change of speaker can keep an argument from becoming a contest of volume.<br><br>The system has its failures. Established maskhouses may decide who is qualified before an outsider ever receives a fair hearing, and an admired office can shelter a disappointing wearer. A convincing false mask can exploit public trust. Lethrans debate how much privacy an officeholder should retain, and how to expose wrongdoing without turning every public duty into a spectacle."
   },
   {
    "label": "Beliefs",
    "text": "Lethra’s faiths approach masks in different ways. Some use them to represent divine duties, ancestral figures, or the changing seasons. Others insist that worship begins when every mask is set aside. Both kinds of shrine can stand in the same street.<br><br>A common act of remembrance is to repair an object used in someone’s public service and offer it to a new wearer. The dead person is named during the gift, preserving their contribution while leaving the next person room to serve in their own way."
   },
   {
    "label": "Popular Edicts",
    "text": "• Perform the duty you have agreed to represent.<br>• Give another person room to put a public role aside.<br>• Use attention carefully, especially when a quieter voice needs to be heard."
   },
   {
    "label": "Popular Anathemas",
    "text": "• Claim the authority of a service mask you have no right to wear.<br>• Expose a private confidence merely to entertain an audience.<br>• Let a respected office excuse deliberate harm by its wearer."
   },
   {
    "label": "Names",
    "text": "Many Lethran family names combine a color with part of a garment. The name may recall the costume of an old household festival role, a family’s traditional colors, or an ancestor’s recognizable public dress. These inherited names remain in use after the original garment has been lost. They confer no office or authority.<br><br>Given names often retain the sounds of a family’s ancestry or home language. The surnames below use their familiar Common translations.<br><b>• Common given names </b>Della, Elaris, Jori, Lio, Marda, Neri, Sella, Tavin.<br><b>• Common surnames </b>Bluesleeve, Goldcuff, Grayhem, Greencollar, Redsash, Whiteribbon."
   }
  ],

     "text": "Humans are everywhere, and everywhere they are different. No other people spreads so far, argues so loudly, or reinvents itself so often. A human border town can change its laws, its faith, and its skyline inside a single generation; an elf who naps through a decade returns to find the maps redrawn. What humans lack in long memory they repay in momentum, and the other peoples watch them with a mix of admiration and alarm.<br><br>That restlessness is personal as much as cultural. A human feels the shortness of their years and answers it with ambition: one more field cleared, one more deal struck, one more mountain nobody sensible would climb. At their best, humans bind strangers into companies and companies into causes. At their worst, they burn through places, promises, and people the way they burn through years."

     "text": "Cairnward is a chain of high valleys and pass towns joined by narrow roads, rope bridges, and stone shelters whose doors open from the outside. Snow can close a route between breakfast and dusk. Every settlement therefore maintains places where a stranger can find dry fuel, a blanket, and directions to the next safe roof. The supplies belong to the road, and taking what you need creates an expectation that you will replenish a shelter when you can.<br><br>People of many ancestries keep this system working. A halfling may inspect a bridge’s underside while a dwarf anchors the line, an elf reads a changing sky, and a gnome counts the fuel left at the next refuge. Cairnwarders learn that useful strength includes knowing when to ask for another pair of hands. The region admires a difficult rescue, but admires the uneventful journey made possible by good maintenance just as much."
    },
    {
     "label": "If you want...",
     "text": "If you want a character who judges a community by whom it is prepared to help, shares difficult work readily, and knows the value of a safe place to stop, choose Cairnward."
    },
    {
     "label": "You Might...",
     "text": "• Check how much fuel and food remain before settling into a borrowed shelter.<br>• Divide a difficult load before anyone has to admit that it is too heavy.<br>• Leave a clear warning where the next traveler will see it."
    },
    {
     "label": "Others Probably...",
     "text": "• Trust you to notice when someone is quietly falling behind.<br>• Find your questions about ropes, weather, and spare blankets excessive until the road turns bad.<br>• Assume you will help, and sometimes forget to ask what that help costs you."
    },
    {
     "label": "Dress and Bearing",
     "text": "Cairnward clothing favors repairable layers, close-fitting sleeves, and cords that can be handled with cold fingers. Bright shoulder tabs make travelers easier to count in fog or snow. Different towns favor different colors, while a small braided loop commonly identifies a household that helps maintain a particular route. Garments and equipment are fitted to their wearer’s ancestry and build.<br><br>Offering someone the sheltered side of a doorway is a familiar courtesy. So is taking one end of a load before beginning a long conversation. Elaborate clothing earns little admiration if its owner refuses to mend a loose fastening."
    },
    {
     "label": "Upbringing and Milestones",
     "text": "Children begin with small contributions: carrying a handful of kindling to a nearby refuge, learning the warning signs, and accompanying adults on a short maintenance walk. They are taught to distinguish a task they can manage from one that needs help.<br><br>A first independently completed shelter round often marks growing responsibility. The young person returns with an account of what was repaired, replaced, or left for a more experienced crew. Ancestry, ability, and circumstance shape the timing. Later milestones include taking responsibility for a route, teaching a new crew, and handing a demanding duty onward before age or injury makes it unsafe."
    },
    {
     "label": "Society",
     "text": "Cairnward’s towns govern their own affairs but share responsibility for the routes between them. Seasonal gatherings assign shelter rounds, bridge inspections, and repair crews. Contributions may be labor, materials, food, transport, or skilled planning. A person who cannot safely climb a pass can still arrange the work that makes it passable.<br><br>Rescue crews are assembled around the situation rather than inherited office. The most experienced person for the route leads, and others are expected to speak when they notice a danger. Once everyone is home, the community replaces damaged equipment and supports those injured in its service.<br><br>The system can also make unreasonable demands. A capable household may receive every difficult assignment while a wealthy one supplies goods and keeps its members safe at home. Families sometimes pressure an exhausted rescuer to prove their loyalty one more time. Cairnwarders argue over how to share danger fairly, and who must be heard when a respected leader says the risk is acceptable."
    },
    {
     "label": "Beliefs",
     "text": "Cairnward shelters often contain a small shared shrine, though the people who maintain them follow many faiths. Travelers leave a knot, a stone, or a few words of thanks after reaching safety. Those lost on the road are remembered by name, with particular care taken to mark where a rescue failed or a route changed.<br><br>Many Cairnwarders understand care for an unknown future traveler as a form of devotion. A dry blanket left behind can serve that purpose as readily as a prayer spoken aloud."
    },
    {
     "label": "Popular Edicts",
     "text": "• Leave the shelter ready for the person who comes after you.<br>• Share the load before it breaks someone.<br>• Mark a danger clearly, even when you cannot repair it yourself."
    },
    {
     "label": "Popular Anathemas",
     "text": "• Take a refuge’s last supplies and conceal the shortage.<br>• Move or falsify a trusted waymark for personal advantage.<br>• Pressure someone into a rescue whose danger you refuse to share."
    },
    {
     "label": "Names",
     "text": "Cairnward household names often pair a number with a useful provision. Such a name remembers the painted sign of an old refuge, the gift that established a household, or the supplies its members once promised to maintain. The number is a remembered emblem rather than a current inventory. Adopted relatives and people who join a household commonly take its name.<br><br>Given names often come from family and ancestry traditions. Common forms of the household names are used below.<br><b>• Common given names </b>Anya, Bera, Elda, Fenna, Kellan, Meriel, Pella, Torek.<br><b>• Common household names</b> Five-Blankets, Four-Cups, Nine-Ropes, Seven-Coals, Three-Loaves, Two-Lanterns."
    }

   "lore": [
    {
     "label": "Summary",
     "text": "Lethrans learn to read the part a person is playing, signal across a crowded room, and move gracefully between public duties and private lives."
    },
    {
     "label": "About",
     "text": "Lethra is a terraced hill city and its surrounding towns, known for shaded lanes, lantern courts, and the public masks hung beside the doors of neighborhood halls. A service mask identifies a duty. The Open Palm hears a dispute, the Lantern Eye guides people through the night, and the White Reed carries an entrusted message. Qualified residents take turns wearing them, so a familiar office may have a different voice or stature tomorrow.<br><br>The custom gives people a way to serve without making every public act a test of family standing. An elven mediator, a dwarven messenger, and a halfling night guide may wear masks recognized across the same quarter. Private faces are greeted by name; public masks are addressed by their duties. Festivals turn that habit into theater, with neighbors borrowing parts, exchanging costumes, and enjoying how much a small change of bearing can alter a familiar person."
    },
    {
     "label": "If you want...",
     "text": "If you want a character who understands the power of a convincing role, protects room for a private self, and can turn a crowded scene into an opportunity for a companion, choose Lethra."
    },
    {
     "label": "You Might...",
     "text": "• Ask what duty a person is performing before deciding how to address them.<br>• Use a small gesture to cue a companion across a noisy room.<br>• Keep a change of clothing or a carefully maintained mask among your belongings."
    },
    {
     "label": "Others Probably...",
     "text": "• Expect you to notice a false note in someone’s manner.<br>• Wonder which parts of your public confidence you carry into private life.<br>• Rely on you to draw attention when someone else needs a moment to act."
    },
    {
     "label": "Dress and Bearing",
     "text": "Lethran clothing favors garments that can be adjusted, layered, and moved in easily. Reversible coats, detachable collars, and bright linings let a person change their public presentation without replacing an entire wardrobe. Masks are fitted to the wearer: beards, ears, spectacles, and different facial shapes all receive practical consideration.<br><br>Service masks use established designs; festival masks invite invention. Lethrans generally leave another person’s mask alone unless invited to handle it. Removing one’s own mask at the end of a duty is a small but deliberate acknowledgment that the office has been put aside."
    },
    {
     "label": "Upbringing and Milestones",
     "text": "Children learn public roles through games, errands, and supervised festival performances. A game may require them to deliver an accurate message while pretending to be someone else, or to recognize a familiar adult from posture alone. They also learn when a shared joke has made another person uncomfortable.<br><br>A first public duty is usually undertaken with an experienced partner. Acceptance depends on readiness, training, and the demands of the role across Lethra’s many ancestries. Taking a service mask, returning it after a final term, and teaching its next wearer are widely recognized milestones."
    },
    {
     "label": "Society",
     "text": "Neighborhood maskhouses maintain the service masks, train their wearers, and arrange rotating duties. Residents can bring a complaint against an office without knowing the wearer’s private name. The maskhouse is responsible for examining the complaint and putting right harm done in its service; the wearer remains answerable for deliberate abuse.<br><br>Public performance supports ordinary civic life. Announcements, petitions, and difficult disagreements are often presented in open courts where people are accustomed to attending closely and responding in turn. A well-timed pause or an offered change of speaker can keep an argument from becoming a contest of volume.<br><br>The system has its failures. Established maskhouses may decide who is qualified before an outsider ever receives a fair hearing, and an admired office can shelter a disappointing wearer. A convincing false mask can exploit public trust. Lethrans debate how much privacy an officeholder should retain, and how to expose wrongdoing without turning every public duty into a spectacle."
    },
    {
     "label": "Beliefs",
     "text": "Lethra’s faiths approach masks in different ways. Some use them to represent divine duties, ancestral figures, or the changing seasons. Others insist that worship begins when every mask is set aside. Both kinds of shrine can stand in the same street.<br><br>A common act of remembrance is to repair an object used in someone’s public service and offer it to a new wearer. The dead person is named during the gift, preserving their contribution while leaving the next person room to serve in their own way."
    },
    {
     "label": "Popular Edicts",
     "text": "• Perform the duty you have agreed to represent.<br>• Give another person room to put a public role aside.<br>• Use attention carefully, especially when a quieter voice needs to be heard."
    },
    {
     "label": "Popular Anathemas",
     "text": "• Claim the authority of a service mask you have no right to wear.<br>• Expose a private confidence merely to entertain an audience.<br>• Let a respected office excuse deliberate harm by its wearer."
    },
    {
     "label": "Names",
     "text": "Many Lethran family names combine a color with part of a garment. The name may recall the costume of an old household festival role, a family’s traditional colors, or an ancestor’s recognizable public dress. These inherited names remain in use after the original garment has been lost. They confer no office or authority.<br><br>Given names often retain the sounds of a family’s ancestry or home language. The surnames below use their familiar Common translations.<br><b>• Common given names </b>Della, Elaris, Jori, Lio, Marda, Neri, Sella, Tavin.<br><b>• Common surnames </b>Bluesleeve, Goldcuff, Grayhem, Greencollar, Redsash, Whiteribbon."
    }

  const cal=callingOf(ch.calling);

  const flexCount=worn.filter(p=>hasTrait(p,"Flexible")).length;

  // or Head at capacity is Dying. v4.21: independent penalties add up, each circumstance counted once, so
  // Off-Guard and an Arms Wound both come off Guard, and an Arms Wound and Prone both come off attacks.

  const sitPen={Awareness:helmPen, Evade:offGuard?2:0, Guard:(offGuard?2:0)+(wounds.Arms>=1?2:0), Endure:0};
  const atkPen=(wounds.Arms>=1?2:0)+(finalW("Legs")?2:0); // −2 Situation to attacks each: an Arms Wound, and Prone from a final Legs Wound (Conditions table)
  const noReactions=wounds.Head>=1;                                // Head Wound: "You cannot use Reactions."

  // Committed Strike; a Quick Strike and a Graze roll one. No specialization bonus: the dice are it.
  const DICE={T:1,E:2,M:3,L:4}, mr=rankOf(ch,"Melee"), rr=rankOf(ch,"Ranged");

  for(let i=0;i<Math.min(wounds.Legs,cap-1);i++) speedPre=Math.floor(speedPre/2); // each Legs Wound short of the final halves what is left
  const speed=finalW("Legs")?0:speedPre; // the final is Prone and cannot Stand; Crawl is half the Speed you had before it (ruling 138)
  const vigorCur=(ch.vigorCur==null)?vigorMax:ch.vigorCur;

    loadArmor, loadTotal, strain, strainMotion, endureRelief:relief, fitted, fittedCount, flexCount, noisyCount, noisy:noisyCount>0, visored, brimmed,
    // PHB v4.21 (Wind; ruling 150): with Load Strain of at least 1 the Endure check comes at the end of every

    crawl:Math.floor(speedPre/2),                    // Crawl ❶: half your Speed while prone

    wounds, woundCount, woundCap:cap, finalW, dyingNow:finalW("Torso")||finalW("Head"), treatTh:10+woundCount,
    restVigor:vigorMax,                              // a full night's rest restores all of your Vigor (v4.21)

function ownsTalent(ch,t,n){ return (ch.talents[t]||[]).includes(n); }
function canBuy(ch,t,node,creation){
  if(ownsTalent(ch,t,node.name)) return {ok:false,why:"owned"};
  if(node.hroot) return {ok:false,why:"heritage root, granted by choosing this heritage"};
  if(node.root&&ORIGINCATS.includes(treeOf(t).category)) return {ok:false,why:"identity roots come from your chargen choices, never from points"};
  const par=parentOf(t); // v4.21 (ruling 127): a group's Talent waits on its parent's Root, which is where its rank lives
  if(par&&!rootOwned(ch,par)) return {ok:false,why:`a ${groupWord(t)} within ${par}: requires ${rootNameOf(par)}`};
  const root=treeOf(t).nodes.find(x=>x.root);
  if(root && !ownsTalent(ch,t,root.name) && node.name!==root.name) return {ok:false,why:"requires "+root.name};
  if(node.requires&&node.requires.length&&!node.requires.some(rq=>(ch.talents[t]||[]).some(o=>nrmG(o)===nrmG(rq))))
    return {ok:false,why:"requires "+node.requires.join(" or ")};
  const after=rankOf(ch,t,1);
  if(!after || ORDER.indexOf(node.tier)>ORDER.indexOf(after)) return {ok:false,why:TIERN[node.tier]+" locked (points/level gate)"};
  if(node.name.includes("★") && !(ch.talents[t]||[]).some(n=>{const nd=treeOf(t).nodes.find(x=>x.name===n); return nd&&nd.tier==="M";}))
    return {ok:false,why:"capstone needs a Master talent here first"};

function buy(ch,t,name){ (ch.talents[t]=ch.talents[t]||[]).push(name); }

const NOARMOR=()=>({Head:null,Torso:null,Arms:null,Legs:null});
function migrate(c){ // older saves predate zone armor, Callings on the sheet, Vigor, Wounds by Zone, and several renames
  if(!c.armor) c.armor=NOARMOR();
  if(c.shield===undefined) c.shield=null;
  if(c.exposed===undefined) c.exposed={};
  if(c.dying===undefined) c.dying=0;
  if(!Array.isArray(c.log)) c.log=[]; // the notes below, and the sheet's level-up and spend, all push here

  if(c.wornArmor!==undefined) delete c.wornArmor; // the "+3 budget" armor model is retired

  if(c.hpTmp!==undefined){ if(c.vigorTmp===undefined) c.vigorTmp=c.hpTmp; delete c.hpTmp; }
  if(c.vigorCur===undefined) c.vigorCur=null;
  if(c.vigorTmp===undefined) c.vigorTmp=0;

  if(c.wounded!==undefined){
    if(+c.wounded>0) (c.log=c.log||[]).push(`v4.10 migration: the numeric Wounded ${c.wounded} is retired. Wounds are now tracked by Zone, and none were carried across.`);
    delete c.wounded; }
  const RENAME={"Fortitude":"Endure","Reflex":"Evade","Will":"Guard","Rage":"Berserker",
                "Keleshite":"Kestrel Reach","Chelaxian":"Serrovane", // style-ok: retired names, named here only to rename them away
                "Weapons":"Melee"}, // v4.10: the Weapons Constellation split into the Melee and Ranged parents

                // v4.21: the five Calling roots are named "<Calling> Calling"; a save written before carries the old root names
                "SNEAK ATTACK (spine)":"Ambusher Calling","Sneak Attack":"Ambusher Calling","RAGE ◆ (spine)":"Berserker Calling","Rage":"Berserker Calling","Rage ❶":"Berserker Calling",
                "Panache":"Bravo Calling","Mark Prey ❶":"Hunter Calling","Mark Prey":"Hunter Calling","Drilled":"Weaponmaster Calling",
                "Human":"Humanity","Keleshite":"Reacher","Chelaxian":"Serrovanian", // style-ok: same, talent-level
                "Skirmisher’s Step":"Skirmisher's Step"};

    if(!c.talents[was]) continue;
    const moved=c.talents[was].map(n=>TALENT[n]||n);
    c.talents[now]=[...new Set([...(c.talents[now]||[]), ...moved])];
    delete c.talents[was];
    if(c.sparks&&c.sparks[was]){ c.sparks[now]=true; delete c.sparks[was]; }
  }
  for(const t of Object.keys(c.talents)) c.talents[t]=c.talents[t].map(n=>{ const g=glyphs(TALENT[n]||n); return TALENT[g]||TALENT[nrmG(g)]||g; }); // the rename map is tried on the written name, the modern-glyph name and the bare name
  // v4.10: talents the book moved to another constellation (sync report, ruling 23b). The talent
  // moves with its point; matched bare so an old-glyph save still lands.

    if(!c.talents[from]) continue;

  }
  // Drop anything that no longer exists in the data: retired constellations (the four Armor
  // trees) and pruned tiers. A name that isn't authored and isn't a legal placeholder would
  // otherwise fall through to the generic stub and quietly feed Wits forever. Names are matched
  // bare (nrmG), so a save written with the old glyphs, or none, lands on the authored name.

  const placeholder=t=>/^Lore \(/.test(t)||PARENTS.includes(t)
    ||(R.skillRoster||[]).some(s=>s[0]===t)||(R.weaponStyles||[]).some(s=>s[0]===t);

    if(TREES[t]){ const byKey=new Map(TREES[t].nodes.map(n=>[nrmG(n.name),n.name]));
      for(const n of c.talents[t]) if(!byKey.has(nrmG(n))) c.log.push(`v4.10 migration: ${t} no longer carries ${n}; the talent is dropped.`);

    else if(!placeholder(t)){ if(c.talents[t].length) c.log.push(`v4.10 migration: the ${t} constellation is retired; its talents (${c.talents[t].join(", ")}) are dropped.`); c.talents[t]=[]; }
    if(!c.talents[t].length){ delete c.talents[t]; if(c.sparks) delete c.sparks[t]; }
  }
  // v4.21: the armor tables were replaced wholesale (27 pieces, by Type). A piece a save names that the
  // tables no longer carry lands on its nearest v4.21 piece; one with no counterpart leaves the Zone bare,
  // and both are logged, since a bare Zone is something the player should know about.
  const ARMOR_RENAME={"leather cap":"Leather Helm","leather cuirass":"Leather Cuirass","leather bracers":"Leather Armguards","leather leggings":"Leather Legguards",
    "scale coif":"Mail Hood","scale hauberk":"Lamellar Armor","mail coif":"Mail Hood","mail hauberk":"Mail Shirt","mail sleeves":"Mail Sleeves","mail chausses":"Mail Leggings",
    "breastplate":"Plate Cuirass","closed helm":"Full Helm","open helm":"Open Helm","vambraces":"Plate Armguards","greaves":"Plate Legguards",
    "gambeson":"Heavy Gambeson","padded coif":"Padded Hood","padded sleeves":"Padded Sleeves","padded leggings":"Padded Leggings"};
  if(c.armor&&(R.armorPieces||[]).length) for(const z of Object.keys(c.armor)){
    const was=c.armor[z]; if(!was||pieceOf(was)) continue;
    const now=ARMOR_RENAME[String(was).toLowerCase()];

  if(c.calling===undefined||c.calling===null){
    const t=Object.keys(c.talents).find(t2=>TREES[t2]&&TREES[t2].category==="Calling");
    c.calling=t||null;
  }

}

// the grant before the bullet: "<Tree> Training" for a Root's own Reaction (Evade Training's Give Ground,
// Guard Training's Set Your Feet, Melee Training's Intercept) or "<Talent> (<Tree>)" for one bought on its
// own. Owning the Talent grants it, never a shared rank (sync report, ruling 46); a Head Wound blocks them all.
function reactSource(nm){

function vWiki(){
  const secs=["How to Play","Creating a Character","Ancestries","Cultures","Backgrounds","Callings",

  const P=s=>`<p style="font-size:12.5px">${s}</p>`;
  // An actions workbook (data/maneuvers.xlsx today) is authoritative for any action it names: its rows print under their Type, in the mode
  // the Type names (Exploration, Downtime, else Encounter), and the roster row of that name is left out wherever
  // it lived (the Maneuver groups, exploration, downtime, the Reactions table).
  const acts=(typeof A!=="undefined"&&A&&A.actions)||[];
  // a Maneuver's bare name: glyphs out, a bracketed reaction cost like "(⓿↺)" out, the trailing to/or joiner out
  const bareAct=n=>String(n).replace(/\(\s*[◆◇↺★⓿❶-❻\s]*\)/g,"").replace(/[◆◇↺★⓿❶-❻]/g,"").replace(/\s+(to|or)\s*$/i,"").trim().toLowerCase();
  // An index name with no row (actions.json `retired`, 0.20.0) is the sheet's too: its roster row prints nowhere.
  const fromSheet=new Set([...acts.map(a=>bareAct(a.name)),...(((typeof A!=="undefined"&&A&&A.retired)||[]).map(bareAct))]);
  const notSheet=rows=>(rows||[]).filter(r=>!fromSheet.has(bareAct(r[0])));
  // A row's Type (PHB v4.24, Chapter 8): an Activity prints under Exploration Mode, an Endeavor under Downtime Mode, every Maneuver under Encounter Mode.
  const modeOf=t=>/^activity$/i.test(t)?"Exploration":/^endeavor$/i.test(t)?"Downtime":"Encounter";
  const groupOf=a=>a.category||a.sheet||a.type;
  const leadIns=a=>(a.frequency?`<b>Frequency</b> ${a.frequency}<br>`:"")+(a.requirements?`<b>Requirements</b> ${a.requirements}<br>`:"")+(a.trigger?`<b>Trigger</b> ${a.trigger}<br>`:"")
    +(a.range?`<b>Range</b> ${a.range}<br>`:"")+(a.target?`<b>Target</b> ${a.target}<br>`:"")+(a.duration&&modeOf(a.type)!=="Downtime"?`<b>Duration</b> ${a.duration}<br>`:"")+(a.description?`<i>${a.description}</i><br>`:"");
  // actions.json costs: "0".."6", "free", "reaction" (+ optional reaction/reactionCost flags), ranges via costMax/costMode
  const CG={"0":"⓿","1":"❶","2":"❷","3":"❸","4":"❹","5":"❺","6":"❻",free:"⓿",reaction:"↺",passive:""};
  const cg=k=>CG[String(k)]??"";
  const costOf=a=>{ let s=cg(a.cost); if(a.costMax) s+=` ${a.costMode==="or"?"or":"to"} ${cg(a.costMax)}`;
    if(a.reaction&&a.cost!=="reaction") s+=a.reactionCost!==undefined&&a.reactionCost!==""&&String(a.reactionCost)!==String(a.cost)?` (${cg(a.reactionCost)}↺)`:"↺";
    return s.trim(); };
  // The sheet actions of a mode, grouped by the row's Category (the Basic Actions sheet's book groups) else its sheet; an Activity prints its Speed, an Endeavor its Duration, a Maneuver its cost.
  const sheetTables=mode=>{const rows=acts.filter(a=>modeOf(a.type)===mode);
    return [...new Set(rows.map(groupOf))].map(g=>{const grp=rows.filter(a=>groupOf(a)===g);
      return `<h4>${g}</h4>`+(mode==="Exploration"?tbl(["Activity","Speed","Traits","Effect"],grp.map(a=>[`<b>${a.name}</b>`,a.speed||"",(a.traits||[]).join(", "),leadIns(a)+a.effect]))
        :mode==="Downtime"?tbl(["Endeavor","Duration","Traits","Effect"],grp.map(a=>[`<b>${a.name}</b>`,a.duration||"",(a.traits||[]).join(", "),leadIns(a)+a.effect]))
        :tbl(["Maneuver","Cost","Traits","Effect"],grp.map(a=>[`<b>${a.name}</b>`,costOf(a),(a.traits||[]).join(", "),leadIns(a)+a.effect])));}).join("");};
  const threatTbl=()=>tbl(["Threat","Answered by","Or by"],THREATS.map(([k,a,b])=>[`<b>${k}</b>`,link(a),link(b)]));

  if(wikiSec==="How to Play") h+=`
    <div class="callout"><b>Check = d20 + Attribute Bonus + Proficiency Bonus + bonuses &amp; penalties</b> (Situation, Condition, Gear). One formula for everything. A tenth-level character is not better at everything because a number went up; they are better at the things they have actually done. Your Attribute Bonus is raw talent. Your Proficiency Bonus is what training adds on top: the bonus from your rank in whichever Constellation the task belongs to, and simply +0 if you have no rank there at all. <b>Level opens the door to higher ranks and pays out Talent Points; it never touches the die.</b> Independent bonuses and penalties add up, whatever their type; each circumstance counts once.</div>
    <div class="callout" style="border-color:#B8860B"><b>The player always rolls.</b> Instead of the GM rolling dice secretly behind a screen, the player rolls to find out whether something succeeded or failed, so creatures carry Thresholds for most of what they do: an Initiative Threshold, a Claws Strike Threshold, a Guard Threshold, an Evade Threshold, and so on. A <b>Threshold</b> is ten plus the modifier of the check it stands in for: 10 + Attribute Bonus + Proficiency Bonus, plus any bonuses and penalties that apply. A creature (a character included) whose Guard is +7 therefore has a Guard Threshold of 17. If two players are opposed (one player attacks another, say), the player initiating the Maneuver rolls.</div>
    ${P("<b>Which Constellation?</b> Usually it is obvious. When it is not, the player proposes the one that best fits what they are actually doing, and the GM has the final say.")}
    ${P("Three modes of play: <b>Encounter</b> mode when seconds matter, <b>Exploration</b> mode in minutes and hours, and <b>Downtime</b> mode over days, weeks, and months (where income, retraining, and deliberate training live).")}
    <h3>Degrees of success</h3>
    ${P('How far the roll beat or missed the Threshold decides the degree (for Attacks, see the <a class="tl" data-w="Combat">Combat</a> section).')}
    ${tbl(["Result","Meaning"],[
      ["Beat the Threshold by 10+","Critical success, and a possible &#9889; Flare"],
      ["Meet or beat the Threshold","Success"],
      ["Miss the Threshold","Failure"],
      ["Miss by 10+","Critical failure, and a possible &#9889; Flare"],
      ["Natural 20 / Natural 1","Step the result one degree up / down"]])}
    <h3>Ranks</h3>${tbl(["Proficiency Rank","Proficiency","Min. points in the Constellation","Min. level"],[
      ["Untrained","+0","—","—"],["Trained","+3","1","Level 1"],["Expert","+6","4","Level 5"],["Master","+9","9","Level 10"],["Legendary","+12","16","Level 15"]])}
    ${P("One ladder and one gate schedule for every Constellation. Rising in rank needs <b>both</b> the points and the level. Every Constellation begins with a root: buying it is what makes you Trained, and nothing in a Constellation can be bought before it. Many Talents are tier-gated: an Expert Talent requires Expert rank.")}
    <div class="callout"><b>Constellations and groups.</b> ${link("Melee")} and ${link("Ranged")} are separate martial Constellations, and each magical discipline (${magicParents().map(link).join(", ")||"none in the data yet"}) is a Constellation of its own. A <b>Combat Style</b> is a group of Talents within Melee or Ranged, and a <b>magical specialty</b> a group within its discipline: a group shares its Constellation's Proficiency Rank and has none of its own, and every Talent you buy in it counts toward that rank once the Constellation's root is yours. Its Talents must still be bought for their effects, and a Talent feeds its Attribute once. Your Ancestry, Bloodline, and Culture likewise contribute to one shared <b>Origin</b> rank. When you Strike, roll Melee for a melee Strike and Ranged for a ranged one, a thrown dagger included; when you Cast, roll the spell's discipline.</div>
    <h3>Attributes</h3>
    ${P("Might is muscle, endurance, and raw force. Agility is speed, balance, and precision. Wits is perception, memory, and fast thinking. Presence is raw nerve, willpower, and weight of personality. You never buy them and never roll them up: every Talent feeds one, and <b>your bonus is the points you've spent in its Talents ÷ 4, rounded down</b>, to a maximum of +5.")}
    ${tbl(["Attribute points","Bonus"],[["0–3","+0"],["4–7","+1"],["8–11","+2"],["12–15","+3"],["16–19","+4"],["20+","+5 (the maximum)"]])}
    <h3>Derived numbers</h3>
    ${tbl(["Stat","Formula"],[
      ["Vigor","Ancestry Vigor + your first Calling's Opening Vigor + 10 at 1st level; add Ancestry Vigor again at every level after. (The book's formula still names an Endure Bonus; Endure Training grants none since v4.21, so it is 0.)"],
      ["Any Defense","attribute + proficiency (if any). Its Threshold is 10 + that. An Untrained Defense still adds its attribute; its Thresholds are simply 3 lower."],
      ["Any Threshold","10 + attribute + proficiency + bonuses and penalties: a check with a 10 in place of the die"],
      ["Strike","d20 + Strike Attribute + Melee (a melee Strike) or Ranged (a ranged Strike, a thrown weapon included) proficiency, against the Defense that answers it. Strike Attribute: Might, or Agility with a Finesse weapon; Agility, or Might with a Thrown weapon"],
