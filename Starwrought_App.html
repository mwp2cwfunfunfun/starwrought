<script>
let TREES = {
 "Human": {
  "category": "Ancestry",
  "enabled": true,
  "feeds": "Presence",
  "lore": [
   {
    "label": "Summary",
    "text": "Humans are restless, adaptable, and ambitious, making much of their brief lives and finding strength in one another."
   },
   {
    "label": "About",
    "text": "Humans are everywhere, and everywhere they are different. No other people spreads so far, argues so loudly, or reinvents itself so often. A human border town can change its laws, its faith, and its skyline inside a single generation; an elf who naps through a decade returns to find the maps redrawn. What humans lack in long memory they repay in momentum, and the other peoples watch them with a mix of admiration and alarm.<br><br>That restlessness is personal as much as cultural. A human feels the shortness of their years and answers it with ambition: one more field cleared, one more deal struck, one more mountain nobody sensible would climb. At their best, humans bind strangers into companies and companies into causes. At their worst, they burn through places, promises, and people the way they burn through years."
   },
   {
    "label": "If you want...",
    "text": "If you want a character who can come from anywhere, get along with anyone, and refuse to stay in any lane, you should play a human."
   },
   {
    "label": "You Might...",
    "text": "• Chase a goal so hard that rest starts to feel like theft.<br>• Collect skills, contacts, and causes the way others collect coins.<br>• Assume any problem can be solved if you just find the right people for it."
   },
   {
    "label": "Others Probably...",
    "text": "• Envy how quickly you learn, adapt, and move on.<br>• Wonder what you are running from, or racing toward.<br>• Trust your knack for finding common ground, even between old enemies."
   },
   {
    "label": "Physical Description (at a glance)",
    "text": "Humans are middling in most measures and wildly varied in all of them. They stand roughly five to six and a half feet tall, in every build from wiry to broad, with skin, hair, and eyes spanning every shade their homelands offer. What marks a human crowd is not a shared look but a shared motion: quick eyes, busy hands, and clothing that borrows freely from every neighbor they have ever traded with."
   },
   {
    "label": "Physical Description (life cycle)",
    "text": "Humans reach physical adulthood around 15 years and are usually granted a place at the adults' table by 18, though every town draws that line differently. A human who avoids war, plague, and their own ambition can expect sixty to ninety years, and a rare few see a century. Their short season is the quiet engine of their character; humans plant orchards whose shade they will never sit in, and they know it."
   },
   {
    "label": "Society",
    "text": "Human society is less a single design than a permanent argument about what the design should be. Kingdoms, leagues, free towns, wandering companies: humans have tried them all, usually at the same time, usually within a week's ride of each other. Their gift is the joining of strangers. A human market will seat a dwarven smith beside an elven dyer and a gnomish clockmaker, and by closing time the three will share a ledger and a grudge against the harbormaster.<br><br>Because they invent themselves so freely, humans put enormous weight on names, oaths, and reputations, the few things that outlive them. A human's word, once given before witnesses, is a load-bearing wall; whole towns stand on webs of such promises. Breaking one is not just a sin but a kind of vandalism.<br><br>Humans honor their dead by continuing their projects. Workshops, farms, feuds, and half-built bridges pass from hand to hand like torches, and a human family can often recite what each generation added to the house even when they have forgotten the builders' faces."
   },
   {
    "label": "Beliefs",
    "text": "Human belief runs hot and plural. One village keeps six shrines and hedges its bets at all of them; the next follows a single creed with terrifying focus. What is consistent is the human conviction that effort matters, that the world is unfinished, and that somebody, probably them, ought to get on with finishing it. Their prayers tend to be practical: strength for the harvest, luck for the crossing, courage for the morning."
   },

 "Serrovane": {
  "category": "Culture",
  "enabled": true,
  "feeds": "Presence",
  "lore": [
   {
    "label": "Summary",
    "text": "Serrovanians build trust through witnessed promises, careful records, and the conviction that a person should answer for their word."
   },
   {
    "label": "About",
    "text": "Serrovane is a lowland order-state of cultivated fields, raised roads, and towns gathered around registry halls. Its ledgers are kept in triplicate, its agreements carry witnesses, and its disputes follow forms that everyone is expected to respect. A promise spoken casually may be forgotten. A promise entered into the record becomes something other people can build their lives upon.<br><br>People of many ancestries belong to this order. An elven witness, a dwarven magistrate, and a human challenger may disagree bitterly while trusting the same record. Serrovanians learn how to state a grievance, acknowledge an obligation, and offer a concession without surrendering their standing. They can be formidable negotiators: they know exactly what they have promised, and they expect you to know the same."
   },
   {
    "label": "If you want...",
    "text": "If you want a character who takes promises seriously, understands the power of public reputation, and can turn a few carefully chosen words into a lasting obligation, choose Serrovane."
   },
   {
    "label": "You Might...",
    "text": "• Ask who witnessed an agreement before asking whether it was a good one.<br>• Carry copies of important promises, judgments, or introductions among your belongings.<br>• Insist on settling the terms of a contest before anyone draws a weapon."
   },
   {
    "label": "Others Probably...",
    "text": "• Trust you to remember an obligation long after everyone else has forgotten it.<br>• Find your careful questions reassuring, exhausting, or faintly threatening.<br>• Worry that an innocent remark might become a commitment in your hearing."
   },
   {
    "label": "Dress and Bearing",
    "text": "Serrovanian clothing favors orderly layers, durable fabrics, and visible signs of affiliation. Household colors, office badges, and witness cords help others recognize whom a person represents. Garments vary with ancestry, occupation, and means, but people generally take care that closures are secure and identifying marks remain legible.<br><br>Formal bearing matters as much as fine clothing. Standing to acknowledge a witness, leaving another speaker room to finish, and presenting a document with clean hands all communicate respect."
   },
   {
    "label": "Upbringing and Milestones",
    "text": "Children learn promises through ordinary responsibilities: returning borrowed tools, delivering messages accurately, and admitting when a task remains unfinished. Many households preserve a young person’s first independently witnessed obligation.<br><br>Public responsibility follows demonstrated judgment, with its timing shaped by ancestry and family custom. Taking an office, joining a household, completing an apprenticeship, and retiring from service are commonly marked by a formal acknowledgment of the duties being accepted or released."
   },
   {
    "label": "Society",
    "text": "Serrovanian institutions depend on recorded responsibilities. Officials swear to the limits of their offices, guilds preserve the terms of their charters, and households keep accounts of debts, inheritances, and obligations. Public scribes and witnesses are familiar figures in markets and village squares.<br><br>Formal challenge gives disputes an accepted shape. The grievance, the contest, and the consequences are declared before witnesses. Some challenges involve arms; others test skill, testimony, or the ability to substantiate a claim. Violence within accepted terms can be lawful. Breaking those terms threatens the trust that made the challenge possible.<br><br>This order has its cruelties. Wealth buys patient advocates, old records can preserve old injustices, and a precisely worded agreement can conceal an ugly intention. Serrovanians argue fiercely over whether justice lies in honoring the record or correcting what should never have been written into it."
   },
   {
    "label": "Beliefs",
    "text": "Serrovanians follow many faiths, but promises, testimony, and remembrance occupy an honored place across them. Shrines often witness marriages, reconciliations, and vows of service. An ancestor may be remembered through an obligation their descendants continue to uphold.<br><br>Mercy also has a recognized dignity. Publicly releasing someone from an oath can be an act of generosity remembered as long as the oath itself."
   },
   {
    "label": "Popular Edicts",
    "text": "• Keep your word when doing so becomes inconvenient.<br>• State your terms before the contest begins.<br>• Stand witness when another needs the truth recorded."
   },
   {
    "label": "Popular Anathemas",
    "text": "• Knowingly swear an oath you intend to break.<br>• Falsify a record entrusted to your care.<br>• Inflict punishment beyond the terms of an accepted challenge."
   },
   {
    "label": "Names",
    "text": "Many Serrovanian surnames take the form of a short promise: something a household declares it will uphold. These names are inherited, and families take particular pride in living up to them. Someone named Speaktrue can expect a lie to be remembered with unusual clarity.<br><br>People commonly retain given names from their family or ancestry. The surnames below are familiar Common translations of Serrovine names.<br><br><b>Common given names</b> Cerran, Dovra, Ilyra, Maroven, Orven, Selka, Tavren, Veyra.<br><br><b>Common surnames</b> Bearwitness, Holdfaith, Keepword, Speaktrue, Standfast.<br><br><b>Example name</b>s Cerran Keepword, Dovra Standfast, Ilyra Speaktrue, Maroven Bearwitness, Selka Holdfaith."
   }
  ],

 "Kestrel Reach": {
  "category": "Culture",
  "enabled": true,
  "feeds": "Wits",
  "lore": [
   {
    "label": "Summary",
    "text": "Reachers thrive where people and possibilities meet, building livelihoods through sharp observation, useful introductions, and bargains worth making again."
   },
   {
    "label": "About",
    "text": "Kestrel Reach spreads across a wide river delta, where channels divide around crowded islands and trade-towns rise above the floodwater. Six languages may be spoken along a single dock, with three more heard by evening. Boats bring unfamiliar goods, travelers bring unfamiliar customs, and someone is always looking for a person who understands both.<br><br>Reachers grow accustomed to difference early. An elven shipwright, a dwarven grain factor, and a human ferryman may share a neighborhood, a business venture, and a running argument about harbor fees. Local knowledge means knowing how people prefer to be approached, which courtesies matter to them, and whom they trust to make an introduction. A good broker can accomplish with an afternoon’s conversation what an armed company might spend a season making worse."
   },
   {
    "label": "If you want...",
    "text": "If you want a character who is comfortable among unfamiliar faces, always listening for an opportunity, and rarely without someone they could ask for help, choose Kestrel Reach."
   },
   {
    "label": "You Might...",
    "text": "Learn a few useful words whenever you encounter a new language.<br>Introduce yourself by naming someone the other person already knows.<br>Look for what each side needs before deciding that a dispute cannot be settled."
   },
   {
    "label": "Others Probably...",
    "text": "Expect you to know a useful contact in almost any port.<br>Wonder whether your friendly questions are leading toward a proposal.<br>Rely on you to notice the custom, omission, or hidden cost they overlooked."
   },
   {
    "label": "Dress and Bearing",
    "text": "Reach clothing reflects crowded docks, changeable weather, and goods arriving from distant places. Practical layers, secure pockets, broad hats, and garments kept clear of ropes are common. Fabrics and ornaments travel freely between communities, adapted to each wearer’s build and family traditions.<br><br>Reachers often display a token of their trade, vessel, or trading house where an acquaintance can recognize it. Greeting gestures vary between neighborhoods, and knowing which one to offer can make a warmer introduction than expensive clothes."
   },
   {
    "label": "Upbringing and Milestones",
    "text": "Young Reachers learn by carrying messages, helping with household business, and accompanying experienced relatives through markets and landing places. They are taught to notice who has spoken, who has been overlooked, and whether everyone understands the same terms.<br><br>A first independently completed bargain or entrusted journey often marks growing responsibility. Its importance lies in returning with the agreement fulfilled and the other party willing to deal with the household again. These milestones follow readiness and circumstance across the Reach’s many ancestries."
   },
   {
    "label": "Society",
    "text": "The delta depends on cooperation that extends beyond individual towns. Ferrymen need maintained channels, merchants need dependable warehouses, and everyone needs the flood banks to hold. Neighborhood associations, trading houses, craft guilds, and harbor officials overlap in a web of favors and competing responsibilities.<br><br>Reputation moves quickly along the waterways. A generous settlement can bring business from three towns away; a cheated customer can arrive ahead of you wherever you hoped to trade next. Brokers earn their standing by remembering details, protecting confidences, and finding terms that people will actually honor.<br><br>The Reach’s friendliness can conceal hard boundaries. Established houses sometimes keep profitable routes among themselves, and an introduction may matter more than an excellent offer. Reachers admire people who open opportunities for others, but they also know how easily a well-connected few can decide who gets a place at the table."
   },
   {
    "label": "Beliefs",
    "text": "Reach shrines welcome travelers, returning crews, and families whose traditions came from elsewhere. River spirits, ancestral patrons, and gods of craft, fortune, and safe passage all receive offerings.<br><br>Many Reachers regard hospitality as an obligation that travels. Someone shelters a stranger today because another household may shelter their own kin tomorrow. Gifts, favors, and acts of kindness create relationships whose value cannot always be entered into an account."
   },
   {
    "label": "Popular Edicts",
    "text": "Learn how to greet people on their own terms.<br>Give the other party a reason to trade with you again.<br>Share a useful introduction when it costs you little."
   },
   {
    "label": "Popular Anathemas",
    "text": "Abuse the protection offered to a guest.<br>Conceal a danger that makes an agreement impossible to fulfill.<br>Betray a confidence entrusted to you as a broker."
   },
   {
    "label": "Names",
    "text": "Reach surnames often come from waterways and shoreline features. A name may remember the bank where a household built its first home, the channel its boats worked, or the landing from which its members scattered across the world. Families carry these names inland long after the river itself has become a distant memory.<br><br>Given names mingle freely across languages and ancestries. The surnames below are commonly used in their Common forms.<br><br><b>Common given names</b> Avi, Dena, Jori, Kes, Lio, Mira, Neris, Orren, Savi, Tavi.<br><br><b>Common surnames</b> Broadwater, Lowbank, Northbank, Reedbank, Siltwater, Stillwater, Three-Tides, Willowbend.<br><br><b>Example names</b> Avi Northbank, Dena Willowbend, Jori Reedbank, Mira Three-Tides, Neris Stillwater, Tavi Lowbank."
   }
  ],

     "text": "Humans reach physical adulthood around 15 years and are usually granted a place at the adults' table by 18, though every town draws that line differently. A human who avoids war, plague, and their own ambition can expect sixty to ninety years, and a rare few see a century. Their short season is the quiet engine of their character; humans plant orchards whose shade they will never sit in, and they know it."
    },
    {
     "label": "Society",
     "text": "Human society is less a single design than a permanent argument about what the design should be. Kingdoms, leagues, free towns, wandering companies: humans have tried them all, usually at the same time, usually within a week's ride of each other. Their gift is the joining of strangers. A human market will seat a dwarven smith beside an elven dyer and a gnomish clockmaker, and by closing time the three will share a ledger and a grudge against the harbormaster.<br><br>Because they invent themselves so freely, humans put enormous weight on names, oaths, and reputations, the few things that outlive them. A human's word, once given before witnesses, is a load-bearing wall; whole towns stand on webs of such promises. Breaking one is not just a sin but a kind of vandalism.<br><br>Humans honor their dead by continuing their projects. Workshops, farms, feuds, and half-built bridges pass from hand to hand like torches, and a human family can often recite what each generation added to the house even when they have forgotten the builders' faces."

    {
     "label": "About",
     "text": "Serrovane is a lowland order-state of cultivated fields, raised roads, and towns gathered around registry halls. Its ledgers are kept in triplicate, its agreements carry witnesses, and its disputes follow forms that everyone is expected to respect. A promise spoken casually may be forgotten. A promise entered into the record becomes something other people can build their lives upon.<br><br>People of many ancestries belong to this order. An elven witness, a dwarven magistrate, and a human challenger may disagree bitterly while trusting the same record. Serrovanians learn how to state a grievance, acknowledge an obligation, and offer a concession without surrendering their standing. They can be formidable negotiators: they know exactly what they have promised, and they expect you to know the same."
    },
    {
     "label": "If you want...",
     "text": "If you want a character who takes promises seriously, understands the power of public reputation, and can turn a few carefully chosen words into a lasting obligation, choose Serrovane."
    },
    {
     "label": "You Might...",
     "text": "• Ask who witnessed an agreement before asking whether it was a good one.<br>• Carry copies of important promises, judgments, or introductions among your belongings.<br>• Insist on settling the terms of a contest before anyone draws a weapon."
    },
    {
     "label": "Others Probably...",

    },
    {
     "label": "Dress and Bearing",
     "text": "Serrovanian clothing favors orderly layers, durable fabrics, and visible signs of affiliation. Household colors, office badges, and witness cords help others recognize whom a person represents. Garments vary with ancestry, occupation, and means, but people generally take care that closures are secure and identifying marks remain legible.<br><br>Formal bearing matters as much as fine clothing. Standing to acknowledge a witness, leaving another speaker room to finish, and presenting a document with clean hands all communicate respect."
    },
    {
     "label": "Upbringing and Milestones",
     "text": "Children learn promises through ordinary responsibilities: returning borrowed tools, delivering messages accurately, and admitting when a task remains unfinished. Many households preserve a young person’s first independently witnessed obligation.<br><br>Public responsibility follows demonstrated judgment, with its timing shaped by ancestry and family custom. Taking an office, joining a household, completing an apprenticeship, and retiring from service are commonly marked by a formal acknowledgment of the duties being accepted or released."
    },
    {
     "label": "Society",
     "text": "Serrovanian institutions depend on recorded responsibilities. Officials swear to the limits of their offices, guilds preserve the terms of their charters, and households keep accounts of debts, inheritances, and obligations. Public scribes and witnesses are familiar figures in markets and village squares.<br><br>Formal challenge gives disputes an accepted shape. The grievance, the contest, and the consequences are declared before witnesses. Some challenges involve arms; others test skill, testimony, or the ability to substantiate a claim. Violence within accepted terms can be lawful. Breaking those terms threatens the trust that made the challenge possible.<br><br>This order has its cruelties. Wealth buys patient advocates, old records can preserve old injustices, and a precisely worded agreement can conceal an ugly intention. Serrovanians argue fiercely over whether justice lies in honoring the record or correcting what should never have been written into it."
    },
    {
     "label": "Beliefs",
     "text": "Serrovanians follow many faiths, but promises, testimony, and remembrance occupy an honored place across them. Shrines often witness marriages, reconciliations, and vows of service. An ancestor may be remembered through an obligation their descendants continue to uphold.<br><br>Mercy also has a recognized dignity. Publicly releasing someone from an oath can be an act of generosity remembered as long as the oath itself."

     "label": "Popular Edicts",
     "text": "• Keep your word when doing so becomes inconvenient.<br>• State your terms before the contest begins.<br>• Stand witness when another needs the truth recorded."

     "label": "About",
     "text": "Kestrel Reach spreads across a wide river delta, where channels divide around crowded islands and trade-towns rise above the floodwater. Six languages may be spoken along a single dock, with three more heard by evening. Boats bring unfamiliar goods, travelers bring unfamiliar customs, and someone is always looking for a person who understands both.<br><br>Reachers grow accustomed to difference early. An elven shipwright, a dwarven grain factor, and a human ferryman may share a neighborhood, a business venture, and a running argument about harbor fees. Local knowledge means knowing how people prefer to be approached, which courtesies matter to them, and whom they trust to make an introduction. A good broker can accomplish with an afternoon’s conversation what an armed company might spend a season making worse."

     "text": "Learn a few useful words whenever you encounter a new language.<br>Introduce yourself by naming someone the other person already knows.<br>Look for what each side needs before deciding that a dispute cannot be settled."

     "label": "Dress and Bearing",
     "text": "Reach clothing reflects crowded docks, changeable weather, and goods arriving from distant places. Practical layers, secure pockets, broad hats, and garments kept clear of ropes are common. Fabrics and ornaments travel freely between communities, adapted to each wearer’s build and family traditions.<br><br>Reachers often display a token of their trade, vessel, or trading house where an acquaintance can recognize it. Greeting gestures vary between neighborhoods, and knowing which one to offer can make a warmer introduction than expensive clothes."
    },
    {
     "label": "Upbringing and Milestones",
     "text": "Young Reachers learn by carrying messages, helping with household business, and accompanying experienced relatives through markets and landing places. They are taught to notice who has spoken, who has been overlooked, and whether everyone understands the same terms.<br><br>A first independently completed bargain or entrusted journey often marks growing responsibility. Its importance lies in returning with the agreement fulfilled and the other party willing to deal with the household again. These milestones follow readiness and circumstance across the Reach’s many ancestries."
    },
    {
     "label": "Society",
     "text": "The delta depends on cooperation that extends beyond individual towns. Ferrymen need maintained channels, merchants need dependable warehouses, and everyone needs the flood banks to hold. Neighborhood associations, trading houses, craft guilds, and harbor officials overlap in a web of favors and competing responsibilities.<br><br>Reputation moves quickly along the waterways. A generous settlement can bring business from three towns away; a cheated customer can arrive ahead of you wherever you hoped to trade next. Brokers earn their standing by remembering details, protecting confidences, and finding terms that people will actually honor.<br><br>The Reach’s friendliness can conceal hard boundaries. Established houses sometimes keep profitable routes among themselves, and an introduction may matter more than an excellent offer. Reachers admire people who open opportunities for others, but they also know how easily a well-connected few can decide who gets a place at the table."
    },
    {
     "label": "Beliefs",
     "text": "Reach shrines welcome travelers, returning crews, and families whose traditions came from elsewhere. River spirits, ancestral patrons, and gods of craft, fortune, and safe passage all receive offerings.<br><br>Many Reachers regard hospitality as an obligation that travels. Someone shelters a stranger today because another household may shelter their own kin tomorrow. Gifts, favors, and acts of kindness create relationships whose value cannot always be entered into an account."

    {
     "label": "Popular Edicts",
     "text": "Learn how to greet people on their own terms.<br>Give the other party a reason to trade with you again.<br>Share a useful introduction when it costs you little."

     "text": "Abuse the protection offered to a guest.<br>Conceal a danger that makes an agreement impossible to fulfill.<br>Betray a confidence entrusted to you as a broker."

  if(node.root&&ORIGINCATS.includes(treeOf(t).category)) return {ok:false,why:"identity roots come from your chargen choices, never from points"};
  const par=parentOf(t); // v4.21 (ruling 127): a group's Talent waits on its parent's Root, which is where its rank lives
  if(par&&!rootOwned(ch,par)) return {ok:false,why:`a ${groupWord(t)} within ${par}: requires ${rootNameOf(par)}`};
  const root=treeOf(t).nodes.find(x=>x.root);
  if(root && !ownsTalent(ch,t,root.name) && node.name!==root.name) return {ok:false,why:"requires "+root.name};
  if(node.requires&&node.requires.length&&!node.requires.some(rq=>(ch.talents[t]||[]).some(o=>nrmG(o)===nrmG(rq))))
    return {ok:false,why:"requires "+node.requires.join(" or ")};
  const after=rankOf(ch,t,1);
  if(!after || ORDER.indexOf(node.tier)>ORDER.indexOf(after)) return {ok:false,why:TIERN[node.tier]+" locked (points/level gate)"};
  if(node.name.includes("★") && !(ch.talents[t]||[]).some(n=>{const nd=treeOf(t).nodes.find(x=>x.name===n); return nd&&nd.tier==="M";}))
    return {ok:false,why:"capstone needs a Master talent here first"};
  return {ok:true};
}

const NOARMOR=()=>({Head:null,Torso:null,Arms:null,Legs:null});
function migrate(c){ // older saves predate zone armor, Callings on the sheet, Vigor, Wounds by Zone, and several renames
  if(!c.armor) c.armor=NOARMOR();
  if(c.shield===undefined) c.shield=null;
  if(c.exposed===undefined) c.exposed={};
  if(c.dying===undefined) c.dying=0;
  if(!Array.isArray(c.log)) c.log=[]; // the notes below, and the sheet's level-up and spend, all push here
  if(c.pressed!==undefined) delete c.pressed; // v3.0 retired Pressed; a Graze Exposes a Zone instead
  if(c.wornArmor!==undefined) delete c.wornArmor; // the "+3 budget" armor model is retired
  if(c.heritage&&!c.bloodline){ c.bloodline=c.heritage; delete c.heritage; } // v3.0 rename
  // v4.10: Hit Points became Vigor. The keys move; the numbers carry across untouched.
  if(c.hpCur!==undefined){ if(c.vigorCur===undefined) c.vigorCur=c.hpCur; delete c.hpCur; }
  if(c.hpTmp!==undefined){ if(c.vigorTmp===undefined) c.vigorTmp=c.hpTmp; delete c.hpTmp; }
  if(c.vigorCur===undefined) c.vigorCur=null;
  if(c.vigorTmp===undefined) c.vigorTmp=0;
  // v4.10: Wounds are per Zone. The numeric Wounded value has no Zone to land on, so it is dropped and logged.
  if(!c.wounds||typeof c.wounds!=="object") c.wounds={Head:0,Torso:0,Arms:0,Legs:0};
  if(c.wounded!==undefined){
    if(+c.wounded>0) (c.log=c.log||[]).push(`v4.10 migration: the numeric Wounded ${c.wounded} is retired. Wounds are now tracked by Zone, and none were carried across.`);
    delete c.wounded; }
  const RENAME={"Fortitude":"Endure","Reflex":"Evade","Will":"Guard","Rage":"Berserker",
                "Keleshite":"Kestrel Reach","Chelaxian":"Serrovane", // style-ok: retired names, named here only to rename them away
                "Weapons":"Melee"}, // v4.10: the Weapons Constellation split into the Melee and Ranged parents
        TALENT={"Fortitude Training":"Endure Training","Reflex Training":"Evade Training",
                "Will Training":"Guard Training","Simple Weapons Training":"Melee Training","Weapons Training":"Melee Training",
                // v4.21: the five Calling roots are named "<Calling> Calling"; a save written before carries the old root names
                "SNEAK ATTACK (spine)":"Ambusher Calling","Sneak Attack":"Ambusher Calling","RAGE ◆ (spine)":"Berserker Calling","Rage":"Berserker Calling","Rage ❶":"Berserker Calling",
                "Panache":"Bravo Calling","Mark Prey ❶":"Hunter Calling","Mark Prey":"Hunter Calling","Drilled":"Weaponmaster Calling",
                "Human":"Humanity","Keleshite":"Reacher","Chelaxian":"Serrovanian", // style-ok: same, talent-level
                "Skirmisher’s Step":"Skirmisher's Step"};

    if(!c.talents[was]) continue;

    delete c.talents[was];
    if(c.sparks&&c.sparks[was]){ c.sparks[now]=true; delete c.sparks[was]; }
  }
  for(const t of Object.keys(c.talents)) c.talents[t]=c.talents[t].map(n=>{ const g=glyphs(TALENT[n]||n); return TALENT[g]||TALENT[nrmG(g)]||g; }); // the rename map is tried on the written name, the modern-glyph name and the bare name
  // v4.10: talents the book moved to another constellation (sync report, ruling 23b). The talent
  // moves with its point; matched bare so an old-glyph save still lands.
  const MOVED={"Archery":{"Loose and Move":"Ranged"}};

    if(!c.talents[from]) continue;

  }

  // trees) and pruned tiers. A name that isn't authored and isn't a legal placeholder would
  // otherwise fall through to the generic stub and quietly feed Wits forever. Names are matched

  // and both are logged, since a bare Zone is something the player should know about.
  const ARMOR_RENAME={"leather cap":"Leather Helm","leather cuirass":"Leather Cuirass","leather bracers":"Leather Armguards","leather leggings":"Leather Legguards",
    "scale coif":"Mail Hood","scale hauberk":"Lamellar Armor","mail coif":"Mail Hood","mail hauberk":"Mail Shirt","mail sleeves":"Mail Sleeves","mail chausses":"Mail Leggings",
    "breastplate":"Plate Cuirass","closed helm":"Full Helm","open helm":"Open Helm","vambraces":"Plate Armguards","greaves":"Plate Legguards",
    "gambeson":"Heavy Gambeson","padded coif":"Padded Hood","padded sleeves":"Padded Sleeves","padded leggings":"Padded Leggings"};

  if(c.calling===undefined||c.calling===null){

    c.calling=t||null;
  }
  return c;
}

// ---------- wizard ----------
let wiz=null;
// v4.21 chargen: 0 Begin · 1 Ancestry · 2 Bloodline · 3 Culture · 4 Background
//                5 Calling · 6 Defenses · 7 Comets · 8 Review
// Step 0 is the introduction and grants nothing (the "Trained in Melee or Ranged" sentence left the book
// in v4.21). The three Origin roots (Ancestry, Bloodline, Culture) are Origin Talent Points granted by the
// choices themselves, so those steps ask for no spending. The first Calling grants its combat training on
// step 5: a martial Calling opens Melee or Ranged, a caster opens a magical discipline, the player's pick.
// The book counts a minimum of 13 Talent Points for a finished 1st-level character (3 Origin, 2 Skill,
// 1 Lore, 1 Calling, 1 Martial or Magical, 2 Defense, 3 Comets); every Calling's root also says "You
// become Trained in <a Skill>", so the wizard places that point too. See PHB v4.21 ch.3.
const rootNamed=(tree,nm)=>!!tree&&treeOf(tree).nodes.some(n=>(n.root||n.hroot)&&n.name===nm);
// What the first Calling's combat training may open (v4.21: the root's own "If this is your first Calling"
// clause names the Constellations; a root that names none offers Melee or Ranged).
function combatOptions(cn){
  if(!cn) return [];
  const rt=treeOf(cn).nodes.find(n=>n.root), txt=stripT(rt?rt.effect:""), i=txt.indexOf("first Calling");
  const tail=i>=0?txt.slice(i):"", m=/Training in ([^.]+)/i.exec(tail), named=m?m[1]:"";
  const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const opts=[...MARTIAL,...magicParents()].filter(t=>new RegExp("\\b"+esc(t)+"\\b","i").test(named));
  return opts.length?opts:[...MARTIAL];
}
// Spellblade's Special: Trained in Melee or Ranged as well, by the end of character creation
const needsMartialToo=cn=>{ const rt=cn&&treeOf(cn).nodes.find(n=>n.root); return !!rt&&/Trained in either Melee or Ranged/i.test(stripT(rt.effect)); };
function grantSourceStep(nm){
  const p=wiz.picks, has=(l,n2)=>(l||[]).some(id=>id.endsWith("||"+n2));
  const anc=wiz.ch.ancestry?ancTreeName():null;
  if(p.her===nm) return 2;                       // bloodline root: free with the bloodline choice
  if(anc&&rootNamed(anc,nm)&&nm!==p.her) return 1;
  if(p.culName&&rootNamed(p.culName,nm)) return 3;
  if(has(p.bgA,nm)||has(p.bgB,nm)||has(p.bgLore,nm)) return 4;
  if(has(p.calling,nm)||has(p.calSkill,nm)) return 5;
  if(has(p.def,nm)) return 6;
  return 7;
}
function grantPickersHTML(stepNo){
  const gch=wizCh(null); wiz.picks.tg=wiz.picks.tg||{}; let h="";
  for(const t2 of Object.keys(gch.talents)) for(const nm2 of gch.talents[t2]){
    const nd=treeOf(t2).nodes.find(x=>x.name===nm2); if(!nd||!nd.grant) continue;
    if(grantSourceStep(nm2)!==stepNo) continue;
    const gr=nd.grant; wiz.picks.tg[nm2]=wiz.picks.tg[nm2]||[];
    const scopeTrees=gr.mode==="open"
      ?allTreeNames().filter(n=>{const c2=treeOf(n).category; return (gr.scope!=="non-Skill"||c2!=="Skill")&&!ORIGINCATS.includes(c2)&&pointsIn(gch,n)===0;})
      :gr.scope==="opened"?allTreeNames().filter(n=>pointsIn(gch,n)>0):allTreeNames().filter(n=>treeOf(n).category===gr.scope);
    h+=`<div class="callout"><b>${nm2.replace(" ★","")}</b> grants <b>${gr.n} point${gr.n>1?"s":""}</b>: ${gr.mode==="open"?`to open any ${gr.scope==="non-Skill"?"non-Skill ":""}constellation you haven't started (the point buys its root)`:gr.scope==="opened"?"in any constellation you've opened":(gr.mode==="one"?`in one ${gr.scope} of your choice (all in the same one)`:gr.mode==="different"?`in ${gr.n} different ${gr.scope}s`:`in any ${gr.scope}`)}. Spend now. <span class="pill">${wiz.picks.tg[nm2].length}/${gr.n}</span></div>`;
    h+=talentPicker([...new Set([...scopeTrees, ...wiz.picks.tg[nm2].map(x=>x.split("||")[0])])], wiz.picks.tg[nm2], "tg:"+nm2, gr.n, ()=>wizCh(null));
  }
  return h;
}
function stepComplete(sn){
  if(stepGate(sn)) return false;
  return pools().filter(x=>x.step===sn&&x.ready).every(x=>x.spent>=x.need);
}
function stepGate(s){ // only IDENTITY choices gate movement (points can be spent whenever)
  const p=wiz.picks;
  if(s===1&&!wiz.ch.ancestry) return "choose an ancestry";
  if(s===2&&!p.her) return "choose a bloodline";
  if(s===3&&!p.culName) return "choose a culture";
  if(s===4&&!p.bg) return "choose a background";
  if(s===5&&!p.calName) return "choose a calling";
  return "";
}
// the ONLY structural dependency: bloodlines live inside your ancestry's constellation.
// everything else — culture, background, free points, review — is visitable in any order.

function pools(){ // every talent point the wizard grants: where it may go, and whether it's placed

function saveBlockers(){

  if(pair.length){
    if(badIn(p.bgA,pair[0])) out.push({step:4,msg:`your ${pair[0]} Training must be spent in ${pair[0]}`});
    if(pair[1]&&badIn(p.bgB,pair[1])) out.push({step:4,msg:`your ${pair[1]} Training must be spent in ${pair[1]}`});
  }
  if(lore&&badIn(p.bgLore,lore)) out.push({step:4,msg:`your Lore Talent Point must be spent in ${lore}`});
  const cs=calSkillName();
  if(cs&&(p.calSkill||[]).some(id=>id.split("||")[0]!==cs))
    out.push({step:5,msg:`your Calling's Training must be spent in ${cs}`});
  if(p.calName&&(p.calling||[]).some(id=>id.split("||")[0]!==p.calName))
    out.push({step:5,msg:`the Calling point goes in ${p.calName}`});

    if(!p.combat) out.push({step:5,msg:`choose the combat training your Calling grants (${co.join(" or ")})`});
    else if(!co.includes(p.combat)) out.push({step:5,msg:`${p.calName} opens ${co.join(" or ")}, not ${p.combat}`});
    if(needsMartialToo(p.calName)){ const gch=wizCh(null);
      if(!MARTIAL.some(t=>rootOwned(gch,t))) out.push({step:7,msg:`${p.calName} must also be Trained in Melee or Ranged by the end of creation: spend a Comet on Melee Training or Ranged Training`}); } }

  if(new Set(defT).size<defT.length)

    const gr=nd.grant, ts=list.map(id=>id.split("||")[0]);
    if(gr.mode==="open"){

        if(gr.scope==="non-Skill"&&tr2.category==="Skill") out.push({step:grantSourceStep(nm2),msg:`${nm2}'s point opens a non-Skill constellation`});
        else if(ORIGINCATS.includes(tr2.category)) out.push({step:grantSourceStep(nm2),msg:`${nm2}'s point opens a constellation outside your Origin`});
        else if(!rt2||nrmG(rt2.name)!==nrmG(n2)) out.push({step:grantSourceStep(nm2),msg:`${nm2}'s point must buy a constellation's root (it opens it)`}); }
    } else if(gr.scope!=="opened"&&gr.scope!=="anywhere"&&ts.some(t2=>treeOf(t2).category!==gr.scope))
      out.push({step:grantSourceStep(nm2),msg:`${nm2}'s grant goes in a ${gr.scope}`});
    if(gr.mode==="one"&&new Set(ts).size>1) out.push({step:grantSourceStep(nm2),msg:`${nm2}'s points must all land in the same ${gr.scope}`});
    if(gr.mode==="different"&&new Set(ts).size<list.length) out.push({step:grantSourceStep(nm2),msg:`${nm2}'s points must land in different ${gr.scope}s`});

  return out;
}

  }
  h+=`<h3>&#9889; Flares</h3><p class="muted" style="font-size:11px;line-height:1.45">${UNIFLARE}</p>${t.sparks?`<p class="muted" style="font-style:italic;font-size:10.5px;line-height:1.4;margin-top:3px">Examples: ${t.sparks}</p>`:""}
    <p class="muted" style="margin-top:10px;font-size:10.5px">Gates: Expert L${g.E} • Master L${g.M} • Legendary L${g.L}. Ranks at 1/4/9/16 pts: +${RB.T}/+${RB.E}/+${RB.M}/+${RB.L}${par?`, counted in ${par}`:""}.</p>`;

    +tbl(["Maneuver","Cost","Traits","Effect"],acts.filter(a=>a.type===t).map(a=>[`<b>${a.name}</b>`,costOf(a),(a.traits||[]).join(", "),
      (a.requirements?`<b>Requirements</b> ${a.requirements}<br>`:"")+(a.trigger?`<b>Trigger</b> ${a.trigger}<br>`:"")+(a.description?`<i>${a.description}</i><br>`:"")+a.effect]))).join("");
  const threatTbl=()=>tbl(["Threat","Answered by","Or by"],THREATS.map(([k,a,b])=>[`<b>${k}</b>`,link(a),link(b)]));

  if(wikiSec==="How to Play") h+=`
    <div class="callout"><b>Check = d20 + Attribute Bonus + Proficiency Bonus + bonuses &amp; penalties</b> (Situation, Condition, Gear). One formula for everything. A tenth-level character is not better at everything because a number went up; they are better at the things they have actually done. Your Attribute Bonus is raw talent. Your Proficiency Bonus is what training adds on top: the bonus from your rank in whichever Constellation the task belongs to, and simply +0 if you have no rank there at all. <b>Level opens the door to higher ranks and pays out Talent Points; it never touches the die.</b> Independent bonuses and penalties add up, whatever their type; each circumstance counts once.</div>
    <div class="callout" style="border-color:#B8860B"><b>The player always rolls.</b> Instead of the GM rolling dice secretly behind a screen, the player rolls to find out whether something succeeded or failed, so creatures carry Thresholds for most of what they do: an Initiative Threshold, a Claws Strike Threshold, a Guard Threshold, an Evade Threshold, and so on. A <b>Threshold</b> is ten plus the modifier of the check it stands in for: 10 + Attribute Bonus + Proficiency Bonus, plus any bonuses and penalties that apply. A creature (a character included) whose Guard is +7 therefore has a Guard Threshold of 17. If two players are opposed (one player attacks another, say), the player initiating the Maneuver rolls.</div>

    ${P("One ladder and one gate schedule for every Constellation. Rising in rank needs <b>both</b> the points and the level. Every Constellation begins with a root: buying it is what makes you Trained, and nothing in a Constellation can be bought before it. Many Talents are tier-gated: an Expert Talent requires Expert rank.")}
    <div class="callout"><b>Constellations and groups.</b> ${link("Melee")} and ${link("Ranged")} are separate martial Constellations, and each magical discipline (${magicParents().map(link).join(", ")||"none in the data yet"}) is a Constellation of its own. A <b>Combat Style</b> is a group of Talents within Melee or Ranged, and a <b>magical specialty</b> a group within its discipline: a group shares its Constellation's Proficiency Rank and has none of its own, and every Talent you buy in it counts toward that rank once the Constellation's root is yours. Its Talents must still be bought for their effects, and a Talent feeds its Attribute once. Your Ancestry, Bloodline, and Culture likewise contribute to one shared <b>Origin</b> rank. When you Strike, roll Melee for a melee Strike and Ranged for a ranged one, a thrown dagger included; when you Cast, roll the spell's discipline.</div>

    ${P("Might is muscle, endurance, and raw force. Agility is speed, balance, and precision. Wits is perception, memory, and fast thinking. Presence is raw nerve, willpower, and weight of personality. You never buy them and never roll them up: every Talent feeds one, and <b>your bonus is the points you've spent in its Talents ÷ 4, rounded down</b>, to a maximum of +5.")}
    ${tbl(["Attribute points","Bonus"],[["0–3","+0"],["4–7","+1"],["8–11","+2"],["12–15","+3"],["16–19","+4"],["20+","+5 (the maximum)"]])}

      ["Vigor","Ancestry Vigor + your first Calling's Opening Vigor + 10 at 1st level; add Ancestry Vigor again at every level after. (The book's formula still names an Endure Bonus; Endure Training grants none since v4.21, so it is 0.)"],

      ["Deliberate ❷ or Committed ❸ Hit","[the rank's weapon dice (1 Trained, 2 Expert, 3 Master, 4 Legendary) + Might + bonuses &amp; penalties] − Protection"],
      ["Quick ❶ Hit","one weapon die − Protection; precision or other extras only where a Maneuver or Talent allows them"],
      ["Graze","the damage the Maneuver prints: one weapon die for a Strike, less Protection"],
      ["Initiative","usually an Awareness check, or whatever you were actually doing (Stealth, if you were creeping)"],
      ["Speed","feet per Move ❶; a Human's is 6. Step ❶ is half your Speed; Rush ❷ is 3 × Speed in a straight line, less Load Strain"],
      ["Load Strain","the Load of the armor you wear and of a shield you carry, less 1 for a Fitted harness and less your Endure relief (1 at Trained, 2 at Expert, 3 at Master, 4 at Legendary), minimum 0. Never off Evade: a Condition penalty on Stealth, Acrobatics, Climb, and Swim checks, and it shortens Rush and Leap in feet"],
      ["Rest","a full night's rest restores all of your Vigor; ten minutes' rest restores level × Presence when that is positive. Wounds do not rest away."]])}
    <h3>Bonuses and penalties</h3>
    ${P("Three types, named for where the number comes from. A <b>Situation</b> bonus or penalty comes from where you stand and what is happening around you: cover, high ground, an ally's help, a foe Off-Guard. A <b>Condition</b> bonus or penalty comes from something on you: Frightened, Fatigued, or a stance you have taken. A <b>Gear</b> bonus or penalty comes from what you hold or wear: a raised shield, a lowered visor. <b>Independent bonuses and penalties stack, whatever their type</b>: add every modifier that applies to find the check's total. The types name where a modifier comes from; they do not limit stacking. Count each underlying circumstance or effect only once: if two rules describe the same benefit or penalty, apply only its strongest version, and the GM resolves the uncertain cases. Fractions always round down, and multipliers combine by addition: count how far past 1 each takes you, add those, and apply the result once.")}

    ${P("Start each session with 1 (maximum 3; the GM awards more for heroism, clever play, and beautiful failure). Spend 1 to <b>reroll a check</b>, taking the new result. Spend all of them (minimum 1) to refuse death: that is not a roll, it cannot fail, and nothing in the game can stop it.")}
    <h3>The round</h3>
    ${P("A round is about six seconds. At the start of each round every combatant receives <b>six actions</b>; unspent actions expire at the end of the round, with no banking and no borrowing. Initiative order is fixed for the encounter, and play cycles through it repeatedly. Each time the order reaches you, you have an <b>Opportunity</b>: perform <b>one Maneuver</b> you can afford, begin or finish a Prepared Maneuver, or <b>Pass</b>. Pay its cost and play moves to the next combatant; you cannot chain two Maneuvers in one Opportunity. A ⓿ Maneuver costs nothing and never uses up your Opportunity. <b>Reactions ↺</b> are Maneuvers performed outside your Opportunity, the moment their Trigger occurs, paid from the same six. A Maneuver of ❸ or more is <b>Prepared</b>: spend one action now, reserve the rest, and it resolves at your next Opportunity. When a full circuit goes by in which everyone Passes, the round ends. A second or third attack in a round costs no penalty on the die; tempo is paid in actions, and six uninterrupted attacks is what a corpse looks like.")}
    ${tbl(["Symbol","Meaning"],[["❶ ❷ ❸ ❹ ❺ ❻","one to six actions"],["⓿","free: no actions, and it never uses up your Opportunity"],["↺","the Reaction trait: usable in answer to its Trigger, at the listed action cost (❶↺, ⓿↺)"]])}
    <h3>Conventions</h3>
    ${P("<b>The player rolls.</b> The GM does not roll behind a screen; monsters carry Thresholds instead, for Initiative, for each attack, and for each Defense. If two players are opposed, the player initiating the Maneuver rolls. <b>Player knowledge is not character knowledge</b>: you may know your Awareness roll was low, but your character does not. <b>Specific beats general</b>: the general rule is that you cannot Step into Difficult Terrain, but the Skirmisher's Step Talent lets you. In all cases the GM has the final decision on the results of rolls and the interpretation of rules, at least during the session.")}`;

  if(wikiSec==="Creating a Character") h+=`
    <div class="callout">Your first Constellation is yourself. Ancestry, Bloodline, and Culture merge into one sky, your <b>Origin</b>, and their three roots are granted by the choices themselves. Your <b>first Calling</b> grants its listed benefits and <b>combat-related training</b>: Melee or Ranged for a martial Calling, a magical discipline for a caster. You also begin <b>Trained in two of the four Defenses</b> (Awareness, Evade, Guard, and Endure). During character creation the normal Flare requirements do not apply.</div>
    ${tbl(["Step","You choose…","You get…","Talent Points"],(R.chargenSteps||[]).map(r=>r.map(x=>String(x).replace(/\n/g,"<br>"))))}
    <div class="callout" style="border-color:#B8860B"><b>Keyword: become Trained in.</b> When an effect says you become Trained in a Constellation, you gain a talent point that must be spent in that Constellation. If it isn't open yet, the point buys the Training root, and that purchase <i>is</i> becoming Trained. Already open? The point buys any talent there you qualify for. If there is nothing there you qualify for, you instead become Trained in a Constellation of your choice. Talent Points are spent the moment you receive them; none is ever saved for later.</div>
    <h3>Defenses</h3>
    ${P("At 1st level you gain <b>2 Defense Talent Points</b>. Choose wisely: each Defense answers two of the four kinds of threat (Blows, Blasts, Blights, Beguilement), and each kind is answered by two Defenses. Two Trained Defenses cover three kinds; choose the pair whose gap you can live with. A Defense you leave Untrained still adds its Attribute, but every Threshold that depends on it is 3 lower.")}
    ${threatTbl()}
    <h3>What a finished 1st-level character has</h3>
    ${P("A minimum of <b>13 Talent Points</b> spent: 3 Origin (1 Ancestry, 1 Bloodline, 1 Culture); 2 Skill and 1 Lore from your Background; 1 Calling; 1 Martial or Magical, granted by your first Calling; 2 Defense; and 3 Comets. Some choices grant additional Talent Points, so your total may be higher: every Calling's root also makes you Trained in a Skill, and the wizard places that point too.")}
    <h3>Finishing up</h3>
    ${P("<b>Vigor</b> at 1st level is 10 + your first Calling's Opening Vigor + your Ancestry's Vigor; the Ancestry's share is added again at every level, the Opening Vigor only once. <b>Attribute Bonuses</b>: total your points per Attribute (each Constellation feeds one); Attribute Bonus = points ÷ 4, rounded down. <b>Proficiency and checks</b>: note your rank (almost always Trained, +3) in each Constellation you own, and work out your Strikes and Defenses from their Attributes and Proficiency Bonuses. <b>Gear</b>: you begin with 15 gold pieces, plus a travelling kit (pack, bedroll, rope, a week's rations, torches, flint, waterskin, the tools of your trade) that costs coppers and needs no tracking. <b>Equipment adjustments</b>: record Protection by Zone, Load Strain, and your weapons, and recheck the totals they touch before play.")}
    ${P("Fifteen gold does not buy a complete plate harness: a Full Helm, Plate Cuirass, Plate Arms, and Plate Legs are Load 8 (Load Strain 7 with the Fitted harness) and 62 gp. <b>Everyone starts the game with gaps in their armor, and deciding where those gaps go is your first real equipment decision.</b>")}`;

  if(wikiSec==="Ancestries") h+=`<div class="callout">Your Ancestry is the body you were born in: it forms the trunk of your Origin, and sets your Vigor per level, Size, Speed, and one special ability. Its root is an Origin Talent Point granted by the choice. Your <b>Bloodline</b> is the lineage inside it, and adds a branch.</div>`
    +tbl(["Ancestry","Vigor/lvl","Size","Speed (ft per Move)","Senses","Traits","Key attribute"],R.ancestries.map(a=>[link(a.tree),ancVigor(a),a.size||"Medium",feet(a.speed)+" ft",a.senses||"—",(a.traits||[]).join(", ")||"—",treeOf(a.tree).feeds||"—"]))
    +R.ancestries.map(a=>{
      const tr=treeOf(a.tree), hs=(tr.nodes||[]).filter(n=>n.hroot);
      const rows=hs.length?hs.map(n=>[`✧ ${n.name}${n.feeds?` <span class="muted">(${n.feeds})</span>`:""}`, n.effect]):(a.bloodlines||a.heritages||[]);
      return `<h3>${a.name}: Vigor ${ancVigor(a)} • ${a.size||"Medium"} • Speed ${feet(a.speed)} ft${a.senses&&a.senses!=="—"?" • "+a.senses:""}</h3>
      <p style="font-size:12px;font-style:italic;color:#4a5c66">${a.blurb}</p>
      ${rows.length?tbl(["Bloodline (choose one; root granted free)","Grants"],rows):""}
      <p class="muted">Ancestry Constellation: ${link(a.tree)}</p>`;}).join("");

  if(wikiSec==="Cultures") h+=`<div class="callout">Culture is deliberately separate from Ancestry: an orc raised among Serrovanians is simply both. Choosing a Culture grants its root free, and that root is always a language plus a scaled bonus to Diplomacy toward those who share it. You can embrace or reject your Culture, but you can't unlearn its language.</div>`
    +tbl(["Culture","Language(s)","Key attribute","About"],(R.cultures||[]).map(c=>[link(c.tree||c.name),c.languages||"—",c.attribute||(treeOf(c.tree||c.name).feeds||"—"),c.blurb||""]))
    +P("The Diplomacy bonus scales with your Origin Constellation: +1 while Trained, +2 at Expert, +3 at Master, +4 at Legendary.")
    +(R.cultures||[]).map(c=>`<h3>${c.name}</h3>
      <p style="font-size:12px;font-style:italic;color:#4a5c66">${c.blurb||""}</p>
      <p class="muted">Languages: ${c.languages||"—"}</p>
      <p class="muted">Culture Constellation: ${link(c.tree||c.name)}</p>`).join("")
    +(typeof LANGS!=="undefined"&&LANGS&&LANGS.length?`<h3>Languages</h3>`+tbl(["Language","Rarity","About"],LANGS.map(l=>[l.name,l.rarity,l.desc||"—"])):"");

  if(wikiSec==="Backgrounds") h+=`<div class="callout">Your life before the road: each Background gives you Training in <b>two</b> Skills that its trade leans on, and <b>1 Relevant Lore</b>. That is 2 Skill Talent Points and 1 Lore Talent Point, three of the thirteen you get at creation. The Lore is the player's pick, one relevant to the life the Background describes; the table shows each Background's usual one, which the wizard offers by default.</div>`
    +tbl(["Background","Skills (1 point each)","Relevant Lore (1 point; the usual pick)","You were…"],
      (bgData()||[]).map(b=>[b.name,(b.skills||[]).map(link).join(" & "),b.lore?link(b.lore):"—",stripT(b.desc)]));

  if(wikiSec==="Callings") h+=`<div class="callout">Callings are what other games call classes, except the signature feature sits at the <b>root</b>, so your very first point buys the fantasy. 'Barbarian' was never a job. It was Rage plus Athletics plus a big axe. Now it's yours in any combination or permutation. Each Calling grants Training in 1 Skill or other Constellation, gives you a special ability, and adds Vigor (if it is your first Calling). Your <b>first Calling also grants its combat training</b>: a martial Calling opens Melee or Ranged, your choice; a caster opens one of the five magical disciplines; a Spellblade opens a discipline and must be Trained in Melee or Ranged as well by the end of creation.</div>`
    +tbl(["Calling","Free Training","Opening Vigor","Key attribute","First Calling opens","Special ability"],
      (R.callings||[]).map(c=>[link(c[0]),link(c[1]),c[2],c[3],(TREES[c[0]]?combatOptions(c[0]):MARTIAL).length>2?"a magical discipline":(TREES[c[0]]?combatOptions(c[0]):MARTIAL).join(" or "),c[4]]))
    +P("Only your <b>first</b> Calling adds its Opening Vigor and its combat training, once, at 1st level, however many you open later. A second Calling, bought later with a Comet or through a Flare, brings its Skill Training and its special ability.");

  if(wikiSec==="Defenses") h+=`<div class="callout">There are a multitude of ways you can attack your foes, and they have just as many for you. There are four ways to answer them. Your four Defenses are Constellations like any other. You begin play <b>Trained in two of them</b>, your choice, and the other two are Untrained until you spend Defense Talent Points on them; an Untrained Defense still adds its Attribute, it simply has no Proficiency Bonus. Each works two ways: your check is what you roll, and your Threshold is what someone else has to beat.</div>`
    +tbl(["Defense","Key attribute","In a word","Answers","Also answers"],
      (R.defenses||[]).map(dd=>[link(dd[0]),dd[1],dd[2],dd[3],dd[4]]))
    +`<h3>The Four Threats</h3>`
    +P("Every threat is one of four kinds, and every kind is answered by two of the four Defenses. When a rule names a single Defense, roll that one; when it names a kind of threat, or names nothing, the defender chooses either of the two.")
    +threatTbl()
    +P("The wheel closes on the Attributes: Guard (Presence) meets Blows and holds its nerve against Beguilement; Evade (Agility) slips both Blows and Blasts; Endure (Might) stands through Blasts and Blights; Awareness (Wits) catches Blights early and sees through Beguilement. Each Defense you train covers two kinds of threat. Two Trained Defenses cover three and leave one where you roll your Attribute alone; that gap is yours to choose. A ranged Blow or an attack with an area is met by Guard only with a shield Raised, and Shield Block answers only what a shield can plausibly catch.")
    +`<h3>Answering an attack: the basic roll, or a Reaction</h3>`
    +P("You may always roll one of the two Defenses that answer the threat, regardless of how many actions you have remaining; the basic Defense costs no actions even when your pool is empty. That roll is your <b>basic defense</b>: ordinary footwork, guard position, constitution, alertness. For the potential to do better, you use a <b>Reaction ↺</b>: a Maneuver performed the moment its Trigger occurs, paid for from the same pool of six actions you attack with. Every Reaction is granted by a Talent; without the Talent, the basic roll is all you have. A fighter who spends five actions attacking has one left to defend with; a fighter who holds three has answers. You may React before your first Opportunity of the round, and as often in a round as you can afford. At 0 actions you still roll your basic Defense, and you may still use a ⓿↺ Reaction you qualify for. <b>A Reaction never triggers another Reaction</b>, and an Attack made as part of a Reaction is met with the basic Defense alone.")
    +tbl(["Reaction","Granted by • Defense","Effect"],notSheet(R.postures))
    +P("<b>Postures</b> are ⓿↺ Reactions granted by Talents, commonly from the Evade and Guard Constellations. A Posture costs no actions but carries the drawback its description names, whether or not it improves the outcome: usually a Zone of your choice Exposed until the end of the round, which Recenter does not clear. You answer an attack with one Reaction, and a Posture is one, so Parry and Set Your Feet are not combined against the same blow.")
    +`<h3>Size</h3>`
    +P("Creatures take an innate penalty to Evade or Guard against physical Attacks based on size. A small fighter is a worse wall; a large one is easier to find.")
    +tbl(["Size","Space / token","Natural Reach","Effect on Evade & Guard"],(R.sizes||[]));

  if(wikiSec==="Skills & Styles") h+=`<div class="callout">Instead of skills, classes, and feats, everything a character can do grows on Talent Constellations. Enter any one by spending 1 point on its Root Talent; total investment sets your rank; rank unlocks deeper tiers.</div>
    <h3>Skill Constellations</h3>`
    +tbl(["Skill","Key attribute","Covers"],R.skillRoster.map(s=>[link(s[0]),s[1],s[2]]))
    +P("The <b>Lore</b> Constellation is a template: every Lore you take, Lore (Circus) or Lore (Warfare) or any other, is its own copy of it, so a character can grow several Lores side by side.")
    +`<h3>Melee, Ranged, and the Combat Styles</h3>`
    +`<div class="callout"><b>A Combat Style is a school of exploits, not your attack bonus.</b> Strikes always use your Melee or Ranged Proficiency. A Combat Style is a group of Talents within Melee or Ranged: it shares that Constellation's Proficiency Rank and has none of its own, every Talent you buy in it counts toward that rank once the Constellation's root is yours, and a Talent feeds its Attribute once. A Maneuver a Combat Style grants may use the Style's Key Attribute for its Strike when that is higher than the weapon's, provided you meet the Maneuver's Requirements. A Flare on a Combat Style records that style, and a Milestone point spent through it buys there.</div>`
    +tbl(["Style","Key attribute","Fights with","A group within"],R.weaponStyles.map(w=>[link(w[0]),w[1],w[2].replace(/ A group of Talents within .*$/,""),link(parentOf(w[0])||"—")]))
    +P(`A martial Calling's first-Calling grant opens ${link("Melee")} or ${link("Ranged")}, your choice. Melee represents transferable fundamentals: measure, timing, reading an opponent, footwork, maintaining guard, committing to a strike. Ranged represents what transfers between every weapon that leaves the hand: judging distance, timing a release, leading a moving target, and shooting past friends. A dagger uses Melee in your hand and Ranged in the air.`)
    +`<div class="callout" style="border-color:#B8860B"><b>Strike = d20 + your Strike Attribute + Melee or Ranged Proficiency Bonus.</b> A melee Strike uses <b>Might, or Agility if the weapon has the Finesse trait</b>. A ranged Strike uses <b>Agility, or Might if the weapon has the Thrown trait</b>, and rolls Ranged proficiency, a thrown dagger included. A Strike made as part of another Maneuver still uses the appropriate proficiency; if that Maneuver's Key Attribute has a higher bonus than the Strike's normal Attribute, you may use it instead. Damage adds Might where the Strike allows it.</div>`
    +`<h3>Magical Constellations</h3>`
    +`<div class="callout" style="border-color:#7A5CB8"><b>Each magical discipline is a Constellation of its own</b>, and its Training root grants its foundational spell, at will. A <b>specialty</b> is a group of Talents within the discipline, exactly as a Combat Style is within Melee: it shares the discipline's rank and has none of its own. Every offensive spell is at will once learned through a Talent: no slots, no mana, no recharge. A caster Calling's first-Calling grant opens one discipline.</div>`
    +tbl(["Discipline","Key attribute","About","Specialties"],magicParents().map(mp=>{const tr=treeOf(mp); return [link(mp),tr.feeds,tr.meta||"",childrenOf(mp).map(link).join(", ")||"—"];}))
    +P("<b>Cast ❷ to ❹.</b> Cast is the Maneuver for at-will offensive spellwork. Roll the discipline's proficiency with the spell's Key Attribute against a Defense its Threat permits. The Talent sets the spell's range, targets, Delivery, damage type, and effects; there is no universal magic attack proficiency.")
    +tbl(["Cast","What it does"],(R.castKinds||[]).map(r=>[`<b>${r[0]}</b>`,r[1]]))
    +P("<b>Damage Dice</b> come from the discipline's rank alone: Trained 1, Expert 2, Master 3, Legendary 4. The spell names each die's size and type. A Quick Cast rolls one die whatever your rank, and no spell gains extra targets from a higher rank; its own listing controls its effects. Spell damage adds no Might and no weapon specialization.")
    +tbl(["Rank in the discipline","Damage Dice"],(R.spellwork||[]))
    +(()=>{ const magicTrees=allTreeNames().filter(n=>treeOf(n).category==="Magic"); let s="";
      for(const mp of magicParents()){ const list=[mp,...childrenOf(mp)].filter(n=>magicTrees.includes(n));
        const spells=list.flatMap(n=>treeOf(n).nodes.filter(nd=>nd.spell).map(nd=>({tree:n,node:nd})));
        if(!spells.length) continue;
        s+=`<h4>${link(mp)}: spells</h4>`+spells.map(({tree,node})=>`<div style="margin:4px 0 8px"><b>${node.name}</b> <span class="muted">(${tree===mp?"the discipline's root":tree}, ${TIERN[node.tier]})</span><div style="font-size:12px">${node.effect}</div>${spellHTML(node.spell)}</div>`).join(""); }
      return s||P("No spell Talents are in the data yet."); })();

  if(wikiSec==="Equipment") h+=`<div class="callout"><b>What gear does, and what it doesn't.</b> Your sword does not make you accurate and your armor does not make you hard to hit. Skill does that, and skill lives in your Talents and in your Constellations. Gear decides what happens when steel finally meets you: a weapon sets the size of the wound, armor sets how much of that wound your body actually feels. This is why there are <b>no magic plusses</b> in STARWROUGHT. Quality, craftsmanship, and enchantment give a weapon <b>Traits</b>, never numbers. A masterwork blade is not a +1 sword; it is a sword that can do something an ordinary one cannot.</div>
    ${P("<b>Starting equipment.</b> You begin play with <b>15 gold pieces</b>. Spend it on the tables below, plus a travelling kit: pack, bedroll, rope, rations for a week, torches, flint, waterskin, and the tools of your trade, all of which cost coppers and none of which needs tracking.")}
    <h3>Armor</h3>`
    +P("Armor is worn in four places: Arms, Legs, Torso, Head. Each Zone holds one piece, and each piece is bought, worn, and lost separately. There is no such thing as 'a suit of plate' on your sheet; there is a Plate Cuirass, a Full Helm, Plate Arms, and Plate Legs, and you own as many as you can afford. Each piece has <b>Protection</b> (subtracted once from a Zoned Attack's damage on that Zone, a Graze included), <b>Load</b>, a <b>Type</b> (Padded, Leather, Mail, Lamellar, Brigandine, Splint, or Plate), and Traits. Your torso is the number that matters most, because ordinary Hits land there. The other three Zones come into play when someone has earned an opening.")
    +`<div class="callout" style="border-color:#B8860B"><b>Load Strain</b> = the Load of all the armor you are wearing and of a shield you carry, less 1 for a Fitted harness and less your Endure relief, to a minimum of 0. It never comes off your <b>Evade</b>, and it is no blanket penalty on Might or Agility: a fit fighter in a fitted harness runs, rolls, and wrestles like anyone else. What it costs is breath and the margins of movement, as the two points below say. Training in ${link("Endure")} reduces Load Strain as your Proficiency Rank in it rises: by 1 at Trained, 2 at Expert, 3 at Master, and 4 at Legendary.</div>`
    +`<h4>What armor costs in a fight</h4>`
    +P("Heavier armor does not make you easier to hit, and it costs a fighter nothing on the roll, Guard or Evade. In exchange for its Protection it costs two other things, both of them real. <b>Wind.</b> If your Load Strain is at least 1, then at the end of every round while in an encounter, you must roll Endure against <b>10 + Load Strain</b>. On a failure your Fatigued rises by 1, on a critical failure by 2: Fatigued N is a −N Condition penalty to your four Defenses and your attack rolls, to a maximum of 3, and it ends after ten minutes of rest (see Conditions). There is no exemption for a high Endure Threshold; Endure feeds Might, so training and strength both carry the harness, and both make the roll easier. <b>Speed at the margin.</b> Armor does not slow a walk; it kills a sprint and a climb. Your Load Strain is a Condition penalty on Stealth, Acrobatics, Climb, and Swim checks (a Flexible piece counts its Load 1 lower for Climb and Swim), and your Rush and Leap distances are reduced by your Load Strain in feet. <b>Sight</b> is a matter of the piece, not the Load: a Visored helm lowered is a −1 Gear penalty to Awareness and Initiative, and raised, that Zone's Protection is 1 lower and nothing else; a Noisy piece is a −1 Gear penalty to Stealth, each piece counted.")
    +tbl(["Piece","Zone","Protection","Load","Price","Traits","Type"],(R.armorPieces||[]).map(r=>[r[0],r[1],r[2],r[3],r[4],r[5]||"—",r[6]||"—"]))
    +`<h3>Armor Types and the Fitted harness</h3>`
    +P("Every piece has a <b>Type</b>: Padded, Leather, Mail, Lamellar, Brigandine, Splint, or Plate. The Type names what the piece is made of and is what an Armor-Piercing weapon reads; a Type has no weakness of its own, and no damage type turns a Zone's Protection down. <b>Fitted harness.</b> If you wear pieces with the Fitted trait in at least three Zones, and they have all been adjusted to you, your Load Strain is reduced by 1. A complete kit sits and moves better than a collection.")
    +P("Putting on or taking off a single piece takes 1 minute per point of Protection it has (minimum 1 minute). An Attended piece takes twice as long without help. You cannot sleep in armor without waking up with Fatigued equal to your Load Strain (maximum 3), <i>unless it has the Comfort trait</i>. A complete harness of plate with a Full Helm is four pieces, Load 8, Load Strain 7 (less 1 for the Fitted harness, and less your Endure relief), and 62 gp.")
    +`<h3>Shields</h3>`
    +P("A shield is not armor. It grants no Protection, because it does not cover a Zone; it is a tool you actively interpose, which is why it improves <b>Guard</b> and only while you Raise it. <b>Raise a Shield ❶</b> grants the Gear bonus to Guard for physical Attacks until your next Opportunity. A Raised shield is a <b>rigid implement</b>: you may Parry, Bind, and Gain Control with it, and a shield that Controls a foe's weapon opens a Zone for the sword in your other hand. Hardness matters only if you have the Shield Block talent: it is how much damage the shield swallows before the rest reaches you, and it applies to harm the shield can plausibly intercept, normally a Zoned Attack, never automatically to Pervasive gas, heat throughout an area, or a direct mental effect; a Blast stays an Evade or Endure Threat unless its own rule permits Guard with a raised shield. A tower shield gives you Cover when Raised, and Greater Cover if you Take Cover while it is Raised.")
    +tbl(["Shield","Gear bonus to Guard when Raised","Hardness","Load","Price","Note"],
      (R.shields||[]).map(s=>[s[0],s[1]?"+"+s[1]:"—",s[2],s[3],s[4],s[5]]))
    +`<h3>Weapons</h3>`
    +P("A weapon gives you a damage die and a handful of Traits. It never touches your attack roll; that comes from your Melee or Ranged Proficiency and your Strike Attribute. <b>Weapon dice follow your rank</b> in Melee or Ranged: a Deliberate or Committed Strike rolls <b>one weapon die at Trained, two at Expert, three at Master, and four at Legendary</b>, plus your Might where the Strike allows it, plus whatever the Attack or your Talents expressly add. There is no separate weapon specialization bonus; the rank progression is the dice. A Quick Strike ❶ rolls one weapon die whatever your rank. <b>A Graze deals the damage the Maneuver prints</b>: for a Deliberate or Committed Strike that is normally one weapon die rather than the rank's full dice, with precision or other extras only where a Maneuver or Talent expressly allows them; then subtract the Protection of the Zone it landed on, which alone never takes positive damage below 1.")
    +`<div class="callout" style="border-color:#B8860B"><b>Traits that shape the Exchange.</b> <b>Parry</b>: a guard built for defense, +1 Gear bonus to Guard against melee Attacks while you wield it. <b>Agile</b>: light enough to bite on the way in; a Quick Strike ❶ with it may Critically Hit. <b>Flexible</b> (whips, flails): it cannot Parry, form a Bind, or be Bound, though you can still Guard with it. <b>Unwieldy [N]</b>: −2 Situation penalty to attack rolls against a target within N feet, no attacking with it while Grabbed, and a creature within N feet that you attack with it may Intercept you, as though you had entered its Reach. <b>Massive</b>: any Critical Hit Wounds, Exposed Zone or not; reserved for the largest creatures. <b>Unparryable</b>: cannot be answered with Parry and offers nothing to Bind; Guard still applies. <b>Deadly dX</b> is added after the doubling on a Critical Hit and is not itself doubled. <b>Armor-Piercing [Type]</b>: against a Zone protected by a listed armor Type, the struck Zone's Protection is reduced by up to the Strike's normal weapon dice, once per Strike. <b>Finesse</b> lets a melee Strike use Agility; <b>Thrown X</b> uses Might for the attack roll and Ranged proficiency; <b>Ranged [N]</b> uses Agility; <b>Mechanical</b> adds no Might to damage.</div>`
    +`<h4>Handling</h4>`
    +P("All weapons are Intuitive, Practiced, or Technical. Intuitive weapons use your full Melee or Ranged Proficiency Bonus; Practiced and Technical weapons do not unless you are Familiar with them, which comes from the Weapon Familiarity talent (the Weaponmaster Calling grants it free).")
    +tbl(["Handling","Meaning","If you lack Familiarity"],(R.handling||[]))
    +`<h4>Melee weapons</h4>`+tbl(["Weapon","Handling","Group","Damage","Reach (ft)","Traits","Price"],(R.weaponsMelee||[]))
    +`<h4>Ranged weapons</h4>`+tbl(["Weapon","Handling","Group","Damage","Range","Traits"],(R.weaponsRanged||[]))
    +`<h4>Weapon Size</h4>`
    +P("Every weapon has a Size, the creature it was made for; the tables above are Medium unless stated. Reach assumes a Medium weapon: Weapon Reach = normal Reach × the Weapon Size Factor, and when rounding down, treat 0 ft as Adjacent. You may wield a weapon of your Size or smaller, never larger unless a Talent or creature ability says so, and a weapon retains its own damage, Reach, Traits, and hands required whoever holds it: a Large ogre with a Medium dagger has a Medium dagger's Reach, though the ogre's Natural Reach still lengthens its Total Reach. <b>Total Reach = your Natural Reach + the weapon's Reach</b>, measured from the edge of your space to the edge of your target's.")
    +tbl(["Weapon Size","Weapon Size Factor"],(R.weaponSize||[]));

  if(wikiSec==="Traits") h+=`<div class="callout">A Trait is a word attached to an action, a Talent, an item, a spell, or another word that plugs it into a rule written somewhere else. Traits keep the game rules from repeating themselves: rather than writing "a foe answers this with a Defense, as an Exchange" on forty different things, each one simply has the Attack trait. <b>A Trait is never flavor.</b> If the word is in a Trait line, some rule cares about it.</div>
    <h3>Maneuver traits</h3>${tbl(["Trait","What it means"],(R.actionTraits||[]))}
    <h3>Weapon traits</h3>${tbl(["Trait","Effect"],(R.weaponTraits||[]))}
    <h3>Armor traits</h3>${tbl(["Trait","Effect"],(R.armorTraits||[]))}`;

  if(wikiSec==="Conditions") h+=tbl(["Condition","In one line"],R.conditions);

  // the roster's exploration and downtime rows may carry columns past the third for Foundry alone (0.7.2: the
  // Constellation an Activity rolls now and the one it rolls for Initiative); the tables here print three
  if(wikiSec==="Maneuvers") h+=`<div class="callout">A <b>Maneuver</b> is anything you do at an Opportunity: a Step, a Strike, a Gain Control, a spell. Each has a cost in actions, the six you receive each round, marked ⓿, ❶, ❷, ❸, and so on. A Maneuver of two or more actions is a single indivisible thing: interrupt it and you lose all of it. A <b>⓿ Maneuver</b> costs no actions and never uses up your Opportunity: you may perform any number of them alongside the Maneuver you take, and ⓿ Reactions whenever their Trigger occurs. You take <b>one Maneuver at each of your Opportunities</b>. Between Opportunities you may spend actions only on <b>Reactions ↺</b>: Maneuvers with the Reaction trait, performed the moment their Trigger occurs. A Maneuver of ❸ or more is <b>Prepared</b>: spend one action now and set the rest aside as reserved; at your next Opportunity you must finish it or abandon it (losing the action spent), and taking a Wound abandons it for you. <b>Pass</b> is not a Maneuver at all: it is declining your Opportunity, and a full circuit of Passes ends the round.</div>`
    +`<h3>Encounter Mode</h3>`
    +sheetTables("Encounter")
    +Object.entries(R.actions||{}).map(([grp,rows])=>{ const kept=notSheet(rows);
      return kept.length?`<h4>${grp}</h4>`+tbl(["Maneuver","Traits","Effect"],kept):""; }).join("")
    +`<h3>Exploration Mode</h3>`
    +P("Your Travel Speed is <b>Speed × 40 feet per minute</b>, <b>Speed ÷ 2 miles per hour</b>, or <b>Speed × 4 miles per day</b>. Exploration Mode Activities (such as Avoid Notice) halve it, except Hustle, which doubles it. Difficult Terrain halves it; Greater Difficult Terrain cuts it to one-third. As a rule of thumb, it takes about 10 minutes to proceed through a location while performing Activities such as Search, be it a ballroom, a dungeon corridor, or a forest clearing.")
    +sheetTables("Exploration")
    +tbl(["Activity","Speed","Effect"],notSheet(R.explorationActions).map(r=>r.slice(0,3)))
    +`<h3>Downtime Mode</h3>`
    +P("You spend days, and the GM typically tells you how many you have before the world begins to move quickly again. One activity per day: an activity that takes a week is the same choice made on seven consecutive days, and interrupting it loses the days already spent unless the GM says otherwise. Ordinary rest is not a Downtime Activity: a night's sleep already restores some of your Vigor but none of your Wounds; Downtime is for the things a night's rest cannot fix.")
    +sheetTables("Downtime")
    +tbl(["Activity","Duration","Effect"],notSheet(R.downtimeActions).map(r=>r.slice(0,3)));

  if(wikiSec==="Combat") h+=`
    <div class="callout"><b>Every attack in Starwrought is an exchange</b>: a sword, a fireball, a poisoned cup, or a lie told to a guard. A fencing master would tell you the first question is not whether it landed but who came out of it holding the advantage. One roll answers three things at once: whether harm landed, how much, and who is out of position. The exchange runs in the same order every time: the Attack is declared with its targets, the Defense answers it with any Reaction, the die decides the Result, the Damage and effects land, and the Position of everyone involved is settled.</div>
    ${tbl(["Step","Resolving an Exchange"],[
      ["1. Declare the Attack","The attacker names the Maneuver, its target or targets (within the Attack's Reach or Range and legal to target), the weapon, spell, or effect involved, and how many actions are behind it, and checks any Requirements. A Threat and a Delivery come with the Attack: a Blow, Blast, Blight, or Beguilement; Zoned or Pervasive."],
      ["2. Answer","The defender chooses one of the two Defenses the Threat permits (unless the GM or a rule names one), and whether to use a Reaction whose Trigger and Requirements are met, a ⓿↺ Posture among them. One answer per attack. Anything else that must be declared before the outcome is known is declared now."],
      ["3. Roll","The player rolls: their Attack against the chosen Defense Threshold, or their chosen Defense against the creature's Attack Threshold, with every bonus and penalty that applies. How far the roll beat or missed the Threshold gives the Result: Critical Hit, Hit, Graze, or Miss."],
      ["4. Apply the Harm","Roll the damage or effect the Result calls for and apply it where the Result puts it, in the order of operations for damage, along with any conditions, Wounds, Persistent Damage, or forced movement the Attack created."],
      ["5. Settle Position","If a Blow was Stopped, resolve the Bind, Control, ground given, and Exposure it causes."]])}
    ${P("<b>Reaction timing.</b> A Reaction occurs at the moment its Trigger describes, wherever that falls in the sequence: one triggered by a Move happens as the movement begins, one triggered by a Hit after the Result is read. Follow the Trigger's wording rather than waiting for the Exchange to end.")}
    <h3>1. The Attack</h3>
    ${P("Anything with the Attack trait is an Attack, and every Attack is answered with a Defense. A sword Strike is an Attack. So is a Grapple, a fireball, a dose of poison, and a lie. What they share is the check: <b>d20 + the Attribute the Attack uses + your Proficiency Bonus in the Constellation it belongs to + bonuses and penalties</b>, against the Threshold of the Defense that answers it. When a creature attacks, that number is its Attack Threshold, and the player rolls the Defense against it instead.")}
